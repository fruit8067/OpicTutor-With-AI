  - id: host-tts
    phase: [1]
    role: 가상 진행자(TTS·캐릭터 애니메이션) 담당
    owns:
      - backend/scripts/export_tts_jobs.py
      - colab/**
      - backend/static/tts/**
      - backend/app/host_lines.py
      - frontend/src/components/host/**
      - frontend/src/lib/hostAudio.ts
    prompt: |
      [역할] 시험 진행자의 목소리(사전 생성 mp3)와 음량에 반응하는 캐릭터를 만든다.
      우선순위는 "있으면 좋음"이다. 모양보다 "실패해도 시험이 멈추지 않는 것"이 먼저다.

      [작업]
      1. backend/app/host_lines.py: HOST_LINES dict
         greeting "Hi, I'm Rin. I'll be your interviewer today. Let's get started."
         say_again "Sorry, I didn't catch that. Could you say that again?"
         whenever_ready "Whenever you're ready."
         next "Okay. Let's move on to the next question."
         finish "That's the end of the test. Great job!"
         (진행자 이름 "Rin"은 임시. 바꾸면 handoff에 적는다.)
      2. TTS는 로컬에서 만들지 않는다. OmniVoice를 Google Colab GPU에서 돌려 mp3를 만들고,
         로컬로 가져와 정적 파일로만 서빙한다. 노트북 colab/omnivoice_tts.ipynb는 이미 제공되어 있으니
         구조를 바꾸지 말고 입력 형식만 맞춘다. 전체 과정은 docs/REQUIREMENTS_v2.md §4 F6을 따른다.
         a. backend/scripts/export_tts_jobs.py (로컬 실행)
            - questions.jsonl의 pilot 문항 + exam.py의 Q000 상수 + HOST_LINES를 모아
              backend/static/tts/jobs.jsonl을 만든다. Q000 문장은 exam.py에서 import해서 쓴다(복사 금지).
            - 한 줄 형식: {"id": "questions/Q001", "text": "...", "text_sha1": "<sha1(text)>"}
                          {"id": "host/greeting", "text": "...", "text_sha1": "..."}
            - --stale 옵션: backend/static/tts/manifest.json(노트북 결과물)과 비교해 text_sha1이 다르거나
              mp3가 없는 항목만 jobs.jsonl에 담는다(문장을 고친 것만 다시 생성하기 위함).
            - 끝에 전체 개수와 글자 수, 그리고 "colab/omnivoice_tts.ipynb에 업로드하세요"를 출력한다.
         b. Colab 결과물 tts_mp3.zip을 backend/static/tts/에 풀면
            questions/*.mp3, host/*.mp3, manifest.json이 생긴다.
            backend-api의 /health tts_cached는 manifest.json이 있고 jobs.jsonl의 모든 id에 mp3가 있으면 true.
            이 판정 함수 tts_status() -> dict를 backend/app/host_lines.py에 두고 handoff에 적는다.
         c. 이 단계는 로컬 패키지 의존성이 없다(requirements.txt에 TTS 패키지를 추가하지 않는다).
      3. frontend/src/lib/hostAudio.ts — [interfaces.host]
         - AudioContext 하나와 AnalyserNode(fftSize 512) 하나를 전역으로 쓴다.
         - playClip: new Audio(url) → MediaElementSource → analyser → destination.
           url이 null이거나 재생 오류(404 포함)가 나면 speechSynthesis(lang en-US, rate 0.95)로 fallbackText를 읽는다.
           Web Speech 경로는 analyser가 없으므로, 재생하는 동안 getAnalyser()가 null을 돌려주고
           Host는 일정한 리듬의 가짜 움직임으로 대신한다.
         - 같은 출처에서 서빙하지 않으면 crossOrigin="anonymous"를 설정한다.
      4. frontend/src/components/host/Host.tsx
         - 오리지널 캐릭터(SVG). 실제 OPIc 진행자나 알려진 캐릭터의 외형을 따라 하지 않는다.
           단순한 도형으로 얼굴, 눈, 입을 그린다.
         - requestAnimationFrame마다 analyser의 time-domain 데이터로 RMS(0~1) 계산 → 지수 평활(0.25)
           → translateY(-RMS*14px), rotate(sin(t)*RMS*6deg), 입 높이 = RMS 비례.
         - state: idle(3초 주기 숨쉬기 스케일 1.0~1.02), speaking(음량 반응), listening(고개 4도 기울임 + 귀 기울이는 표시).
         - prefers-reduced-motion이면 움직임을 최소화한다(입 모양만 변화).
         - 컴포넌트 외부로 노출하는 props는 state 하나뿐이다.
      5. frontend가 쓰는 임시 stub(src/components/host/__stub__/)이 있으면 실제 구현으로 대체하고 stub을 지운다.

      [완료 기준]
      - python -m scripts.export_tts_jobs로 jobs.jsonl이 생기고, Colab 결과 zip을 풀면 tts_status()가 true가 된다.
      - zip을 아직 안 받은 상태에서도 서버와 시험이 정상 동작한다(audio_url이 null → Web Speech).
      - mp3 파일을 지워도 Web Speech로 읽어서 시험이 계속된다.
      - 말할 때 캐릭터가 음량에 맞춰 움직이고, 말이 끝나면 idle로 돌아간다.

