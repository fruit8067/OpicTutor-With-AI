# AI-assisted: 신뢰한 기준 브랜치 소유권 검사는 OpenAI Codex의 도움으로 작성했습니다.
name: ownership
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
jobs:
  ownership:
    name: ownership-local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML
      - name: Check against trusted main contract and checker
        env:
          PR_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:agents/tools/check_ownership.py > "$RUNNER_TEMP/check_ownership.py"
          git show origin/main:agents/contracts.yaml > "$RUNNER_TEMP/contracts.yaml"
          case "$PR_BRANCH" in
            orchestrator/*) role=orchestrator ;;
            agent/*) role="${PR_BRANCH#agent/}" ;;
            *) echo "Unsupported role branch"; exit 1 ;;
          esac
          extra=()
          if [[ "$role" == bootstrap ]] && ! git cat-file -e origin/main:backend/app/config.py 2>/dev/null; then
            extra+=(--phase0)
          fi
          python "$RUNNER_TEMP/check_ownership.py" "$role" --repo "$GITHUB_WORKSPACE" --contract "$RUNNER_TEMP/contracts.yaml" "${extra[@]}"
