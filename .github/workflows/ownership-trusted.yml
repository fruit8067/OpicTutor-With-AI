# AI-assisted: main의 신뢰한 코드만 실행하는 소유권 검사는 OpenAI Codex의 도움으로 작성했습니다.
name: trusted ownership
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
  checks: write
jobs:
  verify:
    name: trusted ownership runner
    runs-on: ubuntu-latest
    steps:
      - name: Start ownership check on PR head
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const r = await github.rest.checks.create({
              ...context.repo, name: 'ownership', head_sha: context.payload.pull_request.head.sha,
              status: 'in_progress', details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            core.setOutput('id', r.data.id);
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML
      - name: Inspect objects without executing PR code
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$PR_HEAD"
          case "$PR_BRANCH" in
            orchestrator/*) role=orchestrator ;;
            agent/bootstrap|agent/data-layer|agent/session-api|agent/corpus|agent/grader|agent/worker-stt|agent/tts-host|agent/frontend|agent/integrator|agent/reviewer) role="${PR_BRANCH#agent/}" ;;
            *) echo 'Unsupported role branch'; exit 1 ;;
          esac
          extra=()
          if [[ "$role" == bootstrap ]] && ! git cat-file -e origin/main:backend/app/config.py 2>/dev/null; then extra+=(--phase0); fi
          python agents/tools/check_ownership.py "$role" --head "$PR_HEAD" "${extra[@]}"
      - name: Complete ownership check
        if: always() && steps.check.outputs.id
        uses: actions/github-script@v7
        env:
          CHECK_ID: ${{ steps.check.outputs.id }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.checks.update({
              ...context.repo, check_run_id: Number(process.env.CHECK_ID), status: 'completed',
              conclusion: process.env.JOB_STATUS === 'success' ? 'success' : 'failure',
              output: {title: 'Ownership against trusted main', summary: 'Only trusted main code and contract are executed. PR content is inspected as Git data.'}
            });
