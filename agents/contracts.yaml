# OpicTutor — 구현 계약 (모든 에이전트 공통, 단일 기준)
#
# 이 파일이 모듈 경계·API·DB·데이터 파일 형식의 "단일 기준(source of truth)"이다.
# - 요구사항 기준: docs/REQUIREMENTS_v2.md, docs/FLOWCHART.md (이 계약은 그 요구사항을 구현 형태로 옮긴 것)
# - docs/API_SPEC.md는 bootstrap 에이전트가 이 파일을 바탕으로 v2로 다시 쓴다.
# - 이 파일은 orchestrator만 수정한다. 변경이 필요하면 agents/orchestration.yaml의 change_request 절차를 따른다.
# - 수정할 때마다 contract_version을 올리고 changelog에 한 줄을 남긴다.
#
# AI-assisted: this contract was written with help from Claude (Anthropic).

contract_version: 9
changelog:
  - "9 (2026-11-08, CR orchestrator-06, develop/v3): 비동기 STT — 답변 접수(create_answer) 트랜잭션에서 바로 순서 전진,
     STT는 이전 문항·제출 후(submitted)에도 반영, rejected/failed는 종결 상태(평가에서 인식 불가 문항),
     submit은 STT 완료를 기다리지 않고 submitted로 대기 → 마지막 STT 종결 또는 제출 중 나중 트랜잭션에서 평가 등록·채택 고정.
     SttProgress 응답 필드, GET /sessions/active 추가. 도메인 DB 스키마·평가 원문 변경 없음."
  - "8 (2026-11-07, CR tts-host-01): 새 TTS 반입은 텍스트 해시별 파일 경로로 저장해 기존 세션 음성을 보존.
     기존 평면 경로·Colab ZIP 입력은 호환 유지. HTTP·DB·공개 함수·평가 원문 변경 없음."
  - "7 (2026-11-07, CR orchestrator-04): 사용자 제공 Pickle URL/model·PICKLE_API_KEY 별칭,
     text-embedding-3-large/3072 기본값·VECTOR(3072) exact cosine 검색 및 모델별 임베딩 재사용/마이그레이션 규칙. HTTP·평가 원문 유지."
  - "6 (2026-11-07, CR data-layer-01): finish_evaluation의 im_rubric_version·corpus_version nullable 타입을
     기존 API/도메인 DB·비 IM 결과의 실제 동작에 맞춰 선언. 런타임·DB 스키마·평가 기준 변경 없음."
  - "5 (2026-11-07, CR session-api-01): app.db.get_session_id_by_request_id 조회 함수를 추가.
     생성 재전송은 저장 세션을 우선 반환하여 코퍼스 변경에 영향을 받지 않음. API·도메인 DB·평가 기준은 유지."
  - "4 (2026-11-06, CR orchestrator-01): 사용자 요청 Pickle LLM 환경설정/os.getenv 키, nullable tier 선언,
     TTS strip UTF-8 SHA1 정규화, 실제 provider 요청 기준 기록·3회 예산을 명확히 함. 평가 원문·API·도메인 DB 스키마는 v3 유지."
  - "3 (2026-11-06, commit d5ec5bb 반영): 평가 기준 v3(performance-feedback-actfl-speaking-v3, opic-evaluation-system-v3),
     로드용 원본 docs/prompts/opic_evaluation_system.md, 자기소개 워밍업 채점 제외(is_scored), 문항 과제·시간대·맥락 태그,
     dimension_scores(1~5) 폐지 → dimension_feedback(서술), coverage·sustained_performance·breakdown_observations·
     evaluation_scope·input_issues·additional_tasks_needed, items.evaluation_role·task_fulfillment, 카드 before null 허용,
     EVAL_INPUT_INVALID, contrast_sets_06~08 재업로드본(Q038~Q187)"
  - "1 (2026-11-06): REQUIREMENTS_v2(설정 단계 전체 세트·TTS 준비 → STT 저장 후 이동 → 종료 후 종합 평가) 기준 최초 작성"
  - "2 (2026-11-06, commit 09af0ef 반영): 고정 시스템 프롬프트(performance-feedback-actfl-speaking-v2) + 내부 IM 세분화(project-im-v1),
     base_level/estimated_level 2단 등급, FACT 차원·fact_evidence·경계 근거 필드, rubrics.jsonl 기본 기준 주입 중단,
     evaluations에 base_level·im_rubric_version 컬럼, 대조 세트 Q013~Q187(contrast_sets_04~08)"

# ===========================================================================
# 1. 고정 값
# ===========================================================================
levels: [NL, NM, NH, IL, IM1, IM2, IM3, IH, AL]   # estimated_level(세분 예상값). 이 밖의 값은 출력하지 않는다(AH 없음)
base_levels: [NL, NM, NH, IL, IM, IH, AL]          # base_level(고정 표의 7단계 큰 범주)
level_rules:
  - "base_level != IM 이면 estimated_level == base_level (또는 둘 다 null)"
  - "base_level == IM 이면 estimated_level ∈ {IM1, IM2, IM3} 또는 null(세분화 보류)"
  - "IM 세분값은 항상 '내부 기준에 따른 잠정 진단'(im_estimation_status=provisional)이다. 공식·검증 완료로 표현하지 않는다"

evaluation_criteria:
  rubric_version: performance-feedback-actfl-speaking-v3
  prompt_version: opic-evaluation-system-v3          # 시스템 프롬프트 버전(LLM system 역할)
  user_template_version_prefix: evaluate_exam        # grader의 user 메시지 템플릿 버전(evaluate_exam.v1 …)은 별도 기록
  im_rubric_version: project-im-v1
  assessment_basis: transcript_and_metrics           # 원음을 LLM에 보내지 않으므로 고정
  system_prompt_file: docs/prompts/opic_evaluation_system.md   # 로드용 원본. 런타임이 이 파일을 그대로 읽는다(복사본 금지)
  must_equal:                                         # 세 본문이 글자 단위로 같아야 함(줄바꿈 정규화 후). grader 테스트로 강제
    - "docs/prompts/opic_evaluation_system.md 전체"
    - "docs/REQUIREMENTS_v2.md F3 '**시스템 프롬프트 본문 시작**'~'**시스템 프롬프트 본문 끝**' 사이"
    - "OpicTutor.md 같은 구간"
  research_note: docs/OPIC_SCORING_RESEARCH.md
  rules:
    - 시스템 프롬프트 본문은 한 글자도 바꾸지 않는다. 바꾸려면 문서를 먼저 고치고 rubric_version·prompt_version을 올린다
    - system 역할에는 이 파일만 넣는다. 출력 스키마·평가 입력은 user 메시지와 Structured Output으로 따로 준다
    - 런타임에 ACTFL PDF를 다운로드·파싱·임베딩하지 않는다
    - rag_docs의 rubrics.jsonl(단어 수 경계·전형 길이)을 기본 채점 기준으로 프롬프트에 넣지 않는다
    - RAG는 문항별 대조 답변·승급 패턴의 보조 근거로만 쓴다
    - 영역별 숫자 점수·100점 환산·가중 평균을 만들지 않는다(dimension_feedback은 서술)
    - 자기소개(is_scored=false)는 등급 근거에서 제외하고 items의 feedback_only로만 피드백한다
    - 무음·STT 실패를 NL로 치환하지 않는다. 미출제 기능을 실패로 감점하지 않는다
    - 전사 기반 추정이므로 발음·억양을 평가했다고 표시하지 않는다

question_tags:     # questions.jsonl·session_questions에 저장. corpus가 실제 질문 요구만 태그한다(태그만 붙여 커버리지를 채우지 않음)
  is_scored: "bool. self_intro(Q000)=false, 나머지 true"
  target_functions: [self_introduce, describe, report_routine, narrate_past, compare, ask_information,
                     solve_problem, explain_issue, state_future_plan, express_opinion]
  target_time_frames: [present, past, future]
  context_scope: [personal_familiar, everyday_transaction, community_public, unexpected_situation]
  coverage_policy: |
    시나리오 빌드 시 채점 대상 7문항의 functions·time_frames·contexts 커버리지를 계산해 scenarios.json에 기록한다.
    future 시간대나 unexpected_situation이 없으면 실패가 아니라 경고(report)로 남기고, 세션 settings_json.coverage에 복사해
    결과의 coverage.gaps로 보이게 한다. 시험 중 문항을 추가하거나 세트를 바꿔 메우지 않는다.

tiers:            # 서버가 estimated_level → tier로 매핑한다. LLM은 tier를 만들지 않는다.
                  # estimated_level이 null이면(IM 세분화 보류, insufficient_evidence) tier도 null
  bronze:   {levels: [NL, NM, NH], color: "#B0794A"}
  silver:   {levels: [IL, IM1],    color: "#A8B3BD"}
  gold:     {levels: [IM2, IM3],   color: "#E3B341"}
  platinum: {levels: [IH],         color: "#4FC3C7"}
  diamond:  {levels: [AL],         color: "#7C8CFF"}

question_types: [self_intro, description, routine, past_experience, comparison, issue,
                 roleplay_ask, roleplay_solve, roleplay_experience]

dimensions:       # FACT. v3부터 숫자 점수 없음 — dimension_feedback {summary, evidence_order_nos[], limitations[]}
  functions_tasks: "F — 과제 수행"
  accuracy: "A — 의미 전달의 정확성"
  context_content: "C — 상황·내용 범위"
  text_type: "T — 발화 구성"
fact_status: [demonstrated, not_demonstrated, not_observed]   # not_observed는 낮은 점수의 근거가 아님(기술적 결측 포함)
task_fulfillment: [fulfilled, partial, not_fulfilled, not_assessable]
evaluation_role: [scored, feedback_only]
example_kind: [correction, practice]                           # practice면 before는 null 가능
im_estimation_status: [provisional, insufficient_evidence, not_applicable]
level_boundaries_to_measure: ["NH/IL", "IL/IM1", "IM1/IM2", "IM2/IM3", "IM3/IH", "IH/AL"]

policies:
  question_count: 8               # 자기소개 워밍업 1(is_scored=false) + 채점 대상 7
  scored_question_count: 7
  replay_limit: 1                 # 첫 재생은 세지 않음. 다시 듣기만 1회
  record_min_ms: 2000
  record_max_ms: 120000
  upload_max_bytes: 10485760      # 10MB
  upload_client_duration_tolerance_ms: 5000
  accepted_mime: ["audio/webm", "audio/ogg", "audio/wav", "audio/mp4"]
  poll_interval_ms: 2000
  grading_poll_slow_notice_ms: 180000
  llm_transient_retries: 2        # 일시 오류만, 최대 2회 추가 재시도
  job_lease_sec: 60
  job_max_attempts: 3
  evidence_token_budget: 24000    # 근거 자료(루브릭 제외 대조 예시)의 토큰 상한
  input_token_hard_limit: 60000   # 전체 입력이 넘으면 EVAL_INPUT_TOO_LARGE로 실패(조용히 자르지 않음)
  disclaimer: "합성 예시로 구성한 기준을 참고한 AI 예상 등급입니다. 공식 OPIc 결과가 아닙니다."
  im_provisional_label: "내부 세분화 기준에 따른 잠정 진단"
  im_min_evidence: "서로 다른 문항 유형 2개 이상에서 인용 근거 2개 이상 (project-im-v1 내부 규칙, ACTFL 공식 조건 아님)"
  metrics_version: "m1"
  stt_version_format: "faster-whisper:{model}:{metrics_version}"

# ===========================================================================
# 2. 상태 값
# ===========================================================================
session_status:
  preparing:      설정 제출됨. 전체 세트 저장 완료, TTS 연결 작업 진행 중
  prepare_failed: TTS 누락·해시 불일치 등. 같은 세트로 재시도 가능
  ready:          전체 문항 + 진행자 대사 음성 연결 완료. 시험 시작 가능
  cancelled:      취소(설정 변경 포함). 종료 상태
  in_progress:    시험 중
  submitted:      전체 문항 답변 접수(또는 건너뜀) 후 제출됨. 남은 STT를 기다린다. STT가 모두 종결되면
                  같은 트랜잭션에서 채택 답변을 고정하고 평가 작업을 등록해 grading으로 넘어간다(v3)
  grading:        종료 후 종합 평가 중
  grading_failed: 평가 실패. 저장된 전체 답변으로 재평가 가능
  done:           검증된 결과 저장 완료(assessed 또는 insufficient_evidence)

session_transitions:            # 이 표 밖의 전이는 409 INVALID_STATE
  - [preparing, ready]
  - [preparing, prepare_failed]
  - [prepare_failed, preparing]   # POST /prepare/retry
  - [preparing, cancelled]
  - [prepare_failed, cancelled]
  - [ready, cancelled]
  - [ready, in_progress]          # POST /start
  - [in_progress, submitted]      # POST /submit
  - [submitted, grading]          # 마지막 STT 종결 트랜잭션 또는 (STT가 먼저 끝났으면) 제출 트랜잭션에서
  - [grading, done]
  - [grading, grading_failed]
  - [grading_failed, grading]     # POST /regrade
  - [done, grading]               # POST /regrade (새 run_no로 저장, 성공 전까지 이전 결과 유지)

answer_stt_status:
  queued:     업로드 저장 + stt 작업 등록
  processing: 워커가 처리 중
  done:       텍스트·지표 저장 + 채택 (순서 전진은 접수 때 이미 일어남, v3)
  rejected:   무음·너무 짧음·손상·의미 있는 발화 없음 (reject_reason). 종결 상태 — 평가에서 인식 불가 문항으로 처리(v3)
  failed:     처리 오류(작업 재시도 3회 소진). 종결 상태 — 평가 등록 전(in_progress/submitted)이면
              POST /retry-stt로 원음 재처리 가능, 아니면 인식 불가 문항으로 평가(v3)

reject_reasons: [too_short, too_long, silence, no_speech, corrupt, unsupported_format]

evaluation_status: [queued, running, done, failed]
assessment_status: [assessed, insufficient_evidence]

job_types:
  tts_prepare: {target: sessions.id,    handler: "app.tts.prepare:handle",   owner: tts-host}
  stt:         {target: answers.id,     handler: "app.stt.job:handle",       owner: worker-stt}
  evaluate:    {target: evaluations.id, handler: "app.grading.job:handle",   owner: grader}
job_status: [queued, running, done, failed, dead]   # failed = 재시도 대기, dead = 시도 소진
job_dedupe_keys:
  tts_prepare: "tts_prepare:{session_id}:{prepare_attempt}"
  stt:         "stt:{answer_id}:{stt_attempt}"
  evaluate:    "evaluate:{session_id}:{run_no}"

# ===========================================================================
# 3. 환경 변수 (backend/.env.example — bootstrap이 전부 작성, 이후 추가는 change_request)
# ===========================================================================
env_vars:
  DATABASE_URL: postgresql://opic:opic@127.0.0.1:5432/opic
  API_HOST: 127.0.0.1
  API_PORT: "8000"
  CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
  DATA_DIR: ../data                      # backend/ 기준. 원음은 {DATA_DIR}/audio/{session_id}/{answer_id}.{ext}
  TTS_DIR: static/tts                    # backend/ 기준
  RAG_BUILD_DIR: ../rag_docs/build
  EVAL_SYSTEM_PROMPT_PATH: ../docs/prompts/opic_evaluation_system.md   # v3 로드용 원본(복사본 금지)
  LLM_BASE_URL: https://llm.pcl.kr/v1       # 사용자 실습의 OpenAI 호환 endpoint
  LLM_API_KEY: ""                         # os.getenv; 비어 있으면 PICKLE_API_KEY 사용
  PICKLE_API_KEY: ""                      # os.getenv 별칭. LLM_API_KEY가 있으면 우선
  LLM_MODEL: pickle-general
  LLM_TIMEOUT_SEC: "90"
  EMBED_BASE_URL: https://api.openai.com/v1
  EMBED_API_KEY: ""
  EMBED_MODEL: text-embedding-3-large
  EMBED_DIM: "3072"
  WHISPER_MODEL: small.en
  WHISPER_DEVICE: cpu                    # cpu | cuda
  WHISPER_COMPUTE_TYPE: int8             # cpu=int8, cuda=float16
  WORKER_ID: ""                          # 비우면 hostname-pid
  WORKER_JOB_TYPES: tts_prepare,stt,evaluate
  LOG_LEVEL: INFO

# ===========================================================================
# 4. 폴더와 소유권 (경로 → 담당 에이전트). 소유자만 해당 경로를 수정한다.
#    bootstrap은 Phase 0에서 아래 파일의 "빈 껍데기(stub)"를 만들고, Phase 1부터 소유자에게 넘긴다.
#    agents/tools/check_ownership.py가 이 표로 브랜치 변경 파일을 검사한다(먼저 매칭되는 규칙 우선).
# ===========================================================================
ownership:
  - {path: "agents/**",                          owner: orchestrator}
  - {path: "docs/REQUIREMENTS_v2.md",            owner: orchestrator}
  - {path: "docs/FLOWCHART.md",                  owner: orchestrator}
  - {path: "docs/prompts/**",                    owner: orchestrator}   # 평가 기준 원본. 에이전트는 읽기만
  - {path: "docs/OPIC_SCORING_RESEARCH.md",      owner: orchestrator}
  - {path: "PROJECT_REQUIREMENTS.md",            owner: orchestrator}
  - {path: "docs/API_SPEC.md",                   owner: bootstrap}      # Phase 0에서 v2 작성 후 orchestrator 소유
  - {path: "docs/handoff/{agent_id}.md",         owner: "{agent_id}"}   # 각자 자기 파일만
  - {path: "docs/change-requests/{agent_id}-*.md", owner: "{agent_id}"}
  - {path: "docs/REVIEW.md",                     owner: reviewer}
  - {path: ".gitignore",                         owner: bootstrap}
  - {path: "docker-compose.yml",                 owner: bootstrap}
  - {path: "backend/.env.example",               owner: bootstrap}
  - {path: "backend/requirements.txt",           owner: bootstrap}      # -r requirements/*.txt만 담음
  - {path: "backend/requirements/{agent_id}.txt", owner: "{agent_id}"}  # 각자 패키지는 자기 파일에
  - {path: "backend/app/config.py",              owner: bootstrap}
  - {path: "backend/app/schemas/**",             owner: bootstrap}      # 변경은 change_request
  - {path: "backend/app/errors.py",              owner: bootstrap}
  - {path: "rag_docs/**",                        owner: corpus}
  - {path: "backend/migrations/**",              owner: data-layer}
  - {path: "backend/app/db/**",                  owner: data-layer}
  - {path: "backend/app/llm/embeddings.py",      owner: data-layer}
  - {path: "backend/scripts/ingest_rag.py",      owner: data-layer}
  - {path: "backend/scripts/db_reset.py",        owner: data-layer}
  - {path: "backend/app/main.py",                owner: session-api}
  - {path: "backend/app/api/**",                 owner: session-api}
  - {path: "backend/app/exam/**",                owner: session-api}
