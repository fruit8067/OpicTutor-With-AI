# ===========================================================================
# 5. 데이터 파일 형식
# ===========================================================================
data_files:
  questions_jsonl:
    path: rag_docs/build/questions.jsonl
    owner: corpus
    note: |
      기존 필드(id, question_type, topic, survey, difficulty, status, question, doc_type, text) 유지.
      v3 추가 필드(pilot 전부 필수): is_scored, target_functions, target_time_frames, context_scope (question_tags 어휘만).
      출제에는 status == "pilot"만 쓴다. Q000(self_intro, is_scored=false)을 pilot으로 추가한다:
      "Let's start the interview now. Tell me a little bit about yourself."
  scenarios_json:
    path: rag_docs/build/scenarios.json
    owner: corpus
    example: |
      {
        "version": "2026-11-06.1",
        "scenarios": [
          {
            "scenario_id": "default",
            "label": "기본 구성",
            "description": "여러 주제가 섞인 기본 모의고사",
            "slots": [
              {"order_no": 1, "question_types": ["self_intro"],  "is_scored": false, "pool": ["Q000"]},
              {"order_no": 2, "question_types": ["description"], "is_scored": true,  "pool": ["Q001", "Q006"]},
              {"order_no": 8, "question_types": ["issue", "roleplay_experience"], "is_scored": true, "pool": ["Q009", "Q012"]}
            ],
            "coverage": {"functions": ["describe", "..."], "time_frames": ["present", "past"],
                         "contexts": ["personal_familiar", "..."], "warnings": ["future 시간대 요구 문항 없음"]}
          }
        ]
      }
    rules:
      - slots는 order_no 1..8을 빠짐없이 가진다. order_no 1만 is_scored=false
      - coverage는 pool 전체가 아니라 "어떤 문항이 뽑혀도 보장되는" 채점 대상 커버리지(교집합)와 경고
      - pool의 모든 id는 questions.jsonl의 pilot이며 question_type이 slot의 question_types에 속한다
      - 한 시나리오의 슬롯들에서 서로 다른 문항 8개를 뽑을 수 있어야 한다(중복 없이). corpus가 빌드 시 검사
      - 이 검사를 통과한 시나리오만 파일에 넣는다(지원 가능한 시나리오만 노출)
  corpus_version:
    path: rag_docs/build/VERSION
    owner: corpus
    note: "한 줄 문자열(예: 2026-11-06.1). ingest 시 rag_docs.corpus_version, 평가 시 evaluations.corpus_version에 기록"
  tts_jobs_jsonl:
    path: backend/static/tts/jobs.jsonl
    owner: tts-host
    line: '{"id": "question/Q001", "kind": "question", "ref_id": "Q001", "text": "...", "text_sha1": "<sha1(utf-8 text)>"}'
    kinds: [question, host, e2e_answer]
  tts_manifest:
    path: "backend/static/tts/{voice_id}/manifest.json  (Colab 노트북 출력, import_tts가 반입)"
    owner: tts-host
    shape: |
      {"engine": "k2-fsa/OmniVoice", "model_revision": "<HF commit sha 또는 unknown>",
       "instruct": "...", "seed": 42, "speed": 0.95, "num_step": 32,
       "settings_version": "<sha1(위 6개 값 JSON, 정렬 키)>[:10]",
       "items": [{"id": "question/Q001", "text_sha1": "...", "seconds": 7.4}]}
    voice_id: "settings_version과 같은 값을 voice_id로 사용"
    local_import: "로컬 반입 후 items에 TTS_DIR 기준 상대 file_path를 기록한다. 새 자산은 voice_id/kind/ref_id/text_sha1.mp3;
      file_path 없는 기존 manifest는 voice_id/kind/ref_id.mp3로 읽는다. Colab ZIP 입력 형식은 유지한다."
  active_voice:
    path: backend/static/tts/active_voice.json
    owner: tts-host
    shape: '{"voice_id": "a1b2c3d4e5"}'
  host_lines:
    owner: tts-host
    keys:
      greeting: "Hi, I'm Rin. I'll be your interviewer today. Let's get started."
      say_again: "Sorry, I didn't catch that. Could you say that again?"
      next: "Okay. Let's move on to the next question."
      finish: "That's the end of the test. Thank you."
    note: "진행자 이름은 임시. 바꾸면 change_request 없이 tts-host가 수정 가능(텍스트 해시로 자동 무효화)"
  audio_files:
    answer: "{DATA_DIR}/audio/{session_id}/{answer_id}.{webm|ogg|wav|m4a}"
    tts_url: "/media/tts/{voice_id}/{kind}/{ref_id}/{text_sha1}.mp3 (새 반입). 기존 /media/tts/{voice_id}/{kind}/{ref_id}.mp3도 유지.
      FastAPI StaticFiles, TTS_DIR 마운트. 클라이언트는 서버가 준 URL을 그대로 사용한다."
    tts_preservation: "문장 변경 반입은 기존 파일/등록본을 덮어쓰거나 삭제하지 않는다. 기존 세션의 음성 URL을 보존한다."

# ===========================================================================
# 6. DB 스키마 — backend/migrations/001_init.sql (bootstrap 작성 → data-layer 소유)
# ===========================================================================
db_schema_sql: |
  CREATE EXTENSION IF NOT EXISTS vector;
  CREATE EXTENSION IF NOT EXISTS pgcrypto;

  CREATE OR REPLACE FUNCTION set_updated_at() RETURNS trigger AS $$
  BEGIN NEW.updated_at = now(); RETURN NEW; END; $$ LANGUAGE plpgsql;

  CREATE TABLE IF NOT EXISTS sessions (
    id                  UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    client_request_id   TEXT UNIQUE,
    replaces_session_id UUID NULL REFERENCES sessions(id),
    scenario_id         TEXT NOT NULL,
    settings_json       JSONB NOT NULL DEFAULT '{}'::jsonb,
    status              TEXT NOT NULL CHECK (status IN ('preparing','prepare_failed','ready','cancelled',
                          'in_progress','submitted','grading','grading_failed','done')),
    question_count      INT  NOT NULL,
    current_order_no    INT  NOT NULL DEFAULT 1,       -- question_count + 1 이면 모든 답변 저장 완료
    prepare_attempt     INT  NOT NULL DEFAULT 1,
    prepare_error_json  JSONB NULL,                    -- [{order_no|host_key, ref_id, error_code}]
    selected_answer_ids UUID[] NULL,                   -- submit 때 고정
    result_id           UUID NULL,                     -- 현재 표시할 evaluations.id
    started_at TIMESTAMPTZ NULL, submitted_at TIMESTAMPTZ NULL,
    created_at TIMESTAMPTZ NOT NULL DEFAULT now(), updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
  );

  CREATE TABLE IF NOT EXISTS tts_assets (
    id               UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    cache_key        TEXT NOT NULL UNIQUE,             -- "{kind}:{ref_id}:{text_hash}:{voice_id}"
    kind             TEXT NOT NULL CHECK (kind IN ('question','host','e2e_answer')),
    ref_id           TEXT NOT NULL,                    -- question_id 또는 host line key
    text_hash        TEXT NOT NULL,                    -- sha1(text.strip().encode('utf-8'))
    voice_id         TEXT NOT NULL,
    settings_version TEXT NOT NULL,
    status           TEXT NOT NULL CHECK (status IN ('available','missing','invalid')),
    file_path        TEXT NOT NULL,                    -- TTS_DIR 기준 상대 경로
    duration_sec     REAL NULL,
    error_code       TEXT NULL,
    created_at TIMESTAMPTZ NOT NULL DEFAULT now(), updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
  );

  CREATE TABLE IF NOT EXISTS session_questions (
    id               UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    session_id       UUID NOT NULL REFERENCES sessions(id) ON DELETE CASCADE,
    order_no         INT  NOT NULL,
    question_id      TEXT NOT NULL,
    question_version TEXT NOT NULL,                    -- sha1(question_text)[:12]
    question_text    TEXT NOT NULL,
    question_type    TEXT NOT NULL,
    is_scored        BOOLEAN NOT NULL,                 -- 자기소개 워밍업 false
    target_functions   TEXT[] NOT NULL DEFAULT '{}',   -- question_tags.target_functions
    target_time_frames TEXT[] NOT NULL DEFAULT '{}',
    context_scope      TEXT[] NOT NULL DEFAULT '{}',
    tts_asset_id     UUID NULL REFERENCES tts_assets(id),
    replay_count     INT  NOT NULL DEFAULT 0,
    skipped_at       TIMESTAMPTZ NULL,                 -- 004: 사용자가 건너뛴 시각(Q3). NULL이면 건너뛰지 않음
    created_at TIMESTAMPTZ NOT NULL DEFAULT now(), updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
    UNIQUE (session_id, order_no),
    UNIQUE (session_id, question_id)
  );

  CREATE TABLE IF NOT EXISTS session_host_lines (
    session_id   UUID NOT NULL REFERENCES sessions(id) ON DELETE CASCADE,
    line_key     TEXT NOT NULL,
    tts_asset_id UUID NOT NULL REFERENCES tts_assets(id),
    PRIMARY KEY (session_id, line_key)
  );

  CREATE TABLE IF NOT EXISTS answers (
    id                  UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    session_question_id UUID NOT NULL REFERENCES session_questions(id) ON DELETE CASCADE,
    attempt_no          INT  NOT NULL,
    client_request_id   TEXT NOT NULL UNIQUE,          -- 업로드 재전송 멱등 키
    audio_path          TEXT NOT NULL,
    audio_mime          TEXT NOT NULL,
    audio_bytes         INT  NOT NULL,
    audio_hash          TEXT NOT NULL,                 -- sha256
    client_duration_ms  INT  NOT NULL,
    stt_status          TEXT NOT NULL CHECK (stt_status IN ('queued','processing','done','rejected','failed')),
    stt_attempt         INT  NOT NULL DEFAULT 1,
    reject_reason       TEXT NULL,
    is_selected         BOOLEAN NOT NULL DEFAULT false,
    stt_text            TEXT NULL,
    timestamps_json     JSONB NULL,                    -- [{word,start,end}]
    metrics_json        JSONB NULL,
    stt_version         TEXT NULL,
    error_code          TEXT NULL,
    created_at TIMESTAMPTZ NOT NULL DEFAULT now(), updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
    UNIQUE (session_question_id, attempt_no)
  );
  CREATE UNIQUE INDEX IF NOT EXISTS answers_one_selected ON answers (session_question_id) WHERE is_selected;

  CREATE TABLE IF NOT EXISTS evaluations (
    id                  UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    session_id          UUID NOT NULL REFERENCES sessions(id) ON DELETE CASCADE,
    run_no              INT  NOT NULL,
    selected_answer_ids UUID[] NOT NULL,
    status              TEXT NOT NULL CHECK (status IN ('queued','running','done','failed')),
    assessment_status   TEXT NULL CHECK (assessment_status IN ('assessed','insufficient_evidence')),
    base_level          TEXT NULL CHECK (base_level IN ('NL','NM','NH','IL','IM','IH','AL')),
    estimated_level     TEXT NULL CHECK (estimated_level IN ('NL','NM','NH','IL','IM1','IM2','IM3','IH','AL')),
    im_estimation_status TEXT NULL CHECK (im_estimation_status IN ('provisional','insufficient_evidence','not_applicable')),
    result_json         JSONB NULL,                    -- schemas.EvaluationResult (검증 통과본)
    model TEXT NULL, prompt_version TEXT NULL, rubric_version TEXT NULL, im_rubric_version TEXT NULL,
    corpus_version TEXT NULL,
    retrieved_doc_ids   TEXT[] NULL,
    error_code          TEXT NULL,
    error_detail        JSONB NULL,
    created_at TIMESTAMPTZ NOT NULL DEFAULT now(), updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
    UNIQUE (session_id, run_no),
    -- done이면: assessed ⇔ base_level 있음 / insufficient_evidence ⇔ 두 등급 모두 없음
    CHECK (status <> 'done' OR (
      (assessment_status = 'assessed' AND base_level IS NOT NULL) OR
      (assessment_status = 'insufficient_evidence' AND base_level IS NULL AND estimated_level IS NULL))),
    -- 2단 등급 일관성
    CHECK (estimated_level IS NULL OR base_level IS NOT NULL),
    CHECK (base_level IS NULL OR base_level = 'IM' OR estimated_level IS NULL OR estimated_level = base_level),
    CHECK (base_level IS DISTINCT FROM 'IM' OR estimated_level IS NULL OR estimated_level IN ('IM1','IM2','IM3'))
  );
  ALTER TABLE sessions DROP CONSTRAINT IF EXISTS sessions_result_fk;
  ALTER TABLE sessions ADD CONSTRAINT sessions_result_fk FOREIGN KEY (result_id) REFERENCES evaluations(id);

  CREATE TABLE IF NOT EXISTS rag_docs (
    id              TEXT PRIMARY KEY,
    doc_type        TEXT NOT NULL CHECK (doc_type IN ('rubric','upgrade_pattern','question','answer')),
    question_id     TEXT NULL,
    question_type   TEXT NULL,
    level           TEXT NULL,
    level_rank      INT  NULL,
    contrast_set_id TEXT NULL,
    text_style      TEXT NULL,
    text            TEXT NOT NULL,
    metadata        JSONB NOT NULL DEFAULT '{}'::jsonb,
    corpus_version  TEXT NOT NULL,
    embedding       VECTOR(3072) NULL,
    created_at TIMESTAMPTZ NOT NULL DEFAULT now()
  );
  CREATE INDEX IF NOT EXISTS rag_docs_lookup ON rag_docs (doc_type, contrast_set_id, text_style);
  -- 3072 float32 차원을 보존하는 exact cosine 검색. HNSW vector 최대 2000차원 제약 때문에 ANN 인덱스 없음.

  CREATE TABLE IF NOT EXISTS jobs (
    id           UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    type         TEXT NOT NULL CHECK (type IN ('tts_prepare','stt','evaluate')),
    target_id    UUID NOT NULL,
    dedupe_key   TEXT NOT NULL UNIQUE,
    status       TEXT NOT NULL CHECK (status IN ('queued','running','done','failed','dead')),
    attempts     INT  NOT NULL DEFAULT 0,
    max_attempts INT  NOT NULL DEFAULT 3,
    locked_by    TEXT NULL,
    locked_until TIMESTAMPTZ NULL,
    next_run_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
    payload      JSONB NOT NULL DEFAULT '{}'::jsonb,
    error_code   TEXT NULL,
    error_detail JSONB NULL,
    created_at TIMESTAMPTZ NOT NULL DEFAULT now(), updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
  );
  CREATE INDEX IF NOT EXISTS jobs_ready ON jobs (type, status, next_run_at);

  CREATE TABLE IF NOT EXISTS ai_requests (
    id            UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    job_id        UUID NULL REFERENCES jobs(id),
    purpose       TEXT NOT NULL CHECK (purpose IN ('evaluate','embed','eval_script')),
    model         TEXT NOT NULL,
    input_tokens  INT NULL, output_tokens INT NULL, latency_ms INT NULL,
    status        TEXT NOT NULL CHECK (status IN ('ok','error','refused','invalid_output')),
    error_code    TEXT NULL,
    created_at    TIMESTAMPTZ NOT NULL DEFAULT now()
  );                                               -- 답변 원문·프롬프트 본문은 저장하지 않는다

  -- updated_at 트리거: sessions, tts_assets, session_questions, answers, evaluations, jobs
  -- (data-layer가 DO 블록으로 각 테이블에 set_updated_at 트리거를 붙인다)

# ===========================================================================
# 7. 모듈 인터페이스 (Python). 이름·인자·반환형을 바꾸지 않는다.
#    모든 DB 함수는 동기 함수, 내부에서 커넥션 풀을 쓴다. 트랜잭션 경계는 함수 단위.
# ===========================================================================
module_interfaces:

  app.config: |
    settings: Settings      # pydantic-settings, env_vars 전부. 경로는 backend/ 기준으로 resolve

  app.errors: |
    class AppError(Exception): code: str; http_status: int; message: str; detail: dict | None
    def install_error_handlers(app: FastAPI) -> None   # §8 error_format, RequestValidationError → VALIDATION_ERROR

  app.schemas: |
    app/schemas/api.py      — §9 api_schemas 전부 (Pydantic v2)
    app/schemas/internal.py — SessionQuestionIn, AnswerRow, SessionRow, JobRow, EvidenceBundle,
                              EvaluationLLMOutput(§10), EvaluationResult(§10), Metrics, WordTS

  app.db (data-layer): |
    # 공통
    def init_db() -> None                                   # migrations/*.sql 순서대로 적용(멱등)
    def ping() -> bool
    # 세션
    def create_session(*, client_request_id: str | None, scenario_id: str, settings_json: dict,
                       questions: list[SessionQuestionIn], replaces_session_id: UUID | None) -> tuple[UUID, bool]
        # (session_id, created). 같은 client_request_id면 기존 세션 반환(created=False).
        # 한 트랜잭션: replaces_session_id가 preparing/ready/prepare_failed면 cancelled로 → 세션·문항 INSERT
        #              → tts_prepare 작업 등록(dedupe_key 규칙)
    def get_session(session_id: UUID) -> SessionRow | None
    def get_session_id_by_request_id(client_request_id: str) -> UUID | None
        # 이미 생성한 세션은 코퍼스를 다시 읽지 않고 동일 키 재전송에 반환한다. 없으면 None.
    def list_session_questions(session_id: UUID) -> list[dict]       # order_no 순, tts asset(url용 file_path) 포함
    def get_session_question(session_id: UUID, order_no: int) -> dict | None
    def retry_prepare(session_id: UUID) -> int               # prepare_failed→preparing, prepare_attempt+1, 작업 등록. 새 attempt 반환
    def cancel_session(session_id: UUID) -> str              # 허용 상태에서만. 최종 status 반환
    def start_session(session_id: UUID) -> SessionRow        # ready→in_progress (in_progress면 그대로 반환: 멱등)
    def increment_replay(session_id: UUID, order_no: int, limit: int) -> int   # 초과 시 AppError REPLAY_LIMIT
    # TTS 준비(작업 핸들러가 호출)
    def upsert_tts_asset(*, kind: str, ref_id: str, text_hash: str, voice_id: str, settings_version: str,
                         file_path: str, duration_sec: float | None, status: str = "available") -> UUID
    def find_tts_asset(*, kind: str, ref_id: str, text_hash: str, voice_id: str) -> dict | None
    def complete_prepare(session_id: UUID, attempt: int, question_links: dict[int, UUID],
                         host_links: dict[str, UUID]) -> bool
        # status가 preparing이고 prepare_attempt == attempt일 때만 링크 저장 + ready. 아니면 False(늦은 완료 무시)
    def fail_prepare(session_id: UUID, attempt: int, errors: list[dict]) -> bool   # 같은 가드, prepare_failed
    # 답변
    def create_answer(*, session_id: UUID, order_no: int, client_request_id: str, audio_path: str,
                      audio_mime: str, audio_bytes: int, audio_hash: str, client_duration_ms: int,
                      answer_id: UUID) -> tuple[dict, bool]
        # (answer, created). 같은 client_request_id면 기존 반환. 한 트랜잭션 + stt 작업 등록 + current_order_no +1(v3).
        # 검사: in_progress, order_no == current_order_no, 같은 문항에 queued/processing 답변 없음
        #       → 위반 시 AppError(INVALID_STATE | ORDER_MISMATCH | ANSWER_PENDING)
    def get_answer(answer_id: UUID) -> dict | None           # session_id, order_no 포함
    def mark_stt_processing(answer_id: UUID) -> bool         # 세션 in_progress|submitted이고 queued일 때만
    def complete_stt(answer_id: UUID, *, text: str, timestamps: list[dict], metrics: dict, stt_version: str) -> dict
        # 한 트랜잭션: 세션 in_progress|submitted면 문항 위치와 무관하게 done + is_selected(같은 문항 이전 채택 해제)
        # → maybe_enqueue_evaluation. 이미 done이거나 세션이 그 밖의 상태면 바꾸지 않고 현재 값 반환(늦은 결과 무시).
        # 반환: {session_status, current_order_no, all_answered, stt_progress}
    def reject_stt(answer_id: UUID, reason: str) -> None     # rejected(종결) → maybe_enqueue_evaluation
    def fail_stt(answer_id: UUID, error_code: str) -> None   # failed(종결) → maybe_enqueue_evaluation
    def retry_stt(answer_id: UUID) -> None                   # 세션 in_progress|submitted: failed→queued, stt_attempt+1, 작업 등록
    def stt_progress(session_id: UUID) -> dict               # {total, done, pending, unusable} 건너뛰지 않은 접수 문항 기준
    # 워커: stt 작업이 dead가 되면 fail_stt로 답변을 종결한다(제출된 세션이 영원히 기다리지 않게).
    def skip_question(session_id: UUID, order_no: int) -> dict
        # 한 트랜잭션: in_progress, order_no == current_order_no, queued/processing 답변 없음 확인
        # → skipped_at 기록 + current_order_no +1. 이미 건너뛴 문항이면 바꾸지 않고 현재 값 반환(멱등).
        # 반환: {order_no, session_status, current_order_no, all_answered}
    # 제출·평가
    def submit_session(session_id: UUID) -> UUID | None
        # 한 트랜잭션: current_order_no > question_count이고 건너뛰지 않은 모든 문항에 접수된 답변이 있는지 확인
        # (아니면 AppError NOT_ALL_ANSWERED). STT 완료 여부는 묻지 않는다(v3).
        # → submitted, submitted_at → maybe_enqueue_evaluation. 평가가 등록됐으면 evaluation_id, STT 대기 중이면 None.
        # 이미 submitted/grading/grading_failed/done이면 최신 evaluation_id(없으면 None) 반환(멱등).
    # maybe_enqueue_evaluation(cur, session) — 세션 잠금 트랜잭션 내부 전용
        # 세션이 submitted이고 queued/processing 답변이 없을 때만: 문항별 채택 답변(done+is_selected, 없으면 최근 시도의
        # rejected/failed)을 지금 고정(건너뛴 문항 제외) → selected_answer_ids, evaluations(run_no=1) + evaluate 작업 → grading.
    def create_regrade(session_id: UUID) -> UUID             # grading_failed|done → 새 run_no, 작업 등록, grading
    def get_evaluation(evaluation_id: UUID) -> dict | None
    def get_latest_evaluation(session_id: UUID) -> dict | None
    def load_exam_snapshot(session_id: UUID, selected_answer_ids: list[UUID]) -> list[dict]
        # order_no 순 [{order_no, question_id, question_type, question_text, is_scored, target_functions,
        #              target_time_frames, context_scope, answer_id, stt_status, stt_text, metrics, stt_version, skipped}]
        # 건너뛴 문항은 skipped=true, answer_id/stt_status/stt_text/metrics=null
        # + 세션 settings_json.coverage는 get_session으로
    def mark_evaluation_running(evaluation_id: UUID) -> bool
    def finish_evaluation(evaluation_id: UUID, *, result: dict, assessment_status: str,
                          base_level: str | None, estimated_level: str | None, im_estimation_status: str,
                          model: str, prompt_version: str, rubric_version: str, im_rubric_version: str | None,
                          corpus_version: str | None, retrieved_doc_ids: list[str]) -> bool
        # 해당 run이 세션의 최신 run이고 세션이 grading일 때만: evaluation done + session done + result_id 갱신
    def fail_evaluation(evaluation_id: UUID, error_code: str, error_detail: dict | None) -> bool  # 같은 가드, grading_failed
    # 근거(RAG)
    def get_rag_docs(doc_type: str, *, corpus_version: str | None = None, **filters) -> list[dict]
    def get_contrast_set(contrast_set_id: str, text_style: str = "stt") -> list[dict]   # level_rank 순
    def search_similar_answers(embedding: list[float], *, question_type: str | None, text_style: str = "stt",
                               exclude_contrast_set_ids: list[str] = (), k: int = 5) -> list[dict]
    def current_corpus_version() -> str | None
    # 작업 큐
    def claim_job(types: list[str], worker_id: str, lease_sec: int) -> dict | None   # FOR UPDATE SKIP LOCKED
    def heartbeat_job(job_id: UUID, worker_id: str, lease_sec: int) -> bool
    def complete_job(job_id: UUID, worker_id: str) -> None
    def fail_job(job_id: UUID, worker_id: str, *, error_code: str, retryable: bool, detail: dict | None = None) -> str
        # retryable이고 attempts < max_attempts면 failed + next_run_at(2^attempts초 뒤), 아니면 dead. 최종 status 반환
    def recover_expired_jobs() -> int                        # locked_until 지난 running → failed(재시도)
    # 기록
    def log_ai_request(*, job_id: UUID | None, purpose: str, model: str, input_tokens: int | None,
                       output_tokens: int | None, latency_ms: int | None, status: str, error_code: str | None) -> None
    def last_job_activity() -> datetime | None               # /health worker_seen_at (jobs.updated_at 최신, running|done)
    def count_ai_requests(purpose: str, since: datetime | None = None) -> int   # 검증용

  app.db.dev (data-layer, 개발·테스트 전용 — API에서 import 금지): |
    # 다른 에이전트가 앞 단계 없이 자기 부분을 시험할 수 있게 상태를 바로 만든다. M1에 반드시 포함.
    def seed_session(status: str = "ready", scenario_id: str = "default", link_tts: bool = False) -> UUID
        # app.exam이 아직 없으면 questions.jsonl pilot에서 유형 순서대로 8개를 직접 고른다
    def seed_queued_answer(session_id: UUID, audio_path: str, order_no: int | None = None) -> UUID   # 파일 복사 + stt 작업 등록
    def seed_grading_session(level: str = "IM2", text_style: str = "stt") -> tuple[UUID, UUID]
        # (session_id, evaluation_id). 코퍼스 대조 답변으로 8문항 답변을 done으로 채우고 submit까지 진행

  app.llm.embeddings (data-layer): |
    def embed_texts(texts: list[str]) -> list[list[float]]   # EMBED_* 설정, 배치 100, 재시도 2

  app.llm.chat (grader): |
    class LLMTransientError(Exception); class LLMRefusalError(Exception); class LLMOutputError(Exception)
    def chat_structured(messages: list[dict], schema: type[BaseModel], *, timeout: float) -> tuple[BaseModel, dict]
        # (parsed, usage{model,input_tokens,output_tokens,latency_ms}). temperature=0.
        # parse 미지원 제공자면 json_object 모드 + model_validate_json 대체 경로

  app.exam (session-api): |
    def list_scenarios() -> list[ScenarioOut]                # scenarios.json + questions.jsonl, 프로세스 캐시
    def build_question_set(scenario_id: str, seed: str) -> list[SessionQuestionIn]
        # 슬롯별 pool에서 중복 없이 결정적으로 선택(seed=client_request_id 또는 새 UUID). 부족하면 AppError SCENARIO_UNAVAILABLE

  app.tts (tts-host): |
    HOST_LINES: dict[str, str]                               # app/tts/host_lines.py
    def text_hash(text: str) -> str                          # sha1(text.strip().encode('utf-8')).hexdigest()
    def active_voice_id() -> str | None                      # active_voice.json
    def tts_url(file_path: str) -> str                       # "/media/tts/" + file_path
    def tts_status() -> dict                                 # /health용 {voice_id, assets, missing_pilot}
    # app/tts/prepare.py
    def handle(job: dict) -> None                            # tts_prepare 핸들러

  app.stt (worker-stt): |
    def load_model() -> None; def is_loaded() -> bool
    def probe_audio(path: Path) -> AudioProbe                # {duration_sec, sample_rate, rms_dbfs, ok, reason}
    def transcribe(path: Path) -> SttResult                  # {text, words: list[WordTS], duration_sec, speech_segments}
    def compute_metrics(words: list[WordTS], duration_sec: float, speech_segments: list[tuple[float,float]]) -> Metrics
    # app/stt/job.py
    def handle(job: dict) -> None                            # stt 핸들러

  app.worker (worker-stt): |
    python -m app.worker [--types stt,tts_prepare,evaluate] [--once]
    # registry: job_types[*].handler 문자열을 importlib로 로드. 핸들러 예외 → 아래 규칙으로 fail_job
    class RetryableJobError(Exception); class PermanentJobError(Exception)   # app/worker/errors.py
    # 핸들러는 이 둘 중 하나를 던져 재시도 여부를 알린다. 그 밖의 예외는 retryable로 취급.

  app.grading (grader): |
    def load_system_prompt() -> tuple[str, dict]  # (본문, {rubric_version, prompt_version, sha1}). system_prompt_file 그대로
    def precheck_snapshot(snapshot: list[dict]) -> None
        # LLM 호출 전 입력 검증: 8문항·order_no 연속·is_scored 존재·채점 대상 ≥1·태그 형식. 실패 시 EVAL_INPUT_INVALID
    def build_evidence(snapshot: list[dict], *, exclude_contrast_set_ids: list[str] = ()) -> EvidenceBundle
        # 문항별 대조 답변 + 승급 패턴만. rubrics.jsonl은 넣지 않는다(evaluation_criteria.rules)
    def build_messages(snapshot: list[dict], evidence: EvidenceBundle) -> list[dict]
    def validate_output(raw: EvaluationLLMOutput, snapshot: list[dict]) -> EvaluationResult   # 실패 시 LLMOutputError
    def evaluate_exam(snapshot: list[dict], *, exclude_contrast_set_ids: list[str] = (), job_id: UUID | None = None)
        -> tuple[EvaluationResult, dict]
        # meta{model, prompt_version(opic-evaluation-system-v3), user_template_version, rubric_version, im_rubric_version,
        #      system_prompt_sha1, corpus_version, retrieved_doc_ids}
        # evaluations.prompt_version에는 "opic-evaluation-system-v3+evaluate_exam.v1" 형식으로 둘 다 기록
    def tier_of(level: str | None) -> dict | None   # {name, color}; 등급 null이면 tier null
    # app/grading/job.py
    def handle(job: dict) -> None           # evaluate 핸들러

frontend_interfaces:
  host: |
    // frontend/src/features/host/ (tts-host 소유). 화면(frontend)은 이 두 개만 import한다.
    export type HostState = 'idle' | 'speaking' | 'listening' | 'processing'
    export function Host(props: { state: HostState; className?: string }): JSX.Element
    export function useTtsPlayer(): {
      unlock(): Promise<void>                                  // 첫 사용자 클릭에서 호출
      play(url: string): Promise<'ended' | 'blocked' | 'error'> // speechSynthesis 대체 없음
      stop(): void
      isPlaying: boolean
      getAnalyser(): AnalyserNode | null                       // Host 애니메이션용(같은 컨텍스트 공유)
    }
  api_client: |
    // frontend/src/api/client.ts (frontend 소유, 시그니처는 bootstrap이 고정)
    // 함수 이름: getHealth, getScenarios, getHostLines, createSession, getSession, retryPrepare, cancelSession,
    //           startSession, getCurrent, postReplay, uploadAnswer, getAnswer, retryStt, submitSession,
    //           getResult, regrade
    // 실패 시 ApiError {code, message, detail, status}를 throw

# ===========================================================================
# 8. HTTP API — Base: http://127.0.0.1:8000/api/v1
# ===========================================================================
api:
  error_format: '{"error": {"code": "ORDER_MISMATCH", "message": "<한국어 사용자 문구>", "detail": {}}}'
  rules:
    - 긴 작업(TTS 준비, STT, 평가)은 202로 접수하고 워커가 처리한다. 클라이언트는 상태를 폴링한다(2초)
    - 202는 접수일 뿐 완료가 아니다
    - 모든 쓰기 요청은 멱등이다(client_request_id 또는 상태 기반)
    - 500 응답에 스택 트레이스를 넣지 않는다
  endpoints:
    - {id: A1,  method: GET,  path: /health, res: HealthOut}
    - {id: A2,  method: GET,  path: /scenarios, res: "list[ScenarioOut]"}
    - {id: A3,  method: GET,  path: /host-lines, res: "dict[str, HostLineOut]",
       note: "활성 음성의 진행자 대사 URL. 세션 시작 전 화면에서도 씀(say_again 등은 세션 링크 값을 우선)"}
    - {id: S1,  method: POST, path: /sessions, req: CreateSessionIn, res: SessionOut, status: 202,
       errors: [SCENARIO_UNAVAILABLE, MIC_CHECK_REQUIRED],
       note: "client_request_id 같으면 같은 세션(200). replaces_session_id 주면 그 세션 취소"}
    - {id: S2,  method: GET,  path: "/sessions/{session_id}", res: SessionOut, errors: [SESSION_NOT_FOUND]}
    - {id: S3,  method: POST, path: "/sessions/{session_id}/prepare/retry", res: SessionOut, status: 202,
       errors: [INVALID_STATE]}
    - {id: S4,  method: POST, path: "/sessions/{session_id}/cancel", res: SessionOut, errors: [INVALID_STATE]}
    - {id: S5,  method: POST, path: "/sessions/{session_id}/start", res: SessionOut, errors: [INVALID_STATE]}
    - {id: Q1,  method: GET,  path: "/sessions/{session_id}/current", res: CurrentQuestionOut,
       errors: [INVALID_STATE], note: "in_progress에서만. 모든 답변 접수 완료면 all_answered=true, question=null. stt_progress 포함"}
    - {id: Q2,  method: POST, path: "/sessions/{session_id}/questions/{order_no}/replay", res: ReplayOut,
       errors: [REPLAY_LIMIT, ORDER_MISMATCH], note: "다시 듣기 직전에 호출. 첫 재생은 호출하지 않음"}
    - {id: Q3,  method: POST, path: "/sessions/{session_id}/questions/{order_no}/skip", res: SkipOut,
       errors: [INVALID_STATE, ORDER_MISMATCH, ANSWER_PENDING],
       note: "현재 문항을 답변 없이 건너뜀. 같은 문항 재요청은 멱등. 채점에서는 답변 없음으로 처리"}
    - {id: U1,  method: POST, path: "/sessions/{session_id}/answers", req: "multipart: order_no, client_request_id, duration_ms, audio",
       res: AnswerOut, status: 202,
       errors: [INVALID_STATE, ORDER_MISMATCH, ANSWER_PENDING, AUDIO_TOO_SHORT, AUDIO_TOO_LONG, UNSUPPORTED_MEDIA, PAYLOAD_TOO_LARGE],
       note: "파일은 임시 경로에 쓴 뒤 create_answer 성공 시 최종 경로로 이동. 실패하면 임시 파일 삭제.
              v3: 응답 current_order_no는 이미 다음 문항. 클라이언트는 STT 완료를 기다리지 않고 진행"}
    - {id: U2,  method: GET,  path: "/sessions/{session_id}/answers/{answer_id}", res: AnswerOut, errors: [ANSWER_NOT_FOUND]}
    - {id: U3,  method: POST, path: "/sessions/{session_id}/answers/{answer_id}/retry-stt", res: AnswerOut, status: 202,
       errors: [INVALID_STATE]}
    - {id: E1,  method: POST, path: "/sessions/{session_id}/submit", res: SessionOut, status: 202,
       errors: [INVALID_STATE, NOT_ALL_ANSWERED],
       note: "v3: STT가 남아 있으면 status=submitted로 응답. 남은 STT가 끝나면 서버가 평가를 자동 등록"}
    - {id: E2,  method: GET,  path: "/sessions/{session_id}/result", res: ResultOut, errors: [INVALID_STATE],
       note: "AI를 호출하지 않는다. 저장값만 반환. submitted(STT 대기)면 evaluation_status=null, stt_progress로 진행 표시"}
    - {id: H2,  method: GET,  path: /sessions/active, res: ActiveSessionsOut, errors: [UNAUTHORIZED],
       note: "v3. 로그인 사용자 본인의 in_progress/submitted/grading 세션, 최근 10분 내 끝난 세션, 최신 리포트 세션.
              헤더 배지·완료 알림용 가벼운 폴링(대기 세션이 있을 때만 5초). /sessions/{session_id}보다 먼저 라우팅"}
    - {id: E3,  method: POST, path: "/sessions/{session_id}/regrade", res: SessionOut, status: 202, errors: [INVALID_STATE]}
    - {id: X1,  method: POST, path: "/sessions/{session_id}/chat", status: 501, errors: [NOT_IMPLEMENTED]}
  static:
    - "/media/tts/** → backend/{TTS_DIR} (StaticFiles)"

error_codes:
  VALIDATION_ERROR:     {http: 422, message: "요청 형식이 올바르지 않습니다."}
  SERVICE_NOT_READY:    {http: 503, message: "서버를 준비하고 있어요. 잠시 후 다시 시도해 주세요."}
  SESSION_NOT_FOUND:    {http: 404, message: "시험 정보를 찾을 수 없어요."}
  ANSWER_NOT_FOUND:     {http: 404, message: "답변을 찾을 수 없어요."}
  INVALID_STATE:        {http: 409, message: "지금 단계에서는 할 수 없는 요청이에요."}
  SCENARIO_UNAVAILABLE: {http: 422, message: "선택한 시나리오로는 시험을 구성할 수 없어요. 다른 설정을 선택해 주세요."}
  MIC_CHECK_REQUIRED:   {http: 422, message: "마이크 테스트를 먼저 완료해 주세요."}
  ORDER_MISMATCH:       {http: 409, message: "현재 문항이 아니에요. 화면을 새로고침해 주세요."}
  ANSWER_PENDING:       {http: 409, message: "이전 답변을 처리하고 있어요."}
  REPLAY_LIMIT:         {http: 409, message: "다시 듣기는 한 번만 할 수 있어요."}
  AUDIO_TOO_SHORT:      {http: 422, message: "녹음이 너무 짧아요. 다시 답변해 주세요."}
  AUDIO_TOO_LONG:       {http: 422, message: "녹음이 너무 길어요."}
  UNSUPPORTED_MEDIA:    {http: 415, message: "지원하지 않는 녹음 형식이에요."}
  PAYLOAD_TOO_LARGE:    {http: 413, message: "녹음 파일이 너무 커요."}
  NOT_ALL_ANSWERED:     {http: 409, message: "아직 저장되지 않은 답변이 있어요."}
  NOT_IMPLEMENTED:      {http: 501, message: "준비 중인 기능이에요."}
  INTERNAL_ERROR:       {http: 500, message: "잠시 후 다시 시도해 주세요."}
  # 작업 오류 코드(응답 error_code 필드에 담김, HTTP 에러 아님)
  job_error_codes: [TTS_ASSET_MISSING, TTS_HASH_MISMATCH, TTS_FILE_MISSING, NO_ACTIVE_VOICE,
                    STT_DECODE_ERROR, STT_ENGINE_ERROR,
                    LLM_TRANSIENT, LLM_REFUSED, LLM_INVALID_OUTPUT, EVAL_INPUT_TOO_LARGE, EVAL_INPUT_INVALID, EVAL_INTERNAL]

# ===========================================================================
# 9. API 스키마 (app/schemas/api.py, frontend/src/api/types.ts 와 1:1)
# ===========================================================================
api_schemas:
  HealthOut: {ready: bool, db: "ok|error", worker_seen_at: "datetime|null", whisper_model: str,
              corpus_version: "str|null", tts: {voice_id: "str|null", assets: int, missing_pilot: "list[str]"}}
  ScenarioOut: {scenario_id: str, label: str, description: str, question_count: int}
  HostLineOut: {key: str, text: str, audio_url: "str|null"}
  CreateSessionIn: {client_request_id: str, scenario_id: "str (기본 'default')", mic_check_passed: bool,
                    replaces_session_id: "UUID|null"}
  PrepareFailure: {order_no: "int|null", host_key: "str|null", ref_id: str, error_code: str}
  PrepareProgress: {total: int, linked: int, failures: "list[PrepareFailure]"}
  SessionOut: {session_id: UUID, status: session_status, scenario_id: str, question_count: int,
               current_order_no: int, all_answered: bool, prepare: "PrepareProgress|null",
               latest_evaluation_status: "evaluation_status|null", stt_progress: "SttProgress|null",
               created_at: datetime, updated_at: datetime}
  SttProgress: {total: int, done: int, pending: int, unusable: int}   # v3. 건너뛰지 않고 접수된 문항 기준
  QuestionOut: {order_no: int, question_id: str, question_type: str, is_scored: bool, text: str, audio_url: str,
                duration_sec: "float|null", replay_count: int, replay_limit: int}
  CurrentQuestionOut: {session_status: session_status, total: int, all_answered: bool,
                       question: "QuestionOut|null", pending_answer: "AnswerOut|null",
                       host_lines: "dict[str, HostLineOut]", stt_progress: "SttProgress|null"}
  ReplayOut: {order_no: int, replay_count: int, replay_limit: int}
  SkipOut: {order_no: int, session_status: session_status, current_order_no: int, all_answered: bool}
  Metrics: {duration_sec: float, speech_sec: float, word_count: int, wpm: float, articulation_wpm: "float|null",
            long_pause_count: int, observed_filler_per100: "float|null", metrics_version: str}
  AnswerOut: {answer_id: UUID, order_no: int, attempt_no: int, stt_status: answer_stt_status,
              reject_reason: "str|null", error_code: "str|null", stt_text: "str|null", metrics: "Metrics|null",
              session_status: session_status, current_order_no: int, all_answered: bool}
  Mistake: {quote: str, problem: str, fix: str}
  ItemFeedback: {order_no: int, evaluation_role: evaluation_role, task_fulfillment: task_fulfillment,
                 evidence: "list[str]", mistakes: "list[Mistake]", upgrade_tip: str}
  FeedbackCard: {title: str, why: str, before: "str|null", after: str, example_kind: example_kind,
                 related_order_nos: "list[int]", success_condition: str}
  DimensionFeedback: {summary: str, evidence_order_nos: "list[int]", limitations: "list[str]"}
  DimensionFeedbackSet: {functions_tasks: DimensionFeedback, accuracy: DimensionFeedback,
                         context_content: DimensionFeedback, text_type: DimensionFeedback}
  QuoteRef: {order_no: int, quote: str}
  FactEvidence: {criterion: "functions_tasks|accuracy|context_content|text_type", observation: str,
                 status: fact_status, order_no: "int|null", quote: "str|null"}
  CoverageEntry: {name: str, elicited_order_nos: "list[int]", usable_order_nos: "list[int]", gaps: "list[str]"}
  Coverage: {functions: "list[CoverageEntry]", time_frames: "list[CoverageEntry]", contexts: "list[CoverageEntry]"}
  SustainedPerformance: {capability: str, evidence: "list[QuoteRef]", summary: str}
  BreakdownObservation: {demanded_function: str, evidence: "list[QuoteRef]", communicative_impact: str, recovery: str}
  UnusableItem: {order_no: int, reason: str}
  EvaluationScope: {submitted_order_nos: "list[int]", scored_order_nos: "list[int]", feedback_only_order_nos: "list[int]",
                    usable_order_nos: "list[int]", unusable_items: "list[UnusableItem]"}
  AdditionalTask: {target_function: str, reason: str, suggested_question: str}
  EvaluationResult: {assessment_status: assessment_status, assessment_basis: "transcript_and_metrics",
                     rubric_version: str, prompt_version: str, im_rubric_version: "str|null",
                     evaluation_scope: EvaluationScope, input_issues: "list[str]",
                     base_level: "base_level|null", estimated_level: "level|null",
                     im_estimation_status: im_estimation_status,
                     provisional_label: "str|null  (IM 세분값이면 policies.im_provisional_label, 서버가 붙임)",
                     tier: "{name,color}|null", headline: str, grade_rationale: str,
                     dimension_feedback: DimensionFeedbackSet, coverage: Coverage,
                     fact_evidence: "list[FactEvidence]", sustained_performance: "list[SustainedPerformance]",
                     breakdown_observations: "list[BreakdownObservation]", fluency_observations: str,
                     why_this_level: str, why_not_lower: str, next_level_gap: str,
                     borderline_levels: "list[level]", uncertainty_reasons: "list[str]",
                     items: "list[ItemFeedback]", feedback_cards: "list[FeedbackCard]",
                     additional_tasks_needed: "list[AdditionalTask]", limitations: "list[str]",
                     insufficient_reason: "str|null", disclaimer: str}
  ResultItemOut: {order_no: int, question_id: str, question_type: str, question_text: str, is_scored: bool,
                  stt_text: "str|null", metrics: "Metrics|null", skipped: bool, stt_status: "answer_stt_status|null"}
  ResultOut: {session_status: session_status, evaluation_status: "evaluation_status|null", run_no: "int|null",
              result: "EvaluationResult|null", answers: "list[ResultItemOut]", error_code: "str|null",
              graded_at: "datetime|null", stt_progress: "SttProgress|null"}
  ActiveSessionItemOut: {session_id: UUID, scenario_id: str, status: session_status, question_count: int,
                         current_order_no: int, latest_evaluation_status: "evaluation_status|null",
                         stt_progress: SttProgress, created_at: datetime, submitted_at: "datetime|null", updated_at: datetime}
  ActiveSessionsOut: {items: "list[ActiveSessionItemOut]", recent_finished: "list[ActiveSessionItemOut]",
                      latest_report_session_id: "UUID|null", in_progress_session_id: "UUID|null"}

# ===========================================================================
# 10. 평가 LLM 출력 계약 (grader)
# ===========================================================================
evaluation_llm_output:   # app/schemas/internal.py EvaluationLLMOutput — Structured Output으로 강제 (contracts v3)
  source: docs/REQUIREMENTS_v2.md F3 "출력 계약" (opic-evaluation-system-v3)
  fields:
    status: "assessed | insufficient_evidence"
    assessment_basis: "transcript_and_metrics (고정값)"
    rubric_version: "performance-feedback-actfl-speaking-v3 (고정값)"
    prompt_version: "opic-evaluation-system-v3 (고정값)"
    evaluation_scope: "{submitted_order_nos[], scored_order_nos[], feedback_only_order_nos[], usable_order_nos[], unusable_items[{order_no, reason}]}"
    input_issues: "[str] 잘못되거나 누락된 태그·전사 메타데이터 등"
    base_level: "NL|NM|NH|IL|IM|IH|AL | null   (insufficient_evidence면 null)"
    estimated_level: "NL|NM|NH|IL|IM1|IM2|IM3|IH|AL | null   (level_rules)"
    im_estimation_status: "provisional | insufficient_evidence | not_applicable"
    im_rubric_version: "project-im-v1 | null  (IM 세분화를 썼을 때)"
    insufficient_reason: "str | null  (status=insufficient_evidence 또는 IM 세분화 보류면 필수)"
    headline: "한국어 총평 1~2문장. IM 세분값이면 '예상 IM2 · 내부 세분화 기준에 따른 잠정 진단' 형식"
    grade_rationale: 채점 대상 문항 근거의 판단 사유(한국어)
    dimension_feedback: "{functions_tasks|accuracy|context_content|text_type: {summary(ko), evidence_order_nos[], limitations[]}} — 숫자 점수 없음"
    coverage: "{functions[], time_frames[], contexts[]} 각 {name, elicited_order_nos[], usable_order_nos[], gaps[]}"
    fact_evidence: "[{criterion, observation(ko), status(demonstrated|not_demonstrated|not_observed), order_no|null, quote|null}]"
    sustained_performance: "[{capability, evidence[{order_no, quote}], summary}]"
    breakdown_observations: "[{demanded_function, evidence[{order_no, quote}], communicative_impact, recovery}] (없으면 [])"
    fluency_observations: "관측 속도·멈춤·수정의 해석과 STT 한계(한국어). 발음 평가 아님"
    why_this_level: 예상 등급의 직접 근거 요약
    why_not_lower: "아래 등급과 구분되는 관찰 (NL이면 '서비스 최저 등급'이라고 명시)"
    next_level_gap: "다음 등급의 미충족 특성과 연습 행동 (AL이면 AL 안의 안정성·범위 개선. AM 출력 금지)"
    borderline_levels: "[level] 근거가 섞일 때 인접 후보"
    uncertainty_reasons: "[str] 전사·과제 범위·답변 간 차이. 확률·신뢰도 %·합격 보장 표현 금지"
    items: "[{order_no, evaluation_role(scored|feedback_only), task_fulfillment(fulfilled|partial|not_fulfilled|not_assessable), evidence[0..3], mistakes[0..5]{quote, problem(ko), fix(en)}, upgrade_tip(ko)}]"
    feedback_cards: "[{title, why, before|null, after, example_kind(correction|practice), related_order_nos[], success_condition}] — assessed 3~5, insufficient 0~5"
    additional_tasks_needed: "[{target_function, reason, suggested_question}] (없으면 [])"
    limitations: "[str] 음질·STT·근거 부족·세분화 보류 사유 등"
  server_validation:     # validate_output이 하나라도 실패하면 LLMOutputError. 조용히 보정하지 않는다
    # 버전·범위
    - assessment_basis·rubric_version·prompt_version이 evaluation_criteria의 고정값과 같다
    - evaluation_scope.submitted_order_nos == 시험 전체 order_no, scored_order_nos == is_scored=true 집합,
      feedback_only_order_nos == is_scored=false 집합(서버 스냅샷 기준). usable ⊆ scored, unusable_items ⊆ scored
    # 등급
    - base_level ∈ base_levels, estimated_level ∈ levels, level_rules 전부, status와 일관
    - im_estimation_status는 base_level==IM일 때 provisional(세분값 있음) 또는 insufficient_evidence(세분값 null),
      그 밖에는 not_applicable. provisional이면 im_rubric_version == evaluation_criteria.im_rubric_version
    - IM 세분화 보류(estimated null)이거나 status insufficient_evidence면 insufficient_reason 필수
    - borderline_levels는 levels 안의 값. estimated_level이 있으면 인접(levels 순서 차 1)한 값만, IM 세분화 보류면 IM1~IM3 안에서만
    # 채점 제외 문항 혼입 금지 (v3 핵심)
    - fact_evidence·sustained_performance·breakdown_observations의 order_no, dimension_feedback.evidence_order_nos,
      coverage의 elicited/usable_order_nos, feedback_cards.related_order_nos는 모두 is_scored=true 문항만
    - items: order_no 집합 == 전체 order_no(누락·중복 금지), evaluation_role이 스냅샷의 is_scored와 일치(true→scored)
    - 유효 답변이 없는 문항(stt_status가 done이 아니거나 빈 전사)은 task_fulfillment=not_assessable이어야 하고
      그 문항만을 근거로 NL을 주지 않는다(채점 대상 전부가 확인 불가면 status는 insufficient_evidence)
    # 인용 실재
    - items.evidence, mistakes.quote, fact_evidence.quote, sustained/breakdown evidence.quote, feedback_cards.before(null 아니면)는
      해당 문항 STT 텍스트의 부분 문자열(대소문자·공백·구두점 정규화 후). before가 여러 문항이면 그중 하나에 있으면 통과
    - fact_evidence: order_no null이면 quote null, status not_observed면 quote null
    - feedback_cards: before가 null이면 example_kind=practice
    - feedback_cards 개수: assessed 3~5, insufficient_evidence 0~5
    # 금지 표현(간단한 문자열 검사, 걸리면 LLMOutputError)
    - "headline·grade_rationale·fluency_observations·why_* 금지 패턴 — '발음 점수', '합격 보장', 숫자+% (정규식 \\d+\\s?%),
      AM 단독 표기(\\bAM\\b), 'Advanced Mid', '100점'. 금지어 목록은 grader의 validate.py 상수로 두고 handoff에 적는다"
    - 서버가 tier, provisional_label, disclaimer를 붙여 EvaluationResult로 만든다(LLM이 만든 tier는 받지 않음)
