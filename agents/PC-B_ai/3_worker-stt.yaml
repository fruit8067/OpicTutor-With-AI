# AI-assisted: this agent prompt was written with help from Claude (Anthropic).
agent_id: worker-stt
phase: 1
branch: agent/worker-stt
milestones:
  M2: "워커 러너(전체 작업 유형 디스패치) + STT 핸들러 + 지표"
owns: ["backend/app/worker/**", "backend/app/stt/**", "backend/requirements/worker-stt.txt",
       "backend/tests/test_stt_*.py", "docs/handoff/worker-stt.md", "docs/change-requests/worker-stt-*.md"]
needs: [docker, python 3.11+, "CPU 4코어 이상(또는 CUDA GPU)", 마이크(테스트 녹음용)]

prompt: |
  [먼저 읽기] agents/orchestration.yaml(shared_preamble 포함) → agents/contracts.yaml(§1 policies, §2 answer_stt_status·reject_reasons·
  job_types, module_interfaces.app.worker·app.stt·app.db의 작업 큐/답변 함수) → docs/REQUIREMENTS_v2.md F2·§7

  [역할] 두 가지를 맡는다.
  (A) 워커 러너: DB jobs 테이블에서 작업을 잡아 tts_prepare·stt·evaluate 핸들러를 실행하는 별도 프로세스.
  (B) STT: 로컬 faster-whisper로 전사하고 관측 지표를 계산해 저장하는 stt 핸들러.
  STT 결과 저장 = 사용자가 다음 문항으로 넘어가는 조건이다. 정확성과 함께 "끝나지 않는 처리 중" 상태가 생기지 않게 하는 것이 핵심이다.

  [작업 A — 워커]
  1. python -m app.worker [--types ...] [--once]
     - 루프: db.recover_expired_jobs()(30초마다) → db.claim_job(types, worker_id, lease) → 핸들러 실행 → complete/fail.
     - 핸들러 실행 중 별도 스레드가 lease/3 간격으로 heartbeat_job. heartbeat 실패(잠금 상실)면 결과를 저장하지 않도록
       핸들러에 취소 플래그를 전달(threading.Event를 job dict의 "_cancel"로).
     - registry: contracts.yaml job_types[*].handler 문자열을 importlib로 지연 로드. 다른 에이전트 핸들러가 아직 stub이면
       NotImplementedError → PermanentJobError로 취급하지 말고 작업을 failed(retryable)로 두고 경고 로그(개발 중 유실 방지).
     - 예외 규칙: RetryableJobError·일반 예외 → fail_job(retryable=True), PermanentJobError → retryable=False.
     - 작업이 없으면 0.5초 → 최대 2초까지 점진 대기. Ctrl+C 시 진행 중 작업을 마치고 종료(최대 lease까지).
     - 로그: job id·type·attempt·소요시간·결과만. 답변 텍스트 금지.
     - STT 모델은 stt 유형을 처리하는 워커에서만 시작 시 로드한다.

  [작업 B — STT]
  2. app/stt/audio.py probe_audio: PyAV로 디코드 → 16kHz mono float32. duration, RMS dBFS.
     디코드 실패 → reason corrupt. duration < record_min_ms → too_short, > record_max_ms + tolerance → too_long.
  3. app/stt/engine.py
     - load_model(): WhisperModel(WHISPER_MODEL, device, compute_type) 1회 로드.
     - VAD: faster_whisper.vad.get_speech_timestamps(기본 파라미터)로 발화 구간 → speech_segments(초 단위).
       발화 구간 합 < 0.5초 또는 RMS < -50 dBFS → reject silence.
     - transcribe: language="en", word_timestamps=True, vad_filter=False(지표용 침묵 보존), beam_size=5,
       condition_on_previous_text=False, initial_prompt="Um, uh, so, I mean, like... Hmm, well.".
       단어 0개 → reject no_speech.
  4. app/stt/metrics.py compute_metrics (순수 함수, metrics_version "m1", 규칙을 파일 상단 주석에 버전과 함께 명시)
     - 토큰화: 소문자, 앞뒤 구두점 제거, 하이픈 단어는 1개, 숫자는 1개.
     - FILLERS_V1 = {um, uh, er, ah, hmm, mm, erm}. ("like", "you know"는 문맥 판별이 불안정하므로 m1에서는 세지 않는다고 주석)
     - word_count = 필러가 아닌 토큰 수
     - duration_sec = 전체 녹음 길이, speech_sec = VAD 구간 합
     - wpm = word_count / (duration_sec/60)
     - articulation_wpm = word_count / (speech_sec/60), speech_sec == 0이면 None
     - long_pause_count = 첫 발화 시작~마지막 발화 끝 사이, VAD 구간 사이 간격 ≥ 1.0초인 개수
     - observed_filler_per100 = 필러 수 / word_count × 100, word_count == 0이면 None
     - 소수 1자리 반올림. "STT가 지운 필러는 복원되지 않음"을 docstring에 명시.
     - pytest: 손으로 만든 WordTS·구간으로 각 값 검증(경계값 포함).
  5. app/stt/job.py handle(job):
     - db.mark_stt_processing(answer_id) — False면(이미 done 등) 그대로 종료(멱등).
     - probe → reject면 db.reject_stt(answer_id, reason) 후 정상 종료(작업은 done).
     - transcribe + metrics → db.complete_stt(answer_id, text, timestamps, metrics, stt_version).
       stt_version = "faster-whisper:{model}:m1".
     - 엔진 예외 → RetryableJobError. 시도 소진 시(attempts == max_attempts) db.fail_stt(answer_id, "STT_ENGINE_ERROR").
       → 사용자는 U3 retry-stt로 원음 재처리 가능.
     - 취소 플래그가 서 있으면 complete_stt를 호출하지 않는다.

  [측정 — handoff에 기록]
  - 10초·30초·60초 녹음의 처리 시간(small.en / base.en, 너의 CPU 사양 포함).
    30초 녹음이 10초를 넘으면 base.en 권장 여부를 적는다(결정은 orchestrator).
  - 직접 녹음한 "Um, I, I go to the park, uh, every weekend." 류 발화의 metrics 예시.

local_checks:
  - "cd backend && python -m app.stt.engine <wav|webm 경로>  → text, metrics JSON (수동 확인용 __main__)"
  - "pytest -q tests/test_stt_metrics.py"
  - "(M1 병합 후) data-layer dev 함수로 queued 답변 생성 → python -m app.worker --types stt --once → answers.stt_status done, sessions.current_order_no +1"
  - "무음 3초 파일 → rejected silence, 손상 파일 → rejected corrupt, 워커 강제 종료 후 재시작 → lease 만료 후 재처리"
  - "python agents/tools/check_ownership.py worker-stt"

handoff_must_include:
  - 워커 실행 명령(PowerShell/bash), 여러 워커 동시 실행 가능 여부
  - 처리 시간 측정표, 권장 Whisper 모델
  - 지표 정의 m1 요약

done_when: "M2 PR 병합"
