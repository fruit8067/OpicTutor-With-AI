# AI-assisted: this agent prompt was written with help from Claude (Anthropic).
agent_id: session-api
phase: 1
branch: agent/session-api
milestones:
  M2: "API 전체(A1~X1) + 출제 빌더 + 업로드 처리"
owns: ["backend/app/main.py", "backend/app/api/**", "backend/app/exam/**", "backend/requirements/session-api.txt",
       "backend/tests/test_exam_*.py", "backend/tests/test_api_*.py",
       "docs/handoff/session-api.md", "docs/change-requests/session-api-*.md"]
needs: [docker, python 3.11+]

prompt: |
  [먼저 읽기] agents/orchestration.yaml(shared_preamble 포함) → agents/contracts.yaml(§1 policies, §2, §8, §9, error_codes,
  module_interfaces.app.exam·app.db·app.tts) → docs/REQUIREMENTS_v2.md F0·F1·F2·§5·§9 → docs/FLOWCHART.md

  [역할] FastAPI HTTP 계층과 출제 빌더 담당이다. 너는 "얇은 계층"이다: 요청 검증 → app.db 함수 호출 → 스키마로 응답.
  상태 전이·순서 전진·멱등성 같은 규칙은 data-layer 함수가 트랜잭션으로 보장한다. 너는 SQL을 쓰지 않는다.
  data-layer M1이 병합되기 전에는 계약 시그니처를 믿고 코드를 쓰고, 테스트는 orchestration.yaml stub_policy의 가짜 구현으로 한다.

  [작업]
  1. app/exam: list_scenarios(), build_question_set(scenario_id, seed)
     - rag_docs/build/scenarios.json + questions.jsonl(status pilot) 로드, 파일 mtime 기준 캐시.
     - 슬롯 순서대로 pool에서 결정적으로 선택(random.Random(seed)), 이미 고른 id는 제외. 불가능하면 SCENARIO_UNAVAILABLE.
     - question_version = sha1(question_text)[:12]. SessionQuestionIn으로 반환. LLM 호출 없음.
     - 짧은 pytest: 같은 seed → 같은 세트, 8개 모두 다름, 유형이 슬롯과 일치.
  2. 라우터 (contracts.yaml api.endpoints 전부, 경로·상태 코드·에러 코드 그대로)
     - A1 /health: db.ping(), 최근 워커 활동(jobs.updated_at 최신 running/done 기준 — data-layer 함수가 없으면 CR),
       whisper 모델 이름(settings), corpus_version, app.tts.tts_status(). ready = db ok AND corpus_version AND tts voice 존재.
     - A2 /scenarios, A3 /host-lines(app.tts.HOST_LINES + 활성 음성 asset URL).
     - S1 POST /sessions: mic_check_passed가 false면 MIC_CHECK_REQUIRED. build_question_set(seed=client_request_id)
       → db.create_session(...). 새로 만들었으면 202, 기존이면 200. SessionOut 반환.
     - S2 GET: SessionOut. prepare 진행률 = 연결된 문항+대사 수 / 전체, failures = prepare_error_json.
       all_answered = current_order_no > question_count.
     - S3 retry, S4 cancel, S5 start: 해당 db 함수 호출. 상태 위반은 db가 INVALID_STATE를 던진다.
     - Q1 GET /current: in_progress에서만. 현재 문항 + audio_url(app.tts.tts_url) + replay_count/limit
       + pending_answer(그 문항의 최신 답변이 queued/processing/rejected/failed면 그 상태) + host_lines(세션 연결 값).
     - Q2 replay: db.increment_replay(limit=policies.replay_limit).
     - U1 POST /answers (multipart):
       a) 상태·order_no 사전 확인(빠른 실패용, 최종 판정은 db.create_answer)
       b) Content-Type 앞부분(;codecs 제거)이 accepted_mime인지, 크기 ≤ upload_max_bytes(스트리밍으로 세며 초과 즉시 413)
       c) duration_ms가 record_min_ms 미만 → AUDIO_TOO_SHORT, record_max_ms + tolerance 초과 → AUDIO_TOO_LONG
       d) answer_id = uuid4() 먼저 생성 → {DATA_DIR}/audio/{session_id}/.tmp/{answer_id} 에 쓰며 sha256 계산
       e) db.create_answer(..., answer_id=answer_id) 성공(created) → 최종 경로 {answer_id}.{ext}로 rename.
          기존 답변 반환(같은 client_request_id) → 임시 파일 삭제 후 기존 AnswerOut 200.
          예외 → 임시 파일 삭제 후 에러 응답.
       f) 202 AnswerOut. 깊은 검사(실제 길이·무음·손상)는 STT 워커 몫이다.
     - U2 GET answer, U3 retry-stt.
     - E1 submit → db.submit_session. E2 result → db.get_latest_evaluation + load_exam_snapshot로 answers 목록.
       E2는 AI를 절대 호출하지 않는다. E3 regrade → db.create_regrade.
     - X1 chat → 501 NOT_IMPLEMENTED.
  3. app/main.py: 시작 시 db.init_db()(실패해도 앱은 뜨고 /health가 error 보고), 라우터 등록, /media/tts 마운트,
     CORS는 settings.CORS_ORIGINS만, uvicorn 실행 안내 docstring. 요청 로그에 답변 텍스트·파일 내용을 남기지 않는다.
  4. 데모 편의(개발 전용, 환경변수 DEV_ROUTES=1일 때만 등록): 없음. 계약에 없는 엔드포인트를 만들지 않는다.

  [주의]
  - 업로드 접수 후에도 current_order_no를 바꾸지 않는다(전진은 complete_stt 트랜잭션만).
  - 미래·과거 order_no 업로드는 ORDER_MISMATCH. 같은 문항에 처리 중 답변이 있으면 ANSWER_PENDING.
  - 결과 조회·세션 조회·문항 조회는 읽기 전용이다. 조회 오류를 "남은 문항 없음"으로 바꾸지 않는다.

local_checks:
  - "cd backend && uvicorn app.main:app --host 127.0.0.1 --port 8000"
  - "(M1 병합 후) curl로: POST /sessions → GET /sessions/{id} (preparing) → [tts-host 준비 전이면 data-layer dev 함수로 ready 처리] → POST /start → GET /current → POST /answers(2초 이상 webm) 202 → 같은 client_request_id 재전송 200 같은 answer_id → 다른 order_no 업로드 409 ORDER_MISMATCH"
  - "1.5초 녹음 → 422 AUDIO_TOO_SHORT, 11MB → 413, text/plain → 415"
  - "POST /submit (답변 부족) → 409 NOT_ALL_ANSWERED"
  - "/openapi.json의 스키마 이름이 contracts.yaml api_schemas와 일치"
  - "python agents/tools/check_ownership.py session-api"

handoff_must_include:
  - 엔드포인트별 구현 여부 표
  - curl 예시(PowerShell은 Invoke-RestMethod 예시)
  - data-layer에 요청한 함수(있으면 CR 번호)

done_when: "M2 PR 병합"
