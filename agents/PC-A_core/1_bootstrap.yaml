# AI-assisted: this agent prompt was written with help from Claude (Anthropic).
agent_id: bootstrap
phase: 0
branch: agent/bootstrap
milestone: M0
owns: "contracts.yaml ownership 중 owner: bootstrap 인 경로 + Phase 0 한정으로 모든 stub 파일"
needs: [docker, node 20+, python 3.11+]

prompt: |
  [먼저 읽기] agents/orchestration.yaml → agents/contracts.yaml → docs/REQUIREMENTS_v2.md → docs/FLOWCHART.md
  그다음 orchestration.yaml의 shared_preamble을 지침으로 삼는다.

  [역할] 너는 Phase 0 담당이다. 다른 7개 에이전트가 서로 다른 컴퓨터에서 "동시에" 시작할 수 있도록
  contracts.yaml을 실제 코드 뼈대로 옮긴다. 기능 로직은 쓰지 않는다. 형식(타입·경로·함수 시그니처)만 고정한다.
  네 결과물이 틀리면 7명이 동시에 틀린다. 속도보다 계약과의 정확한 일치가 우선이다.

  [작업]
  1. 저장소 정리
     - .gitignore: 기존 Python 템플릿의 `build/`, `lib/`, `dist/` 같은 비고정 패턴이
       rag_docs/build/, frontend/src/lib/ 등을 무시하지 않도록 수정한다.
       (방법: 해당 패턴을 `/build/`처럼 루트 고정으로 바꾸거나 `!rag_docs/build/`, `!rag_docs/build/**` 예외 추가)
       추가로 무시: data/, backend/.env, backend/.venv/, node_modules/, frontend/dist/,
       backend/tests_local/, frontend/src/__dev__/, *.webm, backend/static/tts/*/*.wav
       확인: git check-ignore -v rag_docs/build/scenarios.json frontend/src/lib/x.ts 가 아무것도 출력하지 않아야 함.
     - docker-compose.yml: pgvector/pgvector:pg16, "127.0.0.1:5432:5432", opic/opic/opic, 볼륨 ./data/pg, healthcheck.
  2. backend 뼈대 (contracts.yaml §4 ownership의 모든 backend 경로)
     - backend/requirements.txt: `-r requirements/<agent_id>.txt` 줄만 담는다(에이전트 전원 분량).
       각 requirements/<agent_id>.txt를 만들고 시작 패키지를 넣어 둔다:
         bootstrap: fastapi, uvicorn[standard], pydantic>=2.7, pydantic-settings, python-multipart, python-dotenv
         data-layer: psycopg[binary,pool]>=3.2, pgvector, openai>=1.40
         worker-stt: faster-whisper, av, numpy
         grader: openai>=1.40, tiktoken, pyyaml
         tts-host: (비움)
         session-api: (비움)
         corpus: pyyaml
     - backend/.env.example: contracts.yaml env_vars 전부(값은 예시, 키는 빈 문자열).
     - app/config.py: pydantic-settings Settings. 경로 필드(DATA_DIR, TTS_DIR, RAG_BUILD_DIR)는 backend/ 기준 절대경로로 resolve.
     - app/errors.py: AppError, install_error_handlers. 응답 형식·코드·HTTP·한국어 문구는 contracts.yaml error_codes 그대로.
     - app/schemas/api.py, app/schemas/internal.py: contracts.yaml §2 enum(Literal), §9 api_schemas, §10 evaluation_llm_output,
       module_interfaces에 나오는 내부 타입(SessionQuestionIn, Metrics, WordTS, EvidenceBundle, AudioProbe, SttResult 등).
       EvaluationLLMOutput에는 필드 제약(1~5, max_length)을 Field로 건다. 서버 검증 규칙은 grader 몫이므로 넣지 않는다.
     - backend/migrations/001_init.sql: contracts.yaml db_schema_sql 그대로 + updated_at 트리거 DO 블록.
       docker compose up 후 psql로 실제 적용해 오류가 없는지 확인한다.
     - stub 모듈: contracts.yaml module_interfaces의 모든 함수를 해당 파일에 시그니처·docstring(계약 문구 요약)만 두고
       본문은 `raise NotImplementedError("<owner>: <함수명>")`로 만든다.
       파일: app/db/__init__.py(함수를 재노출), app/db/{pool,sessions,tts,answers,evaluations,rag,jobs,ai_requests,dev}.py,
             app/llm/{__init__,embeddings,chat}.py, app/exam/{__init__,scenarios,builder}.py,
             app/tts/{__init__,host_lines,assets,prepare}.py, app/stt/{__init__,engine,audio,metrics,job}.py,
             app/worker/{__init__,__main__,runner,registry,errors}.py, app/grading/{__init__,evidence,prompt,validate,tiers,service,job}.py,
             app/api/{__init__,routes_meta,routes_sessions,routes_answers,routes_results,deps}.py
       app/worker/errors.py의 RetryableJobError, PermanentJobError와 app/llm/chat.py의 예외 클래스는 실제로 정의한다(본문 pass).
       app/tts/host_lines.py의 HOST_LINES는 contracts.yaml data_files.host_lines 값으로 실제로 채운다.
     - app/main.py: FastAPI 앱, CORS(CORS_ORIGINS), error handler, /media/tts StaticFiles(디렉터리 없으면 생성),
       라우터 include, GET /api/v1/health 는 stub(ready=false). uvicorn app.main:app --host 127.0.0.1 로 뜨는지 확인.
     - 모든 stub 파일 첫 줄 AI-assisted 주석 + 두 번째 줄 `# OWNER: <agent_id> (contracts.yaml ownership)`.
  3. frontend 뼈대
     - npm create vite@latest frontend -- --template react-ts, Tailwind CSS v3 설정, react-router-dom 설치.
     - frontend/src/api/types.ts: §2 enum과 §9 api_schemas를 TypeScript 타입으로 손으로 정확히 옮긴다(1:1, 필드명 snake_case 유지).
     - frontend/src/api/client.ts: fetch 래퍼 시그니처만(엔드포인트별 함수 이름 = contracts api.endpoints의 id 기반,
       예: getHealth(A1), createSession(S1), getSession(S2)...), 본문은 TODO. VITE_API_BASE 기본 http://127.0.0.1:8000/api/v1
       → 이 파일은 frontend 소유로 넘어간다.
     - frontend/src/features/host/ 에 Host.tsx(props: state: 'idle'|'speaking'|'listening'|'processing')와
       useTtsPlayer.ts(시그니처: play(url): Promise<'ended'|'blocked'|'error'>, stop(), getAnalyser()) stub → tts-host 소유.
     - npm run build 통과.
  4. agents/tools/check_ownership.py
     - 사용법: python agents/tools/check_ownership.py <agent_id> [--base origin/main]
     - git diff --name-only <base>...HEAD 의 각 파일을 contracts.yaml ownership 규칙(위에서부터 첫 매칭, {agent_id} 치환,
       ** glob)으로 판정해 소유자가 아니면 목록을 출력하고 exit 1. PyYAML만 사용.
     - bootstrap 자신에게는 검사를 건너뛰는 --phase0 옵션.
  5. docs/API_SPEC.md를 v2로 다시 쓴다
     - contracts.yaml §2·§8·§9·error_codes를 사람이 읽기 좋은 문서로 옮긴다: 공통 규칙, 상태 전이 표,
       엔드포인트별 요청/응답 예시 JSON, 에러 코드 표, 클라이언트 폴링 흐름(시퀀스 텍스트).
     - 맨 위에 "계약 원본은 agents/contracts.yaml, 충돌 시 그쪽 우선" 명시. 이전 v1 내용(문항별 채점·즉시 이동·Web Speech 대체)은 남기지 않는다.
     - docs/agents.yaml(이전 초안)은 내용을 "agents/ 폴더로 이동했음" 안내 3줄로 바꾼다.
  6. docs/handoff/ 폴더와 docs/handoff/bootstrap.md, docs/change-requests/.gitkeep 생성.

  [하지 말 것]
  - 함수 본문 구현(특히 DB 쿼리, STT, LLM 호출, 화면 로직)
  - 계약에 없는 필드·엔드포인트 추가. 계약의 오타·모순을 발견하면 고치지 말고 handoff '알려진 문제'에 적어 orchestrator에게 넘긴다

local_checks:
  - "docker compose up -d && docker compose exec -T db psql -U opic -d opic -f - < backend/migrations/001_init.sql  (오류 0, 두 번 실행해도 오류 0)"
  - "cd backend && python -c \"import app.main, app.db, app.grading, app.stt, app.tts, app.worker, app.exam, app.llm\""
  - "cd backend && uvicorn app.main:app --host 127.0.0.1 --port 8000  → GET /api/v1/health 200, /docs 열림"
  - "python -c \"from app.schemas.api import *\"  # contracts api_schemas의 모든 이름이 존재"
  - "cd frontend && npm run build"
  - "git check-ignore -v rag_docs/build/scenarios.json frontend/src/lib/x.ts  → 출력 없음"
  - "python agents/tools/check_ownership.py data-layer --base HEAD~0  → 정상 실행"

handoff_must_include:
  - 생성한 stub 파일 목록과 각 OWNER
  - 계약에서 발견한 모호함·모순(있으면)
  - "다른 에이전트용 로컬 실행 명령(PowerShell/bash)"

done_when: "PR [bootstrap] M0 이 orchestrator에 의해 main에 병합됨"
