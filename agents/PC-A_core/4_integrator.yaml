# AI-assisted: this agent prompt was written with help from Claude (Anthropic).
agent_id: integrator
phase: 2
branch: agent/integrator
milestones:
  M3: "실제 구성요소로 처음부터 끝까지 완주 + 실패 시나리오 확인 + 연결 버그 수정"
owns: ["backend/scripts/e2e_smoke.py", "docs/handoff/integrator.md", "docs/RUNBOOK.md",
       "연결 버그 수정에 한해 모든 경로 (아래 규칙)"]
needs: [docker, python 3.11+, node 20+, 마이크, LLM_API_KEY, EMBED_API_KEY]

prompt: |
  [먼저 읽기] agents/orchestration.yaml(shared_preamble 포함) → agents/contracts.yaml → docs/handoff/*.md 전부
  → docs/REQUIREMENTS_v2.md → docs/FLOWCHART.md

  [역할] M2(모든 Phase 1 PR 병합) 이후의 main에서 시작한다. 각자 따로 만든 부품을 실제로 연결해 서비스를 완주시킨다.
  [수정 권한 규칙] 원칙적으로 모든 경로를 고칠 수 있지만,
  - 고치는 범위는 "연결 버그"(시그니처 불일치, import 경로, 설정 누락, 직렬화 오류 등)로 한정한다.
  - 기능 재설계·계약 변경이 필요하면 고치지 말고 change_request + 해당 소유자에게 알린다.
  - 고친 파일마다 handoff에 "파일 · 원인 · 수정 · 원래 소유자"를 기록한다.

  [작업]
  1. docs/RUNBOOK.md: 새 컴퓨터에서 서비스를 띄우는 전체 절차(PowerShell/bash 둘 다).
     docker compose up -d → python -m scripts.db_reset --yes → python -m scripts.ingest_rag
     → python -m scripts.import_tts <zip|폴더> --activate (또는 커밋된 static/tts 등록: import_tts backend/static/tts/<voice_id>)
     → uvicorn app.main:app --host 127.0.0.1 --port 8000 → python -m app.worker → cd frontend && npm run dev
     + 음성 재생성 절차 링크(tts-host handoff), 키 설정, 자주 나는 오류.
  2. scripts/e2e_smoke.py: HTTP만으로 기본 시나리오를 완주하는 자동 테스트.
     backend/e2e_audio/{level}/의 합성 답변 mp3를 업로드 → 매 문항 U2 폴링으로 done 확인 → submit → result 폴링 → done.
     옵션 --level IM2|IL, --fail-cases(아래 실패 시나리오 자동 확인). 결과를 표로 출력.
     기대: IM2 음성 세트는 base_level IM(estimated IM1~IM3 또는 세분화 보류), IL 세트는 NH~IM1 범위
     (벗어나면 경고만, 실패 처리하지 않음 — 정확도 판단은 grader 리포트로). 결과 JSON의 2단 등급 규칙·rubric_version은 실패로 검사.
  3. 실패·불변 조건 확인(자동 가능한 것은 --fail-cases, 나머지는 수동) — 결과를 handoff 표로:
     - 세트 불변성: 같은 세션 새로고침·준비 재시도 후 문항 ID·순서 동일
     - TTS mp3 하나 삭제 → prepare_failed(TTS_FILE_MISSING) → 복구 → retry → ready
     - STT 처리 중 다음 문항 업로드 → 409 ANSWER_PENDING / 다른 order_no → 409 ORDER_MISMATCH
     - 같은 client_request_id 업로드 2회 → 같은 answer_id, 순서 1번만 전진
     - 무음 3초 → rejected → 재녹음 성공
     - 7문항만 답하고 submit → 409 NOT_ALL_ANSWERED
     - submit 2회 → evaluation 1개
     - 시험 중 ai_requests에 evaluate 기록 0건(시험 중 평가 미호출)
     - LLM 키 오류 → grading_failed → 키 복구 → regrade → done, 이전 run 결과가 새 결과를 덮어쓰지 않음
     - 결과 새로고침 10회 → ai_requests 증가 0
     - 워커 강제 종료 후 재시작 → 처리 중 작업 복구
     - 브라우저로 실제 마이크 완주 1회(수동), 화면 녹화 또는 스크린샷을 docs/handoff/integrator-assets/에
  4. 측정: 문항당 업로드→done 시간, 종료→결과 시간, 시험 1회 LLM 토큰·비용. handoff에 기록.

local_checks:
  - "python -m scripts.e2e_smoke --level IM2"
  - "python -m scripts.e2e_smoke --level IL --fail-cases"
  - "python agents/tools/check_ownership.py integrator  (연결 수정 파일은 handoff에 사유 기록 후 예외 허용)"

handoff_must_include:
  - 완주 결과(등급·소요 시간), 실패 시나리오 표(통과/실패)
  - 수정한 연결 버그 목록(파일·원인·원래 소유자)
  - 남은 문제와 담당 에이전트

done_when: "M3 PR 병합, definition_of_done 중 reviewer 항목을 제외한 전부 충족"
