# AI-assisted: this agent prompt was written with help from Claude (Anthropic).
agent_id: data-layer
phase: 1
branch: agent/data-layer
milestones:
  M1: "app/db 전체 함수 + 작업 큐 + migrations + db_reset + ingest_rag → 먼저 PR (다른 4명이 기다림)"
  M2: "동시성·멱등성 확인 결과, 성능 인덱스 점검"
owns: ["backend/migrations/**", "backend/app/db/**", "backend/app/llm/embeddings.py", "backend/scripts/ingest_rag.py",
       "backend/scripts/db_reset.py", "backend/requirements/data-layer.txt", "backend/tests/test_db_*.py",
       "docs/handoff/data-layer.md", "docs/change-requests/data-layer-*.md"]
needs: [docker, python 3.11+, EMBED_API_KEY]

prompt: |
  [먼저 읽기] agents/orchestration.yaml(shared_preamble 포함) → agents/contracts.yaml(§2 상태, §6 DB, §7 app.db·app.llm.embeddings)
  → docs/REQUIREMENTS_v2.md §5·§7 → bootstrap이 만든 backend/app/db/*.py stub

  [역할] 너는 DB 계층의 담당자다. 이 서비스의 "불변 조건"(세트 고정, 순서 한 번만 전진, 중복 작업 없음, 늦은 완료 무시)은
  거의 전부 네 트랜잭션 함수에서 지켜진다. API·워커·평가 에이전트는 네 함수만 호출하고 SQL을 직접 쓰지 않는다.
  M1이 팀 전체의 임계 경로다. 완벽한 최적화보다 "계약대로 정확하게 동작하는 함수 전부"를 먼저 PR한다.

  [작업 — M1]
  1. app/db/pool.py: psycopg_pool.ConnectionPool(settings.DATABASE_URL), dict_row, pgvector 타입 등록,
     `with tx() as cur:` 형태의 트랜잭션 헬퍼. 함수마다 트랜잭션 하나.
  2. init_db(): backend/migrations/*.sql을 파일명 순서로 적용, schema_migrations 테이블로 적용 이력 관리(멱등).
     updated_at 트리거를 각 테이블에 붙이는 DO 블록 포함(002_triggers.sql 등으로 분리해도 됨).
  3. contracts.yaml module_interfaces.app.db의 함수를 전부 구현한다. 특히 아래 불변 조건을 SQL로 보장한다.
     - create_session: client_request_id 중복이면 기존 반환. replaces_session_id 취소 + INSERT + 작업 등록을 한 트랜잭션.
     - complete_prepare / fail_prepare: `WHERE id=%s AND status='preparing' AND prepare_attempt=%s` 가드.
       취소된 세션이나 이전 attempt의 늦은 완료는 False를 반환하고 아무것도 바꾸지 않는다.
     - create_answer: 세션 행을 `SELECT … FOR UPDATE`로 잠근 뒤 상태·current_order_no·대기 중 답변을 검사.
       attempt_no = 해당 문항의 max+1. answers INSERT + stt 작업 INSERT를 같은 트랜잭션.
     - complete_stt: 답변 행 잠금 → 이미 done이면 현재 값 반환. 아니면 같은 문항 is_selected=false → 이 답변 done·is_selected
       → 세션 current_order_no가 이 답변의 order_no와 같을 때만 +1. (중복 호출해도 한 번만 전진)
     - submit_session: 모든 session_questions에 is_selected AND stt_status='done' 답변이 있는지 검사 →
       selected_answer_ids를 order_no 순으로 고정 → evaluations(run_no=1, queued) + evaluate 작업 → status grading.
       submitted 상태는 같은 트랜잭션 안에서 거쳐 가도 되지만 submitted_at은 남긴다.
     - finish_evaluation / fail_evaluation: run_no가 그 세션의 최대 run_no이고 세션이 grading일 때만 반영.
       (contracts v2~3) base_level·estimated_level·im_estimation_status·im_rubric_version·prompt_version 컬럼을 함께 저장한다.
     - (contracts v3) session_questions의 is_scored·target_functions·target_time_frames·context_scope를 create_session에서 저장하고,
       load_exam_snapshot이 이 필드와 stt_status·stt_version을 함께 돌려준다. settings_json.coverage는 받은 그대로 저장.
       DB 차원 검사: 세션당 is_scored=false 문항은 최대 1개(부분 유니크 인덱스 또는 트리거).
       evaluations의 2단 등급 CHECK 제약이 DB 차원에서 잘못된 조합을 막는다 — 마이그레이션에 그대로 넣는다.
       create_regrade 후 이전 run의 늦은 완료가 결과를 덮어쓰지 않아야 한다.
     - claim_job: `SELECT … WHERE type = ANY(%s) AND status IN ('queued','failed') AND next_run_at <= now()
       ORDER BY created_at FOR UPDATE SKIP LOCKED LIMIT 1` → running, attempts+1, locked_by/locked_until.
     - 작업 dedupe_key는 contracts.yaml job_dedupe_keys 규칙. 중복이면 ON CONFLICT DO NOTHING.
     - 상태 전이는 contracts.yaml session_transitions만 허용. 위반 시 AppError("INVALID_STATE").
  4. app/llm/embeddings.py: embed_texts — openai SDK, EMBED_BASE_URL/EMBED_API_KEY/EMBED_MODEL, 배치 100, 일시 오류 재시도 2회,
     차원이 EMBED_DIM과 다르면 예외. log_ai_request(purpose='embed') 기록(텍스트는 기록하지 않음).
  5. scripts/ingest_rag.py: rag_docs/build/{rubrics,upgrade_patterns,questions,answers}.jsonl + VERSION 적재.
     - id 기준 UPSERT, 같은 corpus_version·같은 text면 임베딩 재계산 생략(비용 절약).
     - 임베딩은 doc_type answer와 question만(루브릭·승급 패턴은 직접 조회하므로 NULL 허용).
     - 실행 전에 예상 임베딩 개수 출력, --dry-run 지원. 끝나면 doc_type별 건수 출력.
       코퍼스가 Q001~Q187(대조 답변 약 3,300건 이상)로 늘어나므로 배치·재시작(중단 지점부터 이어서)을 지원한다.
     - 필드 매핑: question_id, question_type, level, level_rank, contrast_set_id, text_style, text는 컬럼, 나머지는 metadata.
  6. scripts/db_reset.py --yes: 모든 테이블 DROP → init_db (로컬 개발용, --yes 없으면 거부).
  7. app/db/dev.py: contracts.yaml app.db.dev의 seed_* 함수 3개. (v3) 문항 태그를 questions.jsonl에서 복사하고,
     seed_grading_session은 1번 자기소개(is_scored=false) + 2~8번 채점 문항으로 만든다. 다른 에이전트(worker-stt, grader, tts-host, session-api)가
     앞 단계 없이 자기 부분을 시험하는 데 쓴다. M1에 반드시 포함하고 handoff에 사용 예시를 적는다.
     `python -m app.db.dev seed-grading --level IM2` 같은 CLI도 둔다.

  [작업 — M2]
  8. 동시성 확인 스크립트(커밋하지 않아도 됨, 결과는 handoff에): 스레드 10개로 같은 answer에 complete_stt 동시 호출 →
     current_order_no가 1만 증가. 워커 2개가 claim_job을 동시에 → 같은 작업을 둘이 잡지 않음.
     같은 client_request_id로 create_session·create_answer 동시 5회 → 행 1개.
  9. 순수 로직이 있는 부분은 backend/tests/test_db_<topic>.py에 짧은 pytest(실제 로컬 DB 사용, 없으면 skip).

  [하지 말 것]
  - API 라우터·워커 루프·STT·평가 로직 작성(다른 에이전트 소유)
  - 계약에 없는 컬럼 추가. 꼭 필요하면 change_request(마이그레이션 002 이상으로)

local_checks:
  - "docker compose up -d && cd backend && python -m scripts.db_reset --yes"
  - "python -m scripts.ingest_rag --dry-run && python -m scripts.ingest_rag  → doc_type별 건수 출력"
  - "python -c \"from app import db; print(db.ping(), db.current_corpus_version())\""
  - "handoff에 붙일 시나리오 스크립트: create_session → complete_prepare → start → create_answer → complete_stt(2회) → current_order_no 확인 → … → submit_session(2회) → evaluation 1개"
  - "python agents/tools/check_ownership.py data-layer"

handoff_must_include:
  - M1 PR 시각과 포함 함수 목록(전부 구현 여부)
  - 동시성 확인 결과
  - ingest 건수, 임베딩 개수·소요 시간
  - 다른 에이전트가 테스트 데이터를 만드는 방법(예: 준비 완료 세션을 바로 만드는 개발용 함수 사용법)

done_when: "M1·M2 PR 병합, local_checks 통과"
