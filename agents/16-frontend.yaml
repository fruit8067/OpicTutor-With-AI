# AI-assisted: this agent prompt was written with help from Claude (Anthropic).
agent_id: frontend
phase: 1
branch: agent/frontend
milestones:
  M2: "더미 로그인 → 설정 → 준비 → 시험 → 채점 중 → 결과, 새로고침 복구, 오류 화면 전부"
owns: ["frontend/** (단, frontend/src/features/host/** 와 frontend/src/api/types.ts 제외)",
       "docs/handoff/frontend.md", "docs/change-requests/frontend-*.md"]
needs: [node 20+, 마이크]

prompt: |
  [먼저 읽기] agents/orchestration.yaml(shared_preamble 포함) → agents/contracts.yaml(§1 policies, §2 상태 전체, §8 api, §9 api_schemas,
  error_codes, frontend_interfaces) → docs/REQUIREMENTS_v2.md F0·F1·F4·§5·§9 → docs/FLOWCHART.md
  → frontend-design skill, vercel web-design-guidelines (설치되어 있으면 읽고 따른다)

  [역할] 사용자가 보는 화면 전부를 만든다. 서버 상태가 진실이다. 화면은 서버 상태를 보여 주고, 다음 행동을 서버 상태로만 결정한다.
  (예: 업로드가 202로 접수돼도 다음 문항으로 가지 않는다. 답변 상태가 done이고 current_order_no가 바뀐 것을 확인한 뒤 이동)

  [개발 방식] 서버가 아직 없으므로 frontend/src/__dev__/mockServer.ts(MSW 또는 fetch 가로채기)로 contracts 스키마 그대로의
  가짜 응답과 상태 전이를 흉내 낸다. 이 폴더는 커밋되지 않는다(.gitignore). VITE_USE_MOCK=1일 때만 활성화.
  진행자 캐릭터·플레이어는 tts-host 소유(frontend/src/features/host/). 병합 전에는 bootstrap stub을 import해서 쓴다.

  [작업]
  1. src/api/client.ts: contracts api.endpoints 전부. 에러 응답 error.code → ApiError(code, message, detail) 던짐.
     src/api/types.ts(bootstrap 소유)를 그대로 import. 타입이 맞지 않으면 고치지 말고 change_request.
  2. 상태 저장: session_id만 localStorage(try/catch)에 둔다. 나머지는 서버에서 다시 읽는다.
     앱 시작 시 session_id가 있으면 S2로 상태를 읽어 아래 라우팅 표대로 이동한다.
       preparing|prepare_failed → /prepare, ready → /ready, in_progress → /exam, submitted|grading|grading_failed|done → /result,
       cancelled 또는 404 → session_id 삭제 후 /setup
  3. 화면
     a. /login (더미): 닉네임 입력(선택)만, 비밀번호 필드 없음. "실제 로그인이 아닌 데모"임을 표시. 닉네임은 화면 표시에만, 서버로 보내지 않음.
     b. /setup: 마이크 권한 요청 → 실시간 음량 막대 → 3초 테스트 녹음 → 재생(테스트 음성은 업로드하지 않음).
        테스트를 통과해야 시작 버튼 활성(mic_check_passed=true). 권한 거부 시 브라우저별 해제 안내.
        A2 시나리오 목록(라디오, 기본 default). 제출 시 client_request_id = crypto.randomUUID() → S1.
        이미 준비 중 세션이 있는데 설정을 바꾸면 replaces_session_id로 새 세션.
     c. /prepare: S2 2초 폴링. linked/total 진행 막대. prepare_failed면 failures 목록(문항 번호·오류 코드의 한국어 설명)과
        "운영자가 음성을 반입한 뒤 다시 시도" 안내 + [같은 세트로 다시 준비](S3) + [설정 바꾸기](S4 후 /setup).
     d. /ready: 문항 수, 안내 문구, [시험 시작] — 이 클릭에서 useTtsPlayer.unlock() 후 S5 → /exam.
     e. /exam — 문항 한 개의 상태 머신(화면 상태): loading → playing → awaiting_record → recording → uploading → processing
        → (done → 다음 문항 loading) | (rejected → awaiting_record, 재녹음 안내) | (failed → [다시 처리](U3))
        - loading: Q1. all_answered면 E1 submit → /result. pending_answer가 있으면 그 상태로 복구(새로고침 대응).
        - playing: Host state=speaking, play(question.audio_url). 'blocked' → [눌러서 듣기] 버튼, 'error' → [다시 재생].
          재생이 끝나기 전에는 마이크 버튼 비활성. 재생과 녹음을 동시에 허용하지 않는다.
        - [다시 듣기]: replay_count < replay_limit일 때만. 클릭 → Q2 → 재생.
        - 마이크 버튼 하나로 시작/종료 토글(Host listening). 경과 시간 표시, record_max_ms에 자동 종료.
          MediaRecorder 형식은 audio/webm;codecs=opus → audio/ogg → audio/mp4 순으로 지원 여부 확인.
          녹음 중 Web Audio로 최대 음량 측정. 2초 미만이거나 거의 무음이면 업로드하지 않고 host_lines.say_again 재생 후 재녹음.
        - uploading: U1 (client_request_id는 녹음 1회당 1개, 재전송 시 같은 값). 네트워크 실패 → Blob 보관, 1·2·4초 간격 3회
          재전송 후 [다시 보내기]. "새로고침하면 녹음이 사라질 수 있어요" 경고.
        - processing: "답변 처리 중" + Host processing. U2 2초 폴링. done이고 current_order_no가 증가했으면
          host_lines.next 재생 후 다음 문항. 마지막이면 host_lines.finish 재생 → E1 → /result.
        - 진행 표시(3/8), 문항 텍스트는 기본 숨김 + [텍스트 보기] 토글.
     f. /result: E2 2초 폴링. grading → 채점 중 화면(3분 넘으면 "오래 걸리고 있어요", 폴링 계속).
        grading_failed → 오류 안내 + [다시 평가](E3). done →
          - assessed: 티어 카드(티어 색 = contracts tiers, 등급, headline), grade_rationale, 영역별 진단 4개(1~5 막대),
            피드백 카드(before = 내 답변 인용, after = 수정 예시; "연습용 예시" 라벨), 문항별 상세(문항·내 STT 답변·근거·실수·팁·지표),
            limitations, disclaimer.
          - insufficient_evidence: 등급 자리에 "판단 근거가 부족해요" + insufficient_reason. 낮은 등급으로 대신 표시하지 않는다.
        - [AI와 더 이야기하기] 비활성("준비 중"), [새 시험 보기](session_id 삭제 → /setup).
        - "근거 없는 정밀한 등급 거리"(예: 다음 등급까지 0.3)는 표시하지 않는다.
  4. 디자인: 차분한 시험장 톤의 한 가지 시각 방향을 정하고 이유를 handoff에 두 줄로. 보라 그라데이션·이모지 남발·카드만 나열 금지.
     데스크톱 1280px 기준, 키보드만으로 전 과정 가능, 포커스 링, 색 대비 AA, 버튼 aria-label, 상태 변화는 aria-live로 알림.
  5. 오류 코드별 문구는 contracts error_codes.message를 쓰고, 화면 동작은 REQUIREMENTS_v2 §9 표를 따른다.

  [하지 말 것]
  - speechSynthesis 사용, 텍스트만으로 시험 진행
  - 업로드 202만 보고 다음 문항 이동, 클라이언트에서 문항을 고르거나 순서 계산
  - 결과 화면에서 등급을 계산·보정

local_checks:
  - "cd frontend && VITE_USE_MOCK=1 npm run dev  → 로그인부터 결과까지 키보드로 완주"
  - "mock으로: prepare_failed → 재시도 → ready, rejected → 재녹음, 업로드 실패 → 재전송, grading_failed → 재평가, insufficient_evidence 화면"
  - "새로고침: /exam processing 중 새로고침 → 같은 문항 processing 복구"
  - "npm run build 경고 0, npm run lint(설정했다면)"
  - "python agents/tools/check_ownership.py frontend"

handoff_must_include:
  - 화면 목록과 각 화면이 호출하는 API
  - mock 서버 사용법, 실제 서버 연결 방법(VITE_API_BASE)
  - 디자인 방향 두 줄

done_when: "M2 PR 병합"
