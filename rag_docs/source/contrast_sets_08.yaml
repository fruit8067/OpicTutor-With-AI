# 질문 출처: 아래 영어 질문은 기출 복기의 주제와 기존 등급별 답변에 맞춰 새로 작성한 OPIc 스타일 연습문항으로, 확인된 실제 출제 원문이 아님.
# OPIc 등급 대조 세트 08 — Q138~Q187
# source_tier C: ACTFL Proficiency Guidelines 2024 (Speaking)를 참고한 교육용 합성 예시
# 주제 참고: 사용자 제공 「오픽 기출 정리와 AL 학습 계획」, 「오픽 문항별 기출과 AL 학습 계획」
# 수험생 복기를 소재로 각색한 질문이며 실제 기출 문구·채점 답변을 재현하지 않음.
# 총 50문항 × 9개 등급 = 450개 합성 답변
# 구조: Q번호 > NL/NM/NH/IL/IM1/IM2/IM3/IH/AL > text/rationale/upgrade_tip
# 실제 성적은 하나의 대본이 아닌 지속적 즉흥 말하기·발음·명료성 등을 포함해 평가됨.
# AL upgrade_tip: null

# Q138 질문: Tell me about a time the electricity suddenly went out while you were preparing dinner or spending the evening at home. What happened, and how did your family manage?
"Q138":
  "NL":
    "text": "Home.. Lights out. Dinner."
    "rationale": "갑자기 정전된 저녁에 가족과 식사를 준비했던 경험: 사건의 핵심 낱말만 표현해 과거 경험을 문장으로 서술하지 못함"
    "upgrade_tip": "일이 일어났다는 사실을 과거형 문장 하나로 말하기"
  "NM":
    "text": "I am at home. No light. I make dinner. It is bad. We eat bread. Good."
    "rationale": "갑자기 정전된 저녁에 가족과 식사를 준비했던 경험: 기억한 표현으로 경험을 언급하지만 사건 순서와 자신의 행동을 거의 설명하지 못함"
    "upgrade_tip": "언제·어디서 일어났는지를 짧은 문장으로 추가하기"
  "NH":
    "text": "Yesterday, my house have no lights. We make dinner. Stove no work. We eat bread and wait. Later light come back."
    "rationale": "갑자기 정전된 저녁에 가족과 식사를 준비했던 경험: 짧고 일부 불완전한 문장으로 문제를 말하지만 과거 시제와 서술 연결이 약함"
    "upgrade_tip": "사건의 시작과 문제를 과거형으로 구별해 말하기"
  "IL":
    "text": "Last autumn, our electricity went out during dinner. The stove stopped working. I called the building manager. We made cold sandwiches. The power returned later. We ate together."
    "rationale": "갑자기 정전된 저녁에 가족과 식사를 준비했던 경험: 사건과 결과를 독립된 문장으로 전달하지만 문제의 원인과 대처 과정이 단편적임"
    "upgrade_tip": "문제를 해결하기 위해 자신이 한 일을 두 문장으로 설명하기"
  "IM1":
    "text": "One evening last autumn, I was cooking dinner with my brother at home. We were making fried rice while our parents were on their way back from work. The lights and the electric stove suddenly went off. I checked the circuit breaker and called the building manager, who said the whole block had lost power. We used a flashlight to make sandwiches instead and ate together until the power returned. I was happy in the end."
    "rationale": "갑자기 정전된 저녁에 가족과 식사를 준비했던 경험: 사건의 기본 흐름을 문장 여러 개로 전달하고 결과를 말하지만 구체성이 제한적임"
    "upgrade_tip": "문제가 생긴 순간의 상황과 감정을 보태기"
  "IM2":
    "text": "One evening last autumn, I was cooking dinner with my brother at home. We were making fried rice while our parents were on their way back from work. Everything seemed fine at first, but the lights and the electric stove suddenly went off. I wasn't sure what to do, so I checked the circuit breaker and called the building manager, who said the whole block had lost power. Luckily, we used a flashlight to make sandwiches instead and ate together until the power returned. What first felt stressful became a surprisingly pleasant family evening."
    "rationale": "갑자기 정전된 저녁에 가족과 식사를 준비했던 경험: 배경과 문제, 대처, 결과를 연결하고 개인적 반응을 덧붙이나 사건 묘사가 다소 압축적임"
    "upgrade_tip": "해결 과정에서 선택한 행동과 이유를 구체적으로 말하기"
  "IM3":
    "text": "One evening last autumn, I was cooking dinner with my brother at home. We were making fried rice while our parents were on their way back from work. However, the lights and the electric stove suddenly went off. At first, I didn't know how we would handle it. Then I checked the circuit breaker and called the building manager, who said the whole block had lost power. As a result, we used a flashlight to make sandwiches instead and ate together until the power returned. What first felt stressful became a surprisingly pleasant family evening. I learned to keep a small emergency light somewhere easy to find."
    "rationale": "갑자기 정전된 저녁에 가족과 식사를 준비했던 경험: 시간 순서와 세부 정보가 비교적 자연스럽게 이어지지만 낯선 돌발 상황에서도 같은 수준을 유지하는지는 불명확함"
    "upgrade_tip": "예상 밖의 변화에 대처한 선택과 그 결과를 길게 설명하기"
  "IH":
    "text": "One evening last autumn, I was cooking dinner with my brother at home. We were making fried rice while our parents were on their way back from work. The difficult part was that the lights and the electric stove suddenly went off. I had to make a quick decision rather than ignore the problem. I checked the circuit breaker and called the building manager, who said the whole block had lost power. Fortunately, we used a flashlight to make sandwiches instead and ate together until the power returned. What first felt stressful became a surprisingly pleasant family evening. Looking back, I learned to keep a small emergency light somewhere easy to find."
    "rationale": "갑자기 정전된 저녁에 가족과 식사를 준비했던 경험: 과거 경험을 문단에 가깝게 서술하고 돌발 문제 해결을 보여주나 Advanced 과제의 지속성은 한 답변으로 검증되지 않음"
    "upgrade_tip": "다른 즉흥 질문에서도 시제와 문제 해결 서술을 안정적으로 유지하기"
  "AL":
    "text": "One evening last autumn, I was cooking dinner with my brother at home. We were making fried rice while our parents were on their way back from work. I had expected everything to go smoothly, but the lights and the electric stove suddenly went off. For a moment I was unsure what to do, especially because the situation affected other people as well. I decided to act instead of waiting: I checked the circuit breaker and called the building manager, who said the whole block had lost power. In the end, we used a flashlight to make sandwiches instead and ate together until the power returned. What first felt stressful became a surprisingly pleasant family evening. Afterward, I learned to keep a small emergency light somewhere easy to find. I now charge that light regularly and would do the same thing again if the power went out."
    "rationale": "갑자기 정전된 저녁에 가족과 식사를 준비했던 경험: 복잡한 사건의 배경·대처·결과·현재의 의미를 연결하여 Advanced Low 특성을 보여주는 합성 예시임 단일 문항 전사문만으로 실제 OPIc 등급을 판정할 수 없음."
    "upgrade_tip": null
