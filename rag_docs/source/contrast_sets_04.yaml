# 등급 대조 세트 (source_tier C: ACTFL Proficiency Guidelines 2024 Speaking 기준을 참고한 직접 작성 합성 예시)
# 기존 Q001~Q009와 주제가 겹치지 않게 구성, 사용자 요청에 따라 Q013부터 시작. Q010~Q012의 실제 내용은 확인되지 않음.
# 각 답변: text / rationale / upgrade_tip
# 등급은 확정 채점 결과가 아님. IM1~IM3 세부 차이는 ACTFL 문서 자체의 독립 서술이 아닌 학습용 구분.
# 기준: ACTFL Proficiency Guidelines 2024, pp. 12~22 (FACT, Speaking Novice/Intermediate/Advanced)

# Q013 질문: Describe a restaurant you visit often. Where is it, what is it like, and why do you go there?
# 한국어: 자주 가는 식당의 위치, 분위기, 음식, 그곳을 찾는 이유를 설명하시오.
Q013:
  NL:
    text: "Restaurant... near school. Noodles. Good."
    rationale: "식당과 음식에 관한 친숙한 단어를 제시하지만 독립적인 설명은 거의 없음."
    upgrade_tip: "I eat noodles. 같은 익숙한 정형 문장 하나로 정보를 전달하기."
  NM:
    text: "I like this restaurant. It is good. I eat noodles. The noodles are good. I go there."
    rationale: "기억해 둔 짧은 표현을 반복하며 취향을 전달하지만 식당을 구체적으로 묘사하지 못함."
    upgrade_tip: "It is near my school.처럼 위치와 특징을 각각 짧은 문장으로 추가하기."
  NH:
    text: "There is a noodle restaurant near my school. It is small. I go with friends. I eat spicy noodles. Very good. I go there on Friday."
    rationale: "친숙한 상황에서 짧고 때로는 불완전한 문장으로 활동과 선호를 설명함."
    upgrade_tip: "누구와 언제 방문하는지 완전한 문장으로 묶고 새로운 정보를 덧붙이기."
  IL:
    text: "My favorite restaurant is near my university. It is a small noodle shop. The tables are close together. I usually order spicy noodles. The food is cheap. I go there with my classmates after class. Sometimes it is crowded, so we wait outside."
    rationale: "익숙한 장소의 위치, 음식, 이용 습관을 스스로 만든 개별 문장으로 전달함. 내용이 주로 한 문장씩 이어짐."
    upgrade_tip: "방문하는 순서나 구체적인 장면을 연결해 묘사의 흐름을 만들기."
  IM1:
    text: "There is a noodle shop about five minutes from my university. I go there with my friends after class, usually on Fridays. The restaurant is small, and there are only a few tables. I always order spicy noodles because the soup is rich and filling. When we finish eating, we sometimes stop at a café nearby."
    rationale: "기본적인 위치·분위기·이용 습관을 연결된 문장으로 설명하고 간단한 이유를 제시함."
    upgrade_tip: "한 번 방문했을 때의 구체적인 상황을 추가해 답변을 확장하기."
  IM2:
    text: "I often go to a small noodle restaurant near my university. It is not fancy, but it feels comfortable because the owner is friendly and remembers regular customers. I usually order spicy noodles, while my friend prefers the mild version. We go there after our afternoon classes because the portions are generous and the prices are reasonable. The only downside is that it gets crowded around lunchtime, so we try to arrive a little later."
    rationale: "묘사와 이유, 간단한 대비를 연결해 개인적 의미를 표현함. 아직은 익숙한 정보 중심의 문장 연결이 핵심임."
    upgrade_tip: "한 번의 구체적인 경험을 시간 순서대로 서술해 보기."
  IM3:
    text: "One place I keep going back to is a little noodle shop tucked away behind my campus. From the outside, it looks ordinary, but inside it is warm and lively, especially after classes end. The owner usually greets us, and I tend to order the same spicy noodles because the broth has a deep flavor. My friends and I often sit near the window and talk about assignments while we eat. It can be difficult to find a seat at noon, so we normally go after two. I like the restaurant as much for those conversations as for the food."
    rationale: "위치·분위기·행동을 자연스럽게 연결하고 방문 시간 선택의 이유까지 설명함. 특정 친숙한 주제의 유연한 말하기 예시임."
    upgrade_tip: "처음 발견했을 때의 경험이나 예상 밖의 상황을 별도 사건으로 길게 서술하기."
  IH:
    text: "My favorite place to eat near campus is a small noodle shop that I found during my first semester. I was looking for somewhere inexpensive between classes, and a classmate recommended it. At first, I went mainly for the food, but over time it became our regular meeting place. The owner remembers what we usually order, and the atmosphere is relaxed even when the restaurant is busy. Last week, we arrived just before closing and learned that the noodles had sold out, so we chose another dish instead. It was surprisingly good, and now I have something else to recommend to friends. I probably go there as much to catch up with people as to eat."
    rationale: "과거의 발견 계기, 현재의 습관, 작은 돌발 상황까지 문단에 가까운 흐름으로 서술함. 이 한 답변만으로 Advanced 수행의 지속성은 확인할 수 없음."
    upgrade_tip: "예상 밖의 상황을 더 폭넓은 주제에서도 시간대와 세부사항을 유지하며 설명하기."
  AL:
    text: "There is a small noodle shop behind my university that has become something of a gathering place for my friends. I discovered it during my first semester, when I had only half an hour between two classes and needed an inexpensive meal. Although the shop looked unremarkable, the food was excellent, and the owner patiently explained the menu when I could not decide what to order. Since then, we have gone back regularly. The restaurant has only six tables, so when we arrive at peak time, we sometimes have to change our plans. A few weeks ago, for example, a large group had reserved most of the seats. Rather than waiting and risking being late for class, I called a nearby branch that the owner recommended and arranged for everyone to meet there. What keeps me returning is not just the noodles; it is the sense of familiarity and the way the staff handle even inconvenient situations. I expect I will still visit whenever I come back to campus after graduation."
    rationale: "장소 묘사, 과거부터 현재까지의 변화, 구체적인 문제와 대처, 향후 계획을 응집된 문단으로 연결함. Advanced Low의 기능을 보여 주도록 설계한 합성 예시임."
    upgrade_tip: null

# Q014 질문: Tell me about a time you missed a bus or train. What happened, and what did you do next?
# 한국어: 버스나 기차를 놓친 경험을 설명하고, 그 후 어떻게 대처했는지 이야기하시오.
Q014:
  NL:
    text: "Train... late. Station. Taxi."
    rationale: "사건 관련 단어로 핵심 상황을 암시하지만 시간 순서나 서술이 나타나지 않음."
    upgrade_tip: "I missed the train. 같은 익숙한 문장 하나부터 완성하기."
  NM:
    text: "I go to the station. Train gone. I am late. I take taxi. It is bad."
    rationale: "외운 표현과 일부 짧은 문장을 사용하지만 사건이 충분히 연결되지 않고 시간 표현이 제한적임."
    upgrade_tip: "Yesterday와 missed 같은 표현으로 언제 무슨 일이 있었는지 말하기."
  NH:
    text: "Yesterday I miss the bus. I run to bus stop. Bus is gone. I am late for school. I take taxi. Very expensive."
    rationale: "익숙한 교통 상황을 짧은 현재 중심 표현으로 나열하며, 과거 서술은 아직 불안정함."
    upgrade_tip: "과거 사건을 말할 때 missed, ran, took 같은 동사를 연습하기."
  IL:
    text: "Last month, I missed the bus to school. I arrived at the stop too late. I checked the next bus on my phone. It was twenty minutes away. I was worried because I had a class. I took a taxi. I arrived just before class started."
    rationale: "사건과 대응을 여러 독립 문장으로 설명하지만 인과관계나 상황 묘사는 단순함."
    upgrade_tip: "왜 늦었는지와 교통수단을 바꾼 이유를 연결어로 설명하기."
  IM1:
    text: "Last month, I missed my bus to university because I left home too late. I ran to the bus stop, but the bus was already gone. I checked the schedule, and the next bus was coming in twenty minutes. I was worried about being late for class, so I took a taxi. Luckily, I arrived just in time."
    rationale: "익숙한 사건의 시작·문제·해결·결과를 일련의 문장으로 이어 말함."
    upgrade_tip: "당시 상황과 느낌을 한두 문장 더 넣어 사건을 구체화하기."
  IM2:
    text: "I once missed the bus on the morning of an important presentation. I had stayed up late the night before, so I woke up later than usual. When I reached the bus stop, I saw my bus pulling away. I checked the route on my phone, but the next one would arrive too late. In the end, I called a taxi and explained the situation to my teammate. I made it to campus with a few minutes to spare, although the taxi cost much more than I expected."
    rationale: "시간 순서, 원인, 대처를 비교적 자연스럽게 연결함. 친숙한 일화에서 문장 연결을 확장하는 수행을 보여줌."
    upgrade_tip: "그때 무엇을 우선순위로 판단했는지와 구체적 의사소통을 더해 보기."
  IM3:
    text: "I remember missing an early train when I was traveling to another city for a concert. I had left my hotel on time, but I went to the wrong entrance of the station and lost several minutes looking for the platform. By the time I found it, the doors had closed. I was upset, but I asked a station employee whether I could change my ticket. She showed me the next departure, and I paid a small fee to rebook. I also sent a message to my friend so she would know I would arrive later. It was stressful, but everything worked out."
    rationale: "시간 순서로 사건을 연결하고 표 변경과 연락이라는 대처를 제시함. 익숙한 경험의 확장된 서술이지만 Advanced의 지속성은 검증되지 않음."
    upgrade_tip: "직원이 거절하거나 다음 열차가 없는 상황까지 가정해 대안을 설명하기."
  IH:
    text: "A few months ago, I missed a train while traveling to another city for an interview. I had checked the departure time carefully, but I underestimated how long it would take to get through the station during rush hour. When I reached the platform, the doors were already closed. I was frustrated because the interview was scheduled for that afternoon. I spoke to a staff member, found out that the next direct train was full, and then asked about a route with one transfer. It took longer, but it would still get me there before the interview. I booked the alternative ticket and called the company to explain that I might arrive slightly later than planned. In the end, I arrived on time, although the whole experience was exhausting."
    rationale: "과거 사건을 문단 수준으로 연결하고 예상치 못한 문제에 대안을 찾아 대응함. 개별 답변에서는 Advanced 기능이 나타나지만 다른 상황에서의 일관성은 미확인임."
    upgrade_tip: "다른 시간대의 묘사나 추가적인 돌발 상황에도 유사한 서술과 대응을 유지하기."
  AL:
    text: "Last spring, I nearly missed an important job interview after missing the first train of the morning. I had planned my route the night before, but the station entrance I normally used was closed for construction, and I lost time finding another way in. When I reached the platform, I watched the train pull away. The next direct service was fully booked, so simply waiting was not an option. I went to the information desk, explained that I needed to reach the city by noon, and asked the employee to compare the available routes. She found a connection through a smaller station that I would never have considered on my own. I bought the replacement ticket, notified the interviewer that my arrival time might change, and followed the connection carefully. Fortunately, I reached the building with enough time to prepare. Since that experience, I have made a habit of checking not only departure times but also station notices and alternative routes before important trips."
    rationale: "시간적 배경과 문제의 원인, 대안 탐색, 타인과의 조율, 결과 및 변화된 습관을 문단으로 상세하게 서술함."
    upgrade_tip: null

# Q015 질문: How has your neighborhood changed over the past few years? Describe what it was like before and what it is like now.
# 한국어: 지난 몇 년 동안 동네가 어떻게 변했는지 과거 모습과 현재 모습을 비교해 설명하시오.
Q015:
  NL:
    text: "Neighborhood... shops. New buildings. Busy."
    rationale: "변화와 관련된 명사를 제시하지만 이전과 현재를 구별하는 발화는 아직 나타나지 않음."
    upgrade_tip: "There is a new shop.처럼 현재의 변화 하나를 문장으로 만들기."
  NM:
    text: "My town is good. There is a park. There are shops. I like my town."
    rationale: "익숙한 현재 정보는 말하지만 과거와 현재를 비교하는 요구는 대부분 수행하지 못함."
    upgrade_tip: "Before, there was one shop. Now there are three. 같은 정형 비교 표현 익히기."
  NH:
    text: "My neighborhood has new store. Before, small. Now, big. There are many people. I like new café. But street busy."
    rationale: "일부 짧은 문장과 단편적 대조로 변화를 전달하지만 표현과 시제 제어가 제한적임."
    upgrade_tip: "Before와 now를 사용해 두 시기의 모습을 각각 완전한 문장으로 설명하기."
  IL:
    text: "I have lived in this neighborhood for a long time. Before, there were only a few stores. Now there is a supermarket and a large café. Many people visit the area. There are more cars, too. The streets are sometimes noisy. I like the new stores, but I miss the quiet streets."
    rationale: "과거와 현재에 대한 기본 정보를 독립 문장으로 설명하고 간단한 선호를 표현함."
    upgrade_tip: "무엇 때문에 변화했는지 한 가지 이유와 실제 예를 덧붙이기."
  IM1:
    text: "My neighborhood has changed a lot since I was in high school. It used to be quiet, with a few small shops and houses. Now there are several cafés and a new supermarket. I like having more places to meet friends, but traffic is heavier than before. I think the area is more convenient, although it is not as peaceful as it used to be."
    rationale: "익숙한 동네 변화를 과거와 현재로 구분하며 몇 가지 문장을 연결해 설명함."
    upgrade_tip: "변화가 일상생활에 미친 영향을 특정 상황으로 보여주기."
  IM2:
    text: "When I first moved into my neighborhood, most of the buildings were low, and there were only a couple of cafés. Over the past few years, several apartment buildings have gone up, and many new shops have opened near the station. It is much easier to buy groceries or meet friends now. However, the roads are more crowded, especially in the evening. For example, a trip that used to take ten minutes by bus sometimes takes almost twenty. So I appreciate the convenience, but I also miss how quiet the area was."
    rationale: "과거·현재의 변화와 개인적 영향을 예시를 들어 연결함. 익숙한 비교 과제를 문장 단위로 수행하는 모습임."
    upgrade_tip: "특정 변화가 일어난 계기와 그 결과를 길게 서술하기."
  IM3:
    text: "The neighborhood where I grew up looks quite different now. Ten years ago, it was mostly residential, with a small grocery store and a playground. Recently, new apartments and restaurants have opened near the subway station, and the main street stays busy even at night. One positive change is that I no longer have to travel far to buy everyday things. On the other hand, it has become harder to find parking, and some older shops have disappeared. My family still goes to one of the remaining bakeries because we have known the owner for years. The area is more convenient, but it feels less personal than it did before."
    rationale: "여러 변화와 장단점을 조직적으로 연결하며 과거와 현재를 비교함. 확장된 문장 연결 능력을 보여주는 학습용 예시임."
    upgrade_tip: "하나의 변화를 골라 원인과 진행 과정, 지역 주민의 대응을 서술해 보기."
  IH:
    text: "I have lived in the same neighborhood since middle school, so I have watched it change quite a bit. It used to be a quiet residential area with family-owned stores, but a new subway exit opened a few years ago, and that brought more visitors and businesses. The change has been convenient for me. I can now get groceries on my way home and meet friends without traveling downtown. At the same time, some long-standing shops have closed because rents went up, and the streets feel less familiar. Last year, a bakery that my family used to visit closed suddenly, and many neighbors were disappointed. I understand why the area is developing, but I hope it can keep some of its local character."
    rationale: "배경, 변화의 계기, 개인적 경험 및 평가를 긴 발화로 연결함. Advanced형 설명을 시도하지만 광범위한 과제에서의 안정성은 별도 확인이 필요함."
    upgrade_tip: "관련된 돌발 상황이나 앞으로의 지역 변화에 관해 문단 수준으로 지속해서 설명하기."
  AL:
    text: "The biggest change in my neighborhood has been the area around the subway station. When I was younger, it was mostly quiet streets lined with small family-run shops. About four years ago, the city opened a new exit and improved the sidewalks, which made the area much easier to reach. New cafés, restaurants, and apartment buildings soon followed. Those changes have made everyday life more convenient, but they have also created problems that residents did not anticipate. For instance, when a popular restaurant opened beside an old residential street, delivery motorcycles began blocking the sidewalk. Several neighbors contacted the district office, and the restaurant eventually agreed to create a separate pickup area. The situation improved, though the neighborhood is still busier than it once was. Looking ahead, I hope future development will include practical measures to protect pedestrians and support long-established businesses. I welcome the new facilities, but I would rather see the area become more livable than simply more crowded."
    rationale: "과거와 현재의 서술·묘사, 예상 밖의 지역 문제와 해결, 향후 변화에 대한 구체적 제안을 응집된 담화로 표현함."
    upgrade_tip: null

# Q016 질문: You registered for a fitness class, but the center changed the schedule. Call the center, explain the problem, ask questions, and suggest an alternative.
# 한국어: 신청한 운동 수업 시간이 변경되었다. 센터에 전화해 문제를 설명하고, 질문과 대안을 제시하시오.
Q016:
  NL:
    text: "Class... time changed. When? Refund?"
    rationale: "상황의 핵심 단어와 아주 짧은 질문을 제시하지만 문제를 충분히 설명하지 못함."
    upgrade_tip: "My class changed. Can I change it? 같은 정형 문장으로 요청하기."
  NM:
    text: "Hello. My class changed. I cannot go. What time? Please help."
    rationale: "암기한 인사·요청 표현으로 기본 문제를 전달하지만 상황과 원하는 조치를 명확히 연결하지 못함."
    upgrade_tip: "I have a class on Tuesday.처럼 기존 예약 정보를 한 문장으로 제시하기."
  NH:
    text: "Hello. I have yoga class Tuesday. Now class is Thursday. I cannot Thursday. Other class? Saturday class? Please."
    rationale: "익숙한 예약 정보와 간단한 질문은 전달하지만 문장이 짧고 불완전한 부분이 있음."
    upgrade_tip: "기존 시간과 변경 시간을 완전한 문장으로 설명하고 하나의 대안을 요청하기."
  IL:
    text: "Hello, I signed up for a yoga class on Tuesday evening. I got a message that the class moved to Thursday. I work on Thursday, so I cannot attend. Do you have another evening class? Is there a class on Saturday? Can I change my registration?"
    rationale: "예약 정보, 문제, 기본적인 질문을 여러 독립 문장으로 제시해 단순한 거래 상황을 처리함."
    upgrade_tip: "새 수업이 없을 때 가능한 조치도 문의하며 대화를 확장하기."
  IM1:
