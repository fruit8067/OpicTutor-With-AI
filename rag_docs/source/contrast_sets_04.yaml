    rationale: "친숙한 주변 문제를 개별 문장으로 설명하고 간단한 의견과 요청을 표현함."
    upgrade_tip: "문제가 실제로 생겼던 구체적인 상황을 한 가지 덧붙이기."
  IM1:
    text: "One problem in my neighborhood is the amount of plastic waste near the bus stop. Many people buy coffee and leave empty cups there. I try to bring a reusable bottle, but I still see a lot of trash. I think more clearly marked bins would help. Shops could also encourage customers to use their own cups."
    rationale: "문제·개인 경험·가능한 해결책을 일련의 문장으로 전달함. 내용은 개인적이고 구체적인 범위에 머묾."
    upgrade_tip: "어떤 장소에서 문제가 심하고 제안이 어떻게 작동할지 예를 들어 설명하기."
  IM2:
    text: "I have noticed that disposable coffee cups are a problem near the subway exit in my neighborhood. In the morning, the area looks clean, but by evening there are often cups left on benches. I try to use a reusable tumbler, although I sometimes forget it. I think cafés could offer a small discount for reusable cups, and the district office could place clearer recycling signs near the exit. People would probably be more careful if the rules were easier to follow."
    rationale: "일상에서 관찰한 문제와 간단한 원인·해결책을 연결해 설명함. 익숙한 구체적 상황을 다루는 예시임."
    upgrade_tip: "과거에 일어난 실제 사례와 변화 과정을 서술하며 제안의 효과를 설명하기."
  IM3:
    text: "The environmental issue I notice most in my neighborhood is single-use plastic, especially around the subway station. There are several takeaway cafés, and the trash bins are often overflowing with cups by the end of the day. Some people leave their drinks next to the bins when there is no space left, which makes the street look messy. I have started carrying a reusable cup, and a few shops offer discounts for doing that. I think the local government could improve the bins and post simple signs explaining where to throw away lids and cups. It would also help if cafés worked together on a collection point."
    rationale: "장면 묘사, 원인에 관한 관찰, 개인 경험, 해결책을 조직된 문장으로 연결함. 정책을 깊이 논증하기보다는 구체적 상황을 설명함."
    upgrade_tip: "제안이 실제로 시행되었을 때 생길 문제와 대응 방법도 서술해 보기."
  IH:
    text: "One issue that has become noticeable in my neighborhood is the number of disposable drink cups left around the subway station. The problem is worst in the evening, when the bins are full and people leave their cups beside them. I first paid attention to it after seeing a volunteer group clean the area last year. Since then, I have tried to carry a reusable cup, and I have encouraged friends to do the same. I think local cafés and the district office could work together to install better collection points and put up clearer signs. That would not solve everything, but it could make it easier for people to dispose of their waste properly."
    rationale: "구체적 지역 문제의 배경과 개인적 경험을 연결하고 실행 가능한 제안을 제시함. 일부 Advanced형 확장이 있지만 지속적 수행 여부는 알 수 없음."
    upgrade_tip: "해결책 추진 중 예상되는 비용·공간 문제와 대응을 실제 사례처럼 설명하기."
  AL:
    text: "In my neighborhood, one of the most visible environmental problems is the amount of disposable packaging that accumulates around the subway station. The area became much busier after several takeaway cafés opened, but the public bins were never redesigned to handle the additional waste. Last summer, a group of residents organized a weekend cleanup, and I joined them for one morning. We collected dozens of cups from the same few corners, which suggested that the issue was not simply careless behavior; the disposal system was inconvenient. Afterward, the group asked the district office to install separate collection containers, but officials explained that there was not enough space on the narrow sidewalk. The residents then proposed using a small section of an adjacent public square, where collection would not block pedestrians. A pilot collection point was eventually installed, and the area stayed noticeably cleaner during the following weeks. If the project continues, I think nearby cafés should help publicize it and collect feedback from customers. That approach would address both people’s habits and the practical obstacles they face."
    rationale: "지역 문제의 구체적 배경, 과거의 활동, 행정상 제약, 협의와 해결, 향후 실행 방법을 문단 수준으로 일관되게 서술함. Advanced 기능을 시연하는 합성 사례임."
