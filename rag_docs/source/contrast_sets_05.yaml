# 등급 대조 세트 (source_tier C: ACTFL Proficiency Guidelines 2024를 참고한 직접 작성 합성 예시) — Q018~Q037
# 형식: Q번호 > NL/NM/NH/IL/IM1/IM2/IM3/IH/AL > text, rationale, upgrade_tip
# 하위 단계의 일부 오류는 교육용으로 의도한 예시이며 실제 등급 판정 답안이 아님.
# 참고: ACTFL 2024 Speaking pp. 15~21 (Novice / Intermediate / Advanced).
# 중요: IM1~IM3의 구체적 답변 차이는 공식 독립 루브릭이 아니라 학습용 설계임. 단어 수와 결론 유무는 공식 채점 공식이 아님.

# Q018 질문: Describe a mobile app you use frequently. Explain its main features and why it is useful to you.
Q018:
  NL:
    text: "App... maps. Phone. Bus. Good."
    rationale: "지도 앱과 교통 확인에 관한 낱말이나 끊긴 구절을 제시하지만 요청된 말하기 과제를 문장으로 수행하지 못함."
    upgrade_tip: "친숙한 대상의 이름과 특징을 I use / It is 등의 한 문장으로 말하기."
  NM:
    text: "I use a map app. I like it. It is good. I use it every day."
    rationale: "지도 앱과 교통 확인을 외운 단문 중심으로 표현하지만 정보의 확장이나 질문에 필요한 전개가 부족함."
    upgrade_tip: "언제·어디서·무엇을 하는지 서로 다른 짧은 문장으로 추가하기."
  NH:
    text: "I use map app on phone. It show bus. I search places. I go school. I check it every morning. My friend use this app too. Sometimes bus is late. Very useful."
    rationale: "지도 앱과 교통 확인을 짧은 문장으로 전하려 하나 관사·시제·수 일치 또는 문장 완결성에서 흔들림이 있고 연결이 제한됨."
    upgrade_tip: "지도 앱과 교통 확인을 주어와 동사가 있는 완전한 문장으로 표현하고 필요한 시제나 복수형을 맞추기."
  IL:
    text: "I use a map app on my phone. It shows buses and subway routes. I open it before I leave home. I check the arrival time. Sometimes I save places. It also shows places near me. I use it when I visit a new area. It helps me get to unfamiliar locations."
    rationale: "지도 앱과 교통 확인의 필수 정보를 자신의 문장으로 말하지만 문장 사이 연결과 구체적 상황 확장이 적음."
    upgrade_tip: "실시간 도착 정보 활용에 필요한 정보 두세 개를 순서 있게 연결해 작은 장면으로 설명하기."
  IM1:
    text: "I use a map app almost every day. Before I leave for campus, I check how long the bus will take. The app shows several routes, so I choose the fastest one. I also save the locations of cafés and stores that I want to visit. For example, I used it yesterday when my bus was late, and I found another route. It is especially useful when I travel."
    rationale: "실시간 도착 정보 활용의 주요 정보를 순서 있게 전달하나 각 설명이 짧고 인과관계나 장면 묘사가 충분히 확장되지 않음."
    upgrade_tip: "실시간 도착 정보 활용의 이유나 실제 예시를 한 가지 골라 두세 문장으로 더 말하기."
  IM2:
    text: "One app I rely on is a map service. It gives me real-time bus information, walking directions, and estimated travel times. For example, if my usual bus is delayed, I compare it with the subway route. I also using the saved-place feature when friends recommend restaurants. When I travel somewhere unfamiliar, I check the station exit before I leave. I once walked in the wrong direction, so now I take a screenshot of the route as well. It saves time because I do not have to search for the same place again."
    rationale: "실시간 도착 정보 활용에 이유·예시·개인 경험을 추가해 발화를 이어감. 일부 문법이나 연결 표현의 안정성은 더 다듬을 수 있음."
    upgrade_tip: "폐쇄된 출입구로 인한 우회에서 누가 무엇을 했는지 구체화하고 문법·연결어를 정리하기."
  IM3:
    text: "I probably open my map app more often than any other app. On weekday mornings, it helps me decide whether to catch a bus or walk to the station. The live arrival information is convenient, especially when it is raining and I do not want to stand outside for long. I also organize interesting places into lists, so planning an outing with friends is easier. Last month, I visited a friend in a new neighborhood and saved her address before leaving home. The app suggested a fast transfer, but I checked the station signs when I arrived, since large stations can be confusing. The directions are usually clear, although I still double-check the exits at large stations."
    rationale: "실시간 도착 정보 활용을 구체적인 세부사항과 함께 비교적 유연하게 설명함. 다만 이 한 답변으로 Advanced 과제 수행의 일관성을 확인할 수는 없음."
    upgrade_tip: "폐쇄된 출입구로 인한 우회를 단순 소개에서 벗어나 원인·대응·결과까지 이어 서술하기."
  IH:
    text: "I began using my map app regularly after moving to a new area. At first, I depended on it for almost every trip because I did not know the bus routes. Now I mainly use it to compare travel times and check delays. Once, the app sent me toward an exit that was closed for construction. I had to stop, ask someone for directions, and take a different route. That experience reminded me that digital tools are helpful but not perfect. When I first moved, I sometimes followed its directions without looking at the station signs, so I got confused when a route changed. Now I check the arrival board as well. If a delay appears while I am already traveling, I can usually explain the new meeting time to the person waiting for me. Even so, I would find it difficult to manage my daily commute without the app."
    rationale: "폐쇄된 출입구로 인한 우회를 배경·행동·결과로 연결한 긴 발화에서 Advanced형 수행이 일부 나타남. 더 넓은 상황에서 이를 지속할 수 있는지는 확인되지 않음."
    upgrade_tip: "친구들과 경로를 조정한 과정 관련 후속 질문이나 돌발 조건이 주어져도 시간대와 문단 흐름을 안정적으로 유지하기."
  AL:
    text: "A navigation app has become an essential part of my routine, but the reason I value it has changed. When I first moved near campus, I used it simply to avoid getting lost. These days, I use its live transit information to make decisions: if a bus is delayed, I compare the train and walking options before leaving home. The saved-place lists are also useful when I organize activities with friends, because I can share several locations rather than sending separate addresses. There was one occasion when the suggested station entrance was closed for repairs. Instead of following the instructions blindly, I checked another exit and confirmed the route with a station employee. Recently, I was meeting friends at a restaurant just before a heavy rainstorm. The app showed that two bus routes were delayed, so I suggested taking the subway and sent everyone a shared route. One friend had already left, so I called to explain the change rather than assuming the message would be seen. We all arrived at roughly the same time. I still rely on the app, but I have learned to treat its estimates as guidance rather than guarantees."
    rationale: "친구들과 경로를 조정한 과정을 시간대·상황 제약·의사소통 목적에 맞춰 조직적인 문단 수준으로 전달함. Advanced Low의 주요 기능을 보여주는 합성 예시임."
    upgrade_tip: null

# Q019 질문: Tell me about a new hobby or skill you learned. How did you start, and what was challenging?
Q019:
  NL:
    text: "Guitar. Friend. Hard. Music."
    rationale: "기타 연습 습관에 관한 낱말이나 끊긴 구절을 제시하지만 요청된 말하기 과제를 문장으로 수행하지 못함."
    upgrade_tip: "I went / I lost / I tried처럼 사건을 한 문장으로 완성하기."
  NM:
    text: "I play guitar. I like music. My friend plays guitar. It is fun."
    rationale: "기타 연습 습관을 외운 단문 중심으로 표현하지만 정보의 확장이나 질문에 필요한 전개가 부족함."
    upgrade_tip: "언제·어디서·누구와 있었는지를 익숙한 과거 표현으로 추가하기."
  NH:
    text: "I learn guitar last year. My friend teach me. My fingers hurt. I practice at home. I practice after dinner. My finger hurt. Teacher help me. I like songs. Now I play song."
    rationale: "기타 연습 습관을 짧은 문장으로 전하려 하나 관사·시제·수 일치 또는 문장 완결성에서 흔들림이 있고 연결이 제한됨."
    upgrade_tip: "기타 연습 습관을 주어와 동사가 있는 완전한 문장으로 표현하고 필요한 시제나 복수형을 맞추기."
  IL:
    text: "I started learning the guitar last year. My friend showed me a few chords. I watched videos at home. My fingers hurt at first. I practiced for twenty minutes each evening. My friend showed me an easy song. I practiced it many times. Now I can play a simple song."
    rationale: "기타 연습 습관의 필수 정보를 자신의 문장으로 말하지만 문장 사이 연결과 구체적 상황 확장이 적음."
    upgrade_tip: "막히는 부분을 나누어 연습한 경험에 필요한 정보 두세 개를 순서 있게 연결해 작은 장면으로 설명하기."
  IM1:
    text: "I started playing the guitar because my roommate often played music in our room. He taught me three basic chords, and I practiced them every evening. Changing chords was difficult at first, so I used a slow practice video. After a month, I could play part of my favorite song. At first, changing chords was difficult, so I watched short lessons and practiced for fifteen minutes each night. That made me want to continue."
    rationale: "막히는 부분을 나누어 연습한 경험의 주요 정보를 순서 있게 전달하나 각 설명이 짧고 인과관계나 장면 묘사가 충분히 확장되지 않음."
    upgrade_tip: "막히는 부분을 나누어 연습한 경험의 이유나 실제 예시를 한 가지 골라 두세 문장으로 더 말하기."
  IM2:
    text: "I took up the guitar after hearing my roommate play an acoustic song. He lent me an old guitar and taught me the basics. At first, I could not change chords quickly, and my fingertips were sore. Instead of trying to learn a whole song, I practiced short sections for fifteen minutes a day. One weekend, I try playing the song for my friends and forgot the middle section. I was embarrassed, but they told me to slow down and start again. A few weeks later, I managed to play along with a recording, which felt like a big achievement."
    rationale: "막히는 부분을 나누어 연습한 경험에 이유·예시·개인 경험을 추가해 발화를 이어감. 일부 문법이나 연결 표현의 안정성은 더 다듬을 수 있음."
    upgrade_tip: "연습 방법을 바꾼 계기에서 누가 무엇을 했는지 구체화하고 문법·연결어를 정리하기."
  IM3:
    text: "Learning the guitar has been one of the most rewarding things I have tried recently. I became interested when a friend played at a small gathering and offered to teach me. The first challenge was coordinating my hands: I could remember the chords, but the rhythm fell apart whenever I changed them. I recorded myself once a week and noticed that even small improvements were easier to hear than to feel. I recorded myself once a week because it was hard to notice small mistakes while playing. Comparing the recordings showed me that I was gradually making cleaner chord changes, even though I still struggled with rhythm. I still make mistakes, but I can now play two songs from beginning to end."
    rationale: "막히는 부분을 나누어 연습한 경험을 구체적인 세부사항과 함께 비교적 유연하게 설명함. 다만 이 한 답변으로 Advanced 과제 수행의 일관성을 확인할 수는 없음."
    upgrade_tip: "연습 방법을 바꾼 계기를 단순 소개에서 벗어나 원인·대응·결과까지 이어 서술하기."
  IH:
    text: "I started learning the guitar about a year ago because I wanted an activity that did not involve a computer. A friend helped me choose a used instrument and showed me how to practice basic chords. For the first month, progress was frustratingly slow, and I almost stopped when I could not keep up with a simple song. My friend suggested slowing the recording down and practicing just the difficult transition. That worked surprisingly well. These days I play for a few minutes after studying, and it helps me relax. At one point, I considered giving up because I had practiced the same difficult passage for days without much progress. A friend suggested breaking it into two-bar sections, which was much less frustrating. That change made the practice sessions more manageable. I would like to join a casual music group eventually, although I know I still need plenty of practice."
    rationale: "연습 방법을 바꾼 계기를 배경·행동·결과로 연결한 긴 발화에서 Advanced형 수행이 일부 나타남. 더 넓은 상황에서 이를 지속할 수 있는지는 확인되지 않음."
    upgrade_tip: "녹음 비교와 연습 방식의 조정 관련 후속 질문이나 돌발 조건이 주어져도 시간대와 문단 흐름을 안정적으로 유지하기."
  AL:
    text: "About a year ago, I decided to learn the guitar as a way to unwind after long days at university. I had always enjoyed listening to acoustic music, but I had assumed playing it would come naturally. It did not. When my friend first taught me a few chords, I struggled to change between them without losing the rhythm, and my fingertips were sore for days. I considered giving up until he helped me break one song into smaller sections and practice each transition slowly. I also started recording short clips every weekend so I could hear my progress. Over time, the changes became smoother, and I finally managed to play the entire song for a few friends. I had originally assumed that practicing longer would solve every problem, but the recordings showed that I was repeating the same mistakes. Instead, I began working on one short section at a time and checking the rhythm before increasing the speed. I still have a lot to learn, but I now understand how to practice more efficiently. I still make mistakes, but now I understand that steady practice matters more than trying to sound impressive immediately."
    rationale: "녹음 비교와 연습 방식의 조정을 시간대·상황 제약·의사소통 목적에 맞춰 조직적인 문단 수준으로 전달함. Advanced Low의 주요 기능을 보여주는 합성 예시임."
    upgrade_tip: null

# Q020 질문: You bought a jacket, but it is the wrong size. Call the store, explain the problem, and ask about an exchange or refund.
Q020:
  NL:
    text: "Jacket... too small. Exchange? Please."
    rationale: "재킷 사이즈 불일치에 관한 낱말이나 끊긴 구절을 제시하지만 요청된 말하기 과제를 문장으로 수행하지 못함."
    upgrade_tip: "Hello, I need help with ... 와 같은 간단한 용건 문장을 연습하기."
  NM:
    text: "Hello. I buy jacket. Too small. I want big size. Can I change?"
    rationale: "재킷 사이즈 불일치를 외운 단문 중심으로 표현하지만 정보의 확장이나 질문에 필요한 전개가 부족함."
    upgrade_tip: "예약·구매·위치 등 핵심 정보를 한두 문장으로 정확히 전달하기."
  NH:
    text: "Hello. My jacket is small. I buy yesterday. I have receipt. Do you have large? It is new. Tag is on jacket. I can come tomorrow. Do you have receipt rule? I want change it."
    rationale: "재킷 사이즈 불일치를 짧은 문장으로 전하려 하나 관사·시제·수 일치 또는 문장 완결성에서 흔들림이 있고 연결이 제한됨."
    upgrade_tip: "재킷 사이즈 불일치를 주어와 동사가 있는 완전한 문장으로 표현하고 필요한 시제나 복수형을 맞추기."
  IL:
    text: "Hello, I bought a jacket yesterday. It is too small for me. I have the receipt and the tag. Can I exchange it for a larger size? Is the large size available? I can come tomorrow with the jacket. Please tell me what I need. When can I visit the store?"
    rationale: "재킷 사이즈 불일치의 필수 정보를 자신의 문장으로 말하지만 문장 사이 연결과 구체적 상황 확장이 적음."
    upgrade_tip: "교환·환불 문의에 필요한 정보 두세 개를 순서 있게 연결해 작은 장면으로 설명하기."
  IM1:
    text: "Hello, I bought a medium jacket at your store yesterday, but it is too tight around the shoulders. I have not worn it outside, and I still have the receipt. Could you check whether a large is in stock? If it is, I would like to exchange it this weekend. I bought it as a gift for myself, so I would really like to keep the same color. Please tell me if I need to bring anything else."
    rationale: "교환·환불 문의의 주요 정보를 순서 있게 전달하나 각 설명이 짧고 인과관계나 장면 묘사가 충분히 확장되지 않음."
    upgrade_tip: "교환·환불 문의의 이유나 실제 예시를 한 가지 골라 두세 문장으로 더 말하기."
  IM2:
    text: "Hi, I purchased a jacket at your downtown store on Saturday, but after trying it on at home, I realized the sleeves were too short. I still have the tags attached. Could you tell me whether an exchange is possible, and whether you have the next size up? I would prefer to exchange it rather than get my money back, because I like the design. Could you also confirm whether I need the original card? If that size is unavailable, I would also like to know your refund policy and the deadline for returning it."
    rationale: "교환·환불 문의에 이유·예시·개인 경험을 추가해 발화를 이어감. 일부 문법이나 연결 표현의 안정성은 더 다듬을 수 있음."
    upgrade_tip: "다른 지점의 재고 확인에서 누가 무엇을 했는지 구체화하고 문법·연결어를 정리하기."
  IM3:
    text: "Good afternoon. I am calling about a jacket I bought at your store three days ago. Although I tried it on briefly, I noticed at home that the shoulders are uncomfortably tight. It has not been worn outdoors, and I still have both the receipt and the original tags. Would you mind checking whether the next size is available at your branch? If not, could another branch reserve one for me, or would I need to request a refund? I can bring the receipt and payment card when I visit. If your branch has only a different color in stock, could you tell me whether the online store carries the size I need? I can come in tomorrow afternoon."
    rationale: "교환·환불 문의를 구체적인 세부사항과 함께 비교적 유연하게 설명함. 다만 이 한 답변으로 Advanced 과제 수행의 일관성을 확인할 수는 없음."
    upgrade_tip: "다른 지점의 재고 확인을 단순 소개에서 벗어나 원인·대응·결과까지 이어 서술하기."
  IH:
    text: "Hello, I am calling about an exchange. I purchased a medium jacket on Monday and realized later that it is too small to wear comfortably over a sweater. The jacket is unused, and I have the receipt and all the tags. Could you check whether the large size is available? I understand that your store may not have one, so I would also like to ask whether another branch could hold it for me. If the item is completely sold out, would a refund to my original payment method be possible? I do not want to travel to another branch unless the stock has been confirmed. If a replacement can be held for a day, that would help me plan my visit. Otherwise, I may need to consider a refund rather than spending more time searching. I can visit after work tomorrow, and I would appreciate knowing which documents to bring."
    rationale: "다른 지점의 재고 확인을 배경·행동·결과로 연결한 긴 발화에서 Advanced형 수행이 일부 나타남. 더 넓은 상황에서 이를 지속할 수 있는지는 확인되지 않음."
    upgrade_tip: "구매 증빙과 출국 일정에 맞춘 처리 관련 후속 질문이나 돌발 조건이 주어져도 시간대와 문단 흐름을 안정적으로 유지하기."
  AL:
    text: "Good afternoon. I am hoping you can help me resolve a sizing problem with a jacket I purchased from your store earlier this week. I bought a medium after trying it on quickly, but when I tried it again over a sweater at home, the shoulders felt too tight. It has not been worn outside, and I have kept the receipt and original tags. My preference would be to exchange it for a large. Would you be able to check stock at your branch or arrange a transfer from another location? If neither option is available, could you explain whether the purchase qualifies for a refund and how the money would be returned? I am leaving town on Friday, so it would be helpful to know whether I could complete the exchange by Thursday. The purchase was made with my debit card, so if a refund is necessary, I would like to know how long it normally takes to appear in my account. I also noticed that the larger size is listed on your website, although I cannot tell which store has it. If you can confirm that information, I can choose the most practical option. If the process takes longer, I could arrange for someone to collect the replacement on my behalf."
