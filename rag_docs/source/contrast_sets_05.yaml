    upgrade_tip: "주요 동사의 과거형과 사건의 순서를 명확히 말하기."
  IL:
    text: "Last weekend, I cooked pasta for dinner. I boiled the noodles and made a tomato sauce. I added too much salt. The sauce tasted strange. I put in more tomatoes and some water. It tasted better. My roommate ate it with me."
    rationale: "과거에 있었던 첫 요리 도전과 문제 해결을 독립 문장으로 전달함. 배경·행동·결과의 연결은 단순함."
    upgrade_tip: "처음·중간·끝을 연결하고 왜 그런 행동을 했는지 설명하기."
  IM1:
    text: "I tried to cook pasta for my roommate last Saturday. I followed a recipe on my phone and made a simple tomato sauce. Unfortunately, I added too much salt, so it tasted terrible at first. I mixed in more tomatoes to balance the flavor. The final dish was not perfect, but we finished it and had a good laugh."
    rationale: "익숙한 사건의 시작·진행·결과를 일련의 문장으로 표현하며 기본적인 이유를 제시함."
    upgrade_tip: "문제가 발생한 정확한 순간과 자신의 반응을 묘사하기."
  IM2:
    text: "A few weeks ago, I decided to make pasta instead of ordering food. Everything was going smoothly until I accidentally added twice as much salt as the recipe required. I tasted the sauce and realized something was wrong. Rather than starting over, I added more tomatoes and a little water, then cooked it for several more minutes. The flavor improved enough that my roommate agreed to eat it. I learned to taste food before adding more seasoning."
    rationale: "사건의 원인과 행동, 감정을 추가해 첫 요리 도전과 문제 해결을 좀 더 구체적으로 설명함. 문장 연쇄가 주축임."
    upgrade_tip: "선택한 해결 방법과 선택하지 않은 대안을 구분해 말하기."
  IM3:
    text: "I have been trying to cook more meals at home, and one of my first attempts was homemade pasta. I found a simple recipe and prepared all the ingredients before starting. The noodles turned out well, but I misread the sauce instructions and used far too much salt. When I tasted it, I thought the meal was ruined. I looked up a few suggestions and decided to increase the amount of tomato sauce rather than add more seasoning. It was still slightly salty, but my roommate and I managed to enjoy dinner. Since then, I have been more careful about measuring ingredients."
    rationale: "시간 순서와 세부 상황을 자연스럽게 연결하고 개인적인 평가를 더함. Advanced의 안정적 수행 여부는 미확인임."
    upgrade_tip: "문제가 더 복잡해졌을 때의 대처 과정을 길게 전개하기."
  IH:
    text: "Last semester, I decided to cook dinner for my roommate instead of ordering delivery. I had made pasta a few times before, so I felt fairly confident, but I was distracted while checking a recipe and accidentally added too much salt to the sauce. The first taste was almost impossible to eat. I considered throwing it away, but my roommate suggested adding more tomatoes and letting the sauce simmer. We tried that, adjusted the seasonings, and eventually ended up with a meal that was quite good. The incident was funny afterward, although I was worried at the time because I had invited him to dinner. It taught me that cooking requires attention and that mistakes are sometimes fixable."
    rationale: "서술의 배경과 돌발 상황 및 대응을 문단 형태로 설명함. 이런 수행을 다양한 상황에서 지속하는지는 판단할 수 없음."
    upgrade_tip: "낯선 상황에서도 사건 서술, 시제, 대안 설명을 안정적으로 유지하기."
  AL:
    text: "One of my most memorable cooking attempts happened last semester, when I offered to prepare pasta for my roommate. I had watched a recipe video and assumed the dish would be straightforward, so I was embarrassed when I tasted the sauce and realized I had added far too much salt. At first, I thought I would have to throw everything away and order food instead. My roommate suggested that we try increasing the amount of tomato rather than simply diluting the sauce with water. We discussed the options, added more ingredients in stages, and tasted the sauce after each adjustment. By the time the pasta was ready, the balance had improved considerably, although it still was not restaurant quality. We ended up laughing about the mistake over dinner. Since then, I have started measuring seasonings beforehand and tasting small amounts throughout the cooking process, which has made me much more confident in the kitchen."
    rationale: "상황의 배경, 예상 밖의 변화, 대안과 결과를 응집된 문단으로 서술하고 관련된 시간대를 다룸. Advanced Low 특징을 드러내는 합성 예시임."
