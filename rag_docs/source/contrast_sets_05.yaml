  AL:
    text: "One film that has stayed with me is a science-fiction drama about an astronaut who leaves Earth to search for a possible future for humanity. What initially drew me in was the extraordinary setting, but the story gradually became less about spectacular space travel and more about the cost of leaving people behind. Early in the film, the main character promises his daughter that he will return. Later, circumstances beyond his control cause years to pass while he is away, and the recorded messages he receives make that lost time painfully visible. I was struck by how the film used a complicated scientific idea to explore a very familiar emotion: the fear of missing important moments with family. When I first watched it, I concentrated on the visuals, but after seeing it again, I paid much more attention to the characters decisions. That combination of an imaginative premise and an emotionally convincing story is why I continue to recommend it."
    rationale: "시간대의 변화, 구체적인 묘사, 사건의 맥락 및 결과를 연결된 문단으로 설명하는 Advanced Low 특징을 보여 줌. 실제 공인 등급은 아님."
