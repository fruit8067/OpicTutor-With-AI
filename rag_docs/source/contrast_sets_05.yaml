# Q037 질문: Your city is considering building a new cultural center. Do you support the plan? Explain your opinion and address possible concerns.
Q037:
  NL:
    text: "Culture center. Music. Good. People."
    rationale: "문화센터에 대한 찬성에 관한 낱말이나 끊긴 구절을 제시하지만 요청된 말하기 과제를 문장으로 수행하지 못함."
    upgrade_tip: "I prefer / I support / I think 등을 사용해 입장을 한 문장으로 말하기."
  NM:
    text: "I like culture center. We need music class. It is good for students."
    rationale: "문화센터에 대한 찬성을 외운 단문 중심으로 표현하지만 정보의 확장이나 질문에 필요한 전개가 부족함."
    upgrade_tip: "주장의 이유를 because 문장으로 하나 제시하기."
  NH:
    text: "I want new culture center. Children can learn art. Adults can exercise. But maybe expensive. My grandmother can go. Students learn drawing. But money big. City need plan. I think good."
    rationale: "문화센터에 대한 찬성을 짧은 문장으로 전하려 하나 관사·시제·수 일치 또는 문장 완결성에서 흔들림이 있고 연결이 제한됨."
    upgrade_tip: "문화센터에 대한 찬성을 주어와 동사가 있는 완전한 문장으로 표현하고 필요한 시제나 복수형을 맞추기."
  IL:
    text: "I support a new cultural center. It can offer music and art classes. Families can use it on weekends. Students may have a place to study. I want low class fees. The center should be near the bus stop. It will cost money, but I think it can help people in the neighborhood."
    rationale: "문화센터에 대한 찬성의 필수 정보를 자신의 문장으로 말하지만 문장 사이 연결과 구체적 상황 확장이 적음."
    upgrade_tip: "비용과 접근성의 비교에 필요한 정보 두세 개를 순서 있게 연결해 작은 장면으로 설명하기."
  IM1:
    text: "I think building a cultural center is a good idea because there are not many affordable activities in my area. It could offer art classes, small performances, and rooms for community groups. I would like the city to keep the fees low so that students and older residents can use it. A center could also provide free rooms for clubs that do not have a regular meeting place. It should also be close to public transportation."
    rationale: "비용과 접근성의 비교의 주요 정보를 순서 있게 전달하나 각 설명이 짧고 인과관계나 장면 묘사가 충분히 확장되지 않음."
    upgrade_tip: "비용과 접근성의 비교의 이유나 실제 예시를 한 가지 골라 두세 문장으로 더 말하기."
  IM2:
    text: "I would support a new cultural center if it provided affordable programs for different age groups. For example, children could join art classes while adults could attend evening workshops. It could also give local musicians a small performance space. However, I worry about the construction cost and parking problems. For example, my neighbor travels across town for a weekend painting class. A local program could save her time and encourage more people to participate. I think the city should survey residents first and make sure the building is accessible by bus."
    rationale: "비용과 접근성의 비교에 이유·예시·개인 경험을 추가해 발화를 이어감. 일부 문법이나 연결 표현의 안정성은 더 다듬을 수 있음."
    upgrade_tip: "주민 의견 및 기존 건물 활용에서 누가 무엇을 했는지 구체화하고 문법·연결어를 정리하기."
  IM3:
    text: "In general, I support the proposal to build a cultural center because our neighborhood lacks spaces where people of different ages can meet. A well-planned center could offer inexpensive music lessons, exhibitions, and community workshops. Nevertheless, I would want the city to explain how the center will be funded and maintained. If the fees become too high, the residents who need it most may not benefit. I would also suggest publishing a list of proposed programs before construction begins. If few residents are interested, the city should reconsider the size of the building or share facilities with the library. I also think the city should prioritize public transport access rather than creating a large parking lot."
    rationale: "비용과 접근성의 비교를 구체적인 세부사항과 함께 비교적 유연하게 설명함. 다만 이 한 답변으로 Advanced 과제 수행의 일관성을 확인할 수는 없음."
    upgrade_tip: "주민 의견 및 기존 건물 활용을 단순 소개에서 벗어나 원인·대응·결과까지 이어 서술하기."
  IH:
    text: "I would support a new cultural center, but only if the city involved residents in planning it. My neighborhood has a library and several sports facilities, yet there are few affordable places for performances or creative classes. A cultural center could fill that gap, particularly for teenagers and older adults. At the same time, I understand why some neighbors are concerned about construction noise and public spending. Before approving the project, I would like the city to publish a realistic operating budget, hold public meetings, and reserve space for local groups rather than focusing only on large events. There is an unused public building close to the station that might be cheaper to renovate. I would like the city to compare that option with constructing a completely new center, including long-term maintenance costs. Residents deserve a realistic explanation of both choices. Those conditions would make the investment more useful in the long run."
    rationale: "주민 의견 및 기존 건물 활용을 배경·행동·결과로 연결한 긴 발화에서 Advanced형 수행이 일부 나타남. 더 넓은 상황에서 이를 지속할 수 있는지는 확인되지 않음."
    upgrade_tip: "시범 프로그램과 예산 대안 관련 후속 질문이나 돌발 조건이 주어져도 시간대와 문단 흐름을 안정적으로 유지하기."
  AL:
    text: "I am broadly in favor of building a cultural center, provided that the city treats it as a long-term community service rather than a prestigious construction project. At present, many residents have to travel across town to attend inexpensive art classes or small performances, so a local facility could make cultural activities more accessible. However, I share concerns about the initial cost, ongoing maintenance, and the possibility that a large new building could remain underused. I would therefore recommend starting with a public consultation and publishing a clear operating plan that explains who will use the facility, how programs will be funded, and what fees residents would pay. If the budget proves too restrictive, the city could renovate an existing building and expand it gradually instead. I would also prioritize public transportation access and spaces that local organizations can reserve. My priority would be flexible rooms that different age groups can use throughout the week, rather than a large auditorium that sits empty most days. The city could begin with a few pilot classes in an existing public building and use attendance data to decide whether expansion is justified. That approach would reduce financial risk while still meeting residents’ immediate needs. With those safeguards, the project could become a genuine community resource rather than an expensive symbol."
    rationale: "시범 프로그램과 예산 대안을 시간대·상황 제약·의사소통 목적에 맞춰 조직적인 문단 수준으로 전달함. Advanced Low의 주요 기능을 보여주는 합성 예시임."
    upgrade_tip: null
