    text: "One book I enjoyed recently was a mystery novel about a girl who finds an old letter in her family home. She becomes curious and asks her neighbor for help. Together, they look for clues and discover a secret from many years ago. I liked the book because every chapter made me want to read the next one. My friend had recommended it, and I finished it over one weekend. I would recommend it to people who like surprising endings."
    rationale: "줄거리, 독서 경험, 추천 이유를 여러 문장으로 연결하지만 긴 장면 묘사는 아직 부족함."
