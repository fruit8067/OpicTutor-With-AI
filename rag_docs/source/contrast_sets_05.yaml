  IM2:
    text: "A book I really enjoyed was a mystery story about a teenager who discovers a letter hidden in an old desk. At first, she thinks it is just a family note, but it contains a name she has never heard before. She asks a neighbor and starts looking for clues around her town. I especially liked the part where she realizes that someone has been keeping the truth from her. I read the book on my commute, and sometimes I almost missed my stop because I wanted to know what happened next. The ending surprised me without feeling unrealistic."
    rationale: "책 속 사건과 자신의 반응을 예시로 연결하여 친숙한 주제를 확장함. 설명은 주로 문장 연쇄로 이루어짐."
    upgrade_tip: "사건의 배경과 전환점을 한 문단의 흐름으로 더 상세히 서술하기."
  IM3:
    text: "I recently read a mystery novel that follows a teenager who finds an old letter inside a desk her family has kept for decades. The letter mentions a person nobody in the family ever talks about, so she starts investigating. She first asks a neighbor, then checks old photographs and newspaper records, and eventually discovers why the subject had been avoided. My favorite part was the moment she realized that the person she suspected was actually trying to protect someone else. I had expected a typical detective story, but the book was really about family trust. I finished it in two days because the clues were introduced gradually and each one changed my expectations."
    rationale: "줄거리의 단서·반전과 독서 중 기대 변화를 연결해 설명하지만 사건의 대처·배경 확장은 제한적임."
    upgrade_tip: "작품 속 갈등의 원인과 해결을 더 긴 서술로 전개해 보기."
  IH:
    text: "One of the best books I have read recently is a mystery novel about a girl who discovers an old letter in her family home. The letter contains a name that her relatives refuse to explain, which leads her to investigate the past. At first, she assumes someone must have done something terrible, but as she interviews a neighbor and studies old photographs, the clues point in a different direction. The most memorable scene is when she realizes that the person she suspected had actually tried to protect her family. I liked the way the author gradually changed my view of the characters. I had started the book on a quiet weekend, expecting a simple mystery, and ended up reading late into the night. It reminded me that a story can be exciting without depending on action scenes, and I have recommended it to two friends since then."
    rationale: "이야기의 배경·오해·반전을 비교적 긴 서술로 연결하며 과거 독서 경험과 현재 평가를 표현함. 고급 수행의 지속성은 확인이 필요함."
    upgrade_tip: "더 복잡한 사건이나 후속 질문에서도 인물의 동기와 결과를 문단으로 안정적으로 설명하기."
  AL:
    text: "A novel that genuinely surprised me was a mystery about a teenager who finds an old letter while helping her family clear out a storage room. The letter refers to someone whose name has apparently been avoided for years, so she begins asking questions. At first, her relatives discourage her from looking into it, and she assumes they are hiding something shameful. As she talks to a former neighbor and searches through photographs and newspaper archives, however, she discovers that the person she suspected had actually protected the family during a difficult period. The turning point comes when she confronts an older relative and finally hears the full story. I appreciated that the author did not reveal everything through a convenient confession; the clues gradually changed both the heroine's assumptions and mine. When I started the book, I expected a straightforward puzzle, but by the end I was thinking more about how families remember the past. I lent it to a friend afterward, and we ended up discussing whether the main character had been right to keep investigating. For me, that conversation was a sign of how much the story had stayed with us."
    rationale: "시간 순서에 따른 사건 서술과 인물의 동기·반전·결과를 세부적으로 연결하고 독서 경험의 변화를 문단으로 전달함."
    upgrade_tip: null

