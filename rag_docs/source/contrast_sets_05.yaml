  IM3:
    text: "One of the most exciting sports events I have attended was a basketball game last winter. My friends and I arrived early enough to watch the players warm up, and the atmosphere was already lively. Our team fell behind in the first half, but they gradually recovered after halftime. The turning point came when a substitute player made two important defensive plays in a row. With seconds remaining, our team scored the winning basket. I had watched close games on television before, but hearing the crowd react together made the experience completely different."
    rationale: "시간 순서와 세부 상황을 자연스럽게 연결하고 개인적인 평가를 더함. Advanced의 안정적 수행 여부는 미확인임."
    upgrade_tip: "문제가 더 복잡해졌을 때의 대처 과정을 길게 전개하기."
  IH:
    text: "Last winter, I watched a professional basketball game with two friends. We expected a fairly easy win for our team, but they played poorly in the first half and were losing by double digits. I remember the crowd getting restless while the coach called a timeout. After the break, the players defended much more aggressively and began to reduce the gap. With only a few seconds remaining, our guard made a shot from near the three-point line, and the stadium erupted. I almost missed the moment because I had been looking at the scoreboard. The game reminded me why I enjoy watching sports in person: the uncertainty and shared excitement are difficult to reproduce on a screen."
    rationale: "서술의 배경과 돌발 상황 및 대응을 문단 형태로 설명함. 이런 수행을 다양한 상황에서 지속하는지는 판단할 수 없음."
    upgrade_tip: "낯선 상황에서도 사건 서술, 시제, 대안 설명을 안정적으로 유지하기."
  AL:
    text: "A basketball game I attended last winter stands out because it completely overturned my expectations. My friends and I had bought tickets weeks in advance, assuming our team would have a comfortable victory. Instead, the players struggled in the first half, and by halftime the atmosphere had become tense. During the third quarter, the coach changed the defensive strategy, which forced several turnovers and gave the team a chance to recover. The score remained close until the final possession, when a guard made a difficult shot just before the buzzer. For a moment, everyone seemed to hold their breath, and then the whole arena erupted. We had planned to leave quickly to avoid traffic, but we stayed to watch the players celebrate and eventually took a later train home. Since then, I have tried to attend at least one game each season, because even a disappointing match can turn into an unforgettable experience."
    rationale: "상황의 배경, 예상 밖의 변화, 대안과 결과를 응집된 문단으로 서술하고 관련된 시간대를 다룸. Advanced Low 특징을 드러내는 합성 예시임."
    upgrade_tip: null

# Q033 질문: Do you enjoy taking photographs? Describe what you usually photograph and one picture you remember.
# 한국어: 사진 찍는 습관과 특별히 기억나는 사진 한 장을 설명하시오.
Q033:
  NL:
    text: "Photos. Phone. Sunset. Nice."
    rationale: "주제의 핵심 단어만 제시해 사진 촬영 습관과 기억나는 사진을 암시함. 독립적인 설명은 거의 없음."
    upgrade_tip: "친숙한 대상의 이름과 특징을 I use / It is 등의 한 문장으로 말하기."
  NM:
    text: "I take pictures. I like sunset. My phone camera is good. I take many photos."
    rationale: "외운 듯한 짧은 표현으로 사진 촬영 습관과 기억나는 사진의 일부만 전달함. 설명의 구체성이 낮음."
    upgrade_tip: "언제·어디서·무엇을 하는지 서로 다른 짧은 문장으로 추가하기."
  NH:
    text: "I take pictures with phone. I like sky and street. Last week I take sunset picture. It is beautiful. I send friend."
    rationale: "익숙한 단문을 조합하여 사진 촬영 습관과 기억나는 사진을 말하려 하지만 문장의 완결성과 확장이 제한됨."
    upgrade_tip: "단어 나열을 줄이고 주어와 동사가 있는 문장으로 묘사하기."
  IL:
    text: "I often take pictures with my phone. I usually photograph the sky and buildings. Last week, I saw a colorful sunset near campus. I stopped and took a photo. I sent it to my friend. I like the photo because the colors are bright."
    rationale: "친숙한 사진 촬영 습관과 기억나는 사진에 관한 정보를 스스로 만든 독립 문장으로 설명함. 문장 간 조직은 아직 단순함."
    upgrade_tip: "첫 번째 특징에서 다음 특징으로 넘어가는 연결어와 이유를 사용하기."
  IM1:
    text: "I enjoy taking photos when I walk around the city. I mostly take pictures of streets, cafés, and sunsets. One evening, I noticed the sky turning orange behind the university buildings. I took several pictures and chose the clearest one. Whenever I see it, I remember how peaceful that evening felt."
    rationale: "위치·특징·이유 등 정보를 여러 문장으로 연결하여 사진 촬영 습관과 기억나는 사진을 설명함. 구체적 장면은 제한적임."
    upgrade_tip: "실제로 사용하거나 경험한 장면을 한 가지 구체적으로 덧붙이기."
  IM2:
    text: "I usually take photographs with my phone rather than a special camera. I like capturing ordinary scenes, such as quiet streets after rain or sunlight on buildings. A photo I particularly remember shows a sunset behind my campus. I had been studying all afternoon and stepped outside for a short break when I noticed the colors. I took the picture without planning it, and it still reminds me to look around instead of rushing everywhere."
    rationale: "특징과 활용 예시, 장단점 등을 연결해 사진 촬영 습관과 기억나는 사진에 개인적 의미를 부여함. 주로 문장 연쇄 중심임."
    upgrade_tip: "장점과 단점 또는 다른 선택지와의 차이를 한 사례로 보여주기."
  IM3:
    text: "Photography is a small habit that helps me notice details in everyday life. I tend to photograph city streets, changing light, and unexpected scenes rather than posed portraits. One picture I am especially fond of was taken after a long afternoon of studying. The sun was setting behind the buildings, and the windows reflected orange light onto the street. I stayed for a few minutes to find an angle without too many cars. The photo itself is simple, but it reminds me of a moment when I stopped worrying about my assignments and enjoyed the evening."
    rationale: "익숙한 사진 촬영 습관과 기억나는 사진을 보다 자신 있게 묘사하고 세부 상황을 덧붙임. 이 문항만으로 Advanced의 지속성을 판단할 수 없음."
    upgrade_tip: "이전 경험과 지금의 모습, 예상 밖의 상황을 하나의 이야기로 확장하기."
  IH:
    text: "I started taking photos more often after moving to a new neighborhood. At first, I photographed landmarks so I could remember places, but I gradually became interested in ordinary scenes that most people walk past. One of my favorite pictures was taken near campus after a difficult exam. I had been frustrated all day, and when I stepped outside, I noticed the sun setting behind a row of buildings. I waited until the light reached the windows and took a few shots. The picture is not technically perfect, but I kept it because it reminds me how much a small change of scenery improved my mood. I still use my phone, although I have been learning how to adjust exposure more carefully."
    rationale: "현재의 설명에 과거 경험 또는 복잡해진 상황을 더하여 긴 발화를 시도함. 다른 과제에서의 안정성은 별도 검증이 필요함."
    upgrade_tip: "다른 친숙하지 않은 주제에서도 같은 문단 구성과 시간대 서술을 유지하기."
  AL:
    text: "I enjoy taking photographs because they help me pay attention to moments I might otherwise overlook. When I first moved near campus, I mainly used my phone to document unfamiliar streets and places I wanted to revisit. Over time, however, I became more interested in the light and atmosphere of ordinary scenes. One photograph I particularly treasure shows the sunset reflected in the windows of a building near the university. I had just finished a difficult exam and was heading home when I noticed the unusual colors. Instead of taking a quick picture while walking, I stopped, moved to a quieter corner, and waited for the light to change. Several people passed in front of the camera, so I tried a different angle and eventually captured the scene I wanted. Whenever I look at the photograph now, I remember not only the sunset but also the feeling of relief after that exam. That is why I prefer personal photographs to technically perfect ones."
    rationale: "시간대의 변화, 구체적인 묘사, 사건의 맥락 및 결과를 연결된 문단으로 설명하는 Advanced Low 특징을 보여 줌. 실제 공인 등급은 아님."
    upgrade_tip: null

# Q034 질문: Describe a problem you had while working on a group project. How did your team resolve it?
# 한국어: 조별 과제에서 생긴 문제와 팀원들과 해결한 과정을 설명하시오.
Q034:
  NL:
    text: "Project. Team. Late. Meeting."
    rationale: "사건에 관련된 단어만 나열하여 조별 과제 역할 분담 갈등을 단편적으로 암시함."
    upgrade_tip: "I went / I lost / I tried처럼 사건을 한 문장으로 완성하기."
  NM:
    text: "We do a project. It is hard. One friend is late. We talk. We finish."
    rationale: "짧은 정형 표현을 이어 조별 과제 역할 분담 갈등을 언급하지만 사건 순서와 배경을 충분히 말하지 못함."
    upgrade_tip: "언제·어디서·누구와 있었는지를 익숙한 과거 표현으로 추가하기."
  NH:
    text: "Last semester team project. One member not finish work. We have meeting. I do more work. We submit on time."
    rationale: "짧은 문장으로 사건을 전달하려 하나 시제나 인과관계 표현이 제한적임."
    upgrade_tip: "주요 동사의 과거형과 사건의 순서를 명확히 말하기."
  IL:
    text: "Last semester, I worked on a group presentation. One teammate did not finish his part on time. We were worried. I called a group meeting. We divided the remaining slides among us. We finished the presentation before the deadline."
    rationale: "과거에 있었던 조별 과제 역할 분담 갈등을 독립 문장으로 전달함. 배경·행동·결과의 연결은 단순함."
    upgrade_tip: "처음·중간·끝을 연결하고 왜 그런 행동을 했는지 설명하기."
  IM1:
    text: "In a group assignment last semester, one member fell behind on his part of the presentation. Our deadline was only two days away, so everyone was stressed. We had a short meeting and asked what he needed help with. Then we divided the unfinished slides into smaller tasks. We managed to submit the presentation on time."
    rationale: "익숙한 사건의 시작·진행·결과를 일련의 문장으로 표현하며 기본적인 이유를 제시함."
    upgrade_tip: "문제가 발생한 정확한 순간과 자신의 반응을 묘사하기."
  IM2:
    text: "I had a problem during a group project when one teammate could not finish his section by the agreed date. At first, we assumed he was not taking the work seriously, but during our meeting he explained that he was having trouble with the data analysis. We decided to pair him with another member and adjust the task list. I took responsibility for checking the final slides. We finished on time, and the experience taught me not to jump to conclusions."
    rationale: "사건의 원인과 행동, 감정을 추가해 조별 과제 역할 분담 갈등을 좀 더 구체적으로 설명함. 문장 연쇄가 주축임."
    upgrade_tip: "선택한 해결 방법과 선택하지 않은 대안을 구분해 말하기."
  IM3:
    text: "One group project became stressful because our tasks were not clearly divided at the beginning. Two people prepared similar slides while an important analysis was left unfinished. We discovered the mistake during our final meeting, only two days before the presentation. Instead of arguing about whose fault it was, we listed what still needed to be done and assigned one person to each task. I volunteered to combine the slides and check that they followed the same format. We submitted everything on time, but afterward we agreed that a shared checklist would have prevented the confusion."
    rationale: "시간 순서와 세부 상황을 자연스럽게 연결하고 개인적인 평가를 더함. Advanced의 안정적 수행 여부는 미확인임."
    upgrade_tip: "문제가 더 복잡해졌을 때의 대처 과정을 길게 전개하기."
  IH:
    text: "During a group presentation last semester, we discovered that two teammates had been working on almost identical material while nobody had completed the results section. The deadline was approaching, and the atmosphere became tense because people thought others were avoiding work. I suggested that we stop discussing blame and first identify which tasks were still missing. We set up a shared document, redistributed the work, and agreed on a short check-in that evening. I combined the final slides and made sure the sections connected logically. The presentation went well, but the experience showed me how easily unclear responsibilities can create conflict even among hardworking people."
    rationale: "서술의 배경과 돌발 상황 및 대응을 문단 형태로 설명함. 이런 수행을 다양한 상황에서 지속하는지는 판단할 수 없음."
    upgrade_tip: "낯선 상황에서도 사건 서술, 시제, 대안 설명을 안정적으로 유지하기."
  AL:
    text: "Last semester, I worked on a group presentation that nearly missed its deadline because we had not defined responsibilities clearly enough. Two teammates prepared overlapping background slides, while the section explaining our findings had barely been started. When we discovered the problem two days before the presentation, several members became frustrated, and the discussion began to focus on who was responsible. I suggested that we first list every unfinished task and estimate how long each one would take. We then reassigned responsibilities according to each person’s strengths, set a shared deadline for drafts, and scheduled a final review meeting. I took charge of integrating the slides and checking that our explanations followed a consistent argument. We finished on time and received positive feedback, although the last two days were unnecessarily stressful. For our next project, we created a task board and agreed to flag delays early, which helped us avoid the same problem."
    rationale: "상황의 배경, 예상 밖의 변화, 대안과 결과를 응집된 문단으로 서술하고 관련된 시간대를 다룸. Advanced Low 특징을 드러내는 합성 예시임."
    upgrade_tip: null

# Q035 질문: There is a water leak in your apartment. Call the property manager, explain the situation, and request assistance.
# 한국어: 집에 누수가 발생했다. 관리인에게 문제를 설명하고 긴급 조치를 요청하시오.
Q035:
  NL:
    text: "Water... ceiling. Leak. Help. Now."
    rationale: "필수 단어와 짧은 요청만 제시하여 집 누수 신고와 수리 조율의 목적을 충분히 전달하지 못함."
    upgrade_tip: "Hello, I need help with ... 와 같은 간단한 용건 문장을 연습하기."
  NM:
    text: "Hello. Water in my room. It is bad. Please help. Come now."
    rationale: "암기한 요청 표현을 통해 집 누수 신고와 수리 조율의 기본 의도를 알리지만 구체적 정보가 부족함."
    upgrade_tip: "예약·구매·위치 등 핵심 정보를 한두 문장으로 정확히 전달하기."
  NH:
    text: "Hello. My ceiling has water. Floor wet. I live room five. Can you send repair person? Please call me."
    rationale: "짧은 문장과 정형 질문으로 상황과 요구를 부분적으로 전달함."
    upgrade_tip: "완전한 질문 문장으로 원하는 조치를 요청하기."
  IL:
    text: "Hello, I live in apartment 504. Water is dripping from the bathroom ceiling. The floor is wet. Can you send someone to check it today? I put a bucket under the leak. Please tell me when the repair person can come."
    rationale: "필요한 정보와 기본 질문을 독립적인 문장으로 전달해 집 누수 신고와 수리 조율에 대응함."
    upgrade_tip: "문제의 원인과 원하는 결과를 순서대로 설명하기."
  IM1:
    text: "Hello, I am calling from apartment 504. There is water leaking from the bathroom ceiling, and it started about an hour ago. I placed a bucket underneath, but the floor is getting wet. Could someone come to inspect it as soon as possible? Please let me know whether I should shut off the water while I wait."
    rationale: "상황을 간단히 설명하고 1~2개의 구체적 요청을 연결된 문장으로 전달함."
    upgrade_tip: "상대에게 확인할 조건(시간·비용·가능 여부)을 구체적으로 질문하기."
  IM2:
    text: "Good morning. I live in apartment 504, and I need to report a leak in the bathroom ceiling. It began dripping about an hour ago, and the water is spreading across the floor. I have moved my belongings away and placed towels nearby. Could you arrange an urgent inspection and tell me when maintenance can arrive? I am also concerned that the water may reach the hallway, so please advise me on any immediate precautions."
    rationale: "원인·조건·희망사항을 제시하며 질문과 대안을 추가함. 주로 예측 가능한 상황에서의 문장 연쇄임."
    upgrade_tip: "첫 해결책이 불가능한 경우를 가정해 두 번째 대안을 제시하기."
  IM3:
    text: "Hello, this is the tenant in apartment 504. I noticed water dripping from the bathroom ceiling this morning, and the leak has become stronger over the past hour. I have put a container under it and moved nearby belongings, but the floor is still getting wet. Would it be possible to send a maintenance worker today? If someone cannot arrive soon, could you tell me whom to contact for emergency assistance and whether I should turn off the water supply? I can stay home until the inspection is finished."
    rationale: "실용적인 질문과 대안을 자연스럽게 연결하고 추가 조건까지 언급함. 한 문항만으로 Advanced 수행 지속성은 미확인임."
    upgrade_tip: "추가 제약, 상대의 응답, 다음 단계를 자연스럽게 연결하기."
  IH:
    text: "Hello, I am calling from apartment 504 about a water leak that appears to be getting worse. It started as a few drops from the bathroom ceiling this morning, but there is now enough water to cover part of the floor. I have moved my belongings, put down towels, and kept the area clear. I am worried because the leak is near a light fixture, so I have avoided touching the switch in that area. Could you arrange for someone to inspect it urgently? If your regular maintenance team is unavailable, is there an emergency contractor you can contact? Please tell me what I should do safely while I wait and whether someone can check the apartment above mine."
    rationale: "예기치 않은 제약을 고려해 대안을 제시하고 상대방의 조치를 요청하는 긴 발화를 수행함. 일관성은 별도 확인이 필요함."
    upgrade_tip: "예상치 못한 거절이나 새 제약에도 구체적 해결책을 지속적으로 설명하기."
  AL:
    text: "Hello, I am a tenant in apartment 504, and I need urgent assistance with a leak in the bathroom ceiling. I first noticed a few drops this morning, but the flow has increased steadily, and water is now spreading across the floor. I have moved everything away from the affected area, placed containers underneath, and avoided the nearby electrical fixtures because I am concerned about safety. Could you arrange an urgent inspection and give me an estimated arrival time? If the building’s maintenance team cannot come soon, I would appreciate the contact details for an emergency contractor. I also need to know whether the water supply should be isolated by a qualified person and whether the upstairs apartment needs to be inspected. I can remain at home to provide access, but if repairs cannot begin today, please explain how the building will prevent further damage and when I can expect an update."
    rationale: "문제를 명료하게 설명하고 제약·우선순위·여러 가능한 대안·후속 조치를 유기적으로 연결함. Advanced Low 특징을 보이도록 만든 합성 대화 발화임."
    upgrade_tip: null

# Q036 질문: A visitor asks how to get from the subway station to the city museum. Give directions and explain an alternative if a street is closed.
# 한국어: 지하철역에서 시립박물관까지 길을 안내하고 도로가 막혔을 때의 대안도 설명하시오.
Q036:
  NL:
    text: "Museum... left. Bus. There."
    rationale: "필수 단어와 짧은 요청만 제시하여 박물관 길 안내와 우회로 설명의 목적을 충분히 전달하지 못함."
    upgrade_tip: "Hello, I need help with ... 와 같은 간단한 용건 문장을 연습하기."
  NM:
    text: "Go straight. Turn left. Museum there. Okay?"
    rationale: "암기한 요청 표현을 통해 박물관 길 안내와 우회로 설명의 기본 의도를 알리지만 구체적 정보가 부족함."
    upgrade_tip: "예약·구매·위치 등 핵심 정보를 한두 문장으로 정확히 전달하기."
  NH:
    text: "Go outside station. Walk straight. Turn right at bank. Museum near park. Maybe bus."
    rationale: "짧은 문장과 정형 질문으로 상황과 요구를 부분적으로 전달함."
    upgrade_tip: "완전한 질문 문장으로 원하는 조치를 요청하기."
  IL:
    text: "Take exit two from the station. Walk straight for five minutes. Turn right at the bank. The museum is next to a small park. If the road is closed, walk around the block. There are signs near the crossing."
    rationale: "필요한 정보와 기본 질문을 독립적인 문장으로 전달해 박물관 길 안내와 우회로 설명에 대응함."
    upgrade_tip: "문제의 원인과 원하는 결과를 순서대로 설명하기."
  IM1:
    text: "From the subway station, use exit two and walk straight until you see a bank. Turn right there, and the city museum will be on your left beside the park. It takes about ten minutes. If the main street is closed, you can use the next crossing and walk along the park instead. Do you need me to show you the route on a map?"
    rationale: "상황을 간단히 설명하고 1~2개의 구체적 요청을 연결된 문장으로 전달함."
    upgrade_tip: "상대에게 확인할 조건(시간·비용·가능 여부)을 구체적으로 질문하기."
  IM2:
    text: "The easiest way to reach the city museum is to leave the subway through exit two and continue straight for about five minutes. When you reach the bank, turn right and follow the road until you see the park. The museum entrance is across from the playground. If construction blocks that street, you can keep walking to the next intersection and turn right there instead. It is slightly longer, but the path is well signposted."
    rationale: "원인·조건·희망사항을 제시하며 질문과 대안을 추가함. 주로 예측 가능한 상황에서의 문장 연쇄임."
    upgrade_tip: "첫 해결책이 불가능한 경우를 가정해 두 번째 대안을 제시하기."
  IM3:
    text: "If you are coming from the station, I would recommend exit two because it has an escalator and leads directly toward the museum. Walk straight past the bank and turn right at the next set of lights. You will see a small park on your left, and the museum is immediately beyond it. The walk normally takes around ten minutes. There has been construction on the main street recently, though, so if that section is closed, continue to the following intersection and follow the signs along the park. The detour adds only a few minutes."
    rationale: "실용적인 질문과 대안을 자연스럽게 연결하고 추가 조건까지 언급함. 한 문항만으로 Advanced 수행 지속성은 미확인임."
    upgrade_tip: "추가 제약, 상대의 응답, 다음 단계를 자연스럽게 연결하기."
  IH:
    text: "The museum is about a ten-minute walk from this station. I would normally suggest using exit two, walking straight to the bank, and turning right toward the park. The museum is just past the playground. However, part of that street was closed for construction earlier this week, so I would check the signs before turning. If it is still blocked, continue to the next intersection and approach from the opposite side of the park. That route is a little longer but does not involve crossing any restricted area. If you have luggage or difficulty walking, there is also a bus from the station that stops close to the museum entrance."
    rationale: "예기치 않은 제약을 고려해 대안을 제시하고 상대방의 조치를 요청하는 긴 발화를 수행함. 일관성은 별도 확인이 필요함."
    upgrade_tip: "예상치 못한 거절이나 새 제약에도 구체적 해결책을 지속적으로 설명하기."
  AL:
    text: "The city museum is normally about ten minutes away on foot. From the subway, take exit two, continue straight until you reach the bank, and turn right toward the park. You should see the museum entrance just beyond the playground. I should mention that construction has recently affected the main road, so the usual route may be blocked. If you encounter a barrier, do not try to pass through the work area; continue to the next signalized intersection, turn toward the park, and follow the pedestrian signs around its eastern side. The detour adds roughly five minutes. If you would prefer to avoid walking, you can also take a local bus from the stop outside the station, although you should check the current service information before boarding. Are you planning to visit the main exhibition or a special event? I can help you identify the most convenient entrance."
    rationale: "문제를 명료하게 설명하고 제약·우선순위·여러 가능한 대안·후속 조치를 유기적으로 연결함. Advanced Low 특징을 보이도록 만든 합성 대화 발화임."
    upgrade_tip: null

# Q037 질문: Your city is considering building a new cultural center. Do you support the plan? Explain your opinion and address possible concerns.
# 한국어: 시에서 새로운 문화센터 건립을 추진한다. 찬반 의견과 예상되는 문제, 개선 방안을 설명하시오.
Q037:
  NL:
    text: "Culture center. Music. Good. People."
    rationale: "주제와 관련된 단어만 말하며 새 문화센터 건립에 대한 의견과 조건에 대한 주장을 완성하지 못함."
    upgrade_tip: "I prefer / I support / I think 등을 사용해 입장을 한 문장으로 말하기."
  NM:
    text: "I like culture center. We need music class. It is good for students."
    rationale: "익숙한 찬반 표현은 제시하지만 주장을 뒷받침할 내용이 부족함."
    upgrade_tip: "주장의 이유를 because 문장으로 하나 제시하기."
  NH:
    text: "I want new culture center. Children can learn art. Adults can exercise. But maybe expensive. I think good."
    rationale: "기본적인 선호와 짧은 이유를 제시하나 표현 범위가 좁음."
    upgrade_tip: "반대되는 선택지와의 차이를 간단히 덧붙이기."
  IL:
    text: "I support a new cultural center. It can offer music and art classes. Families can use it on weekends. Students may have a place to study. It will cost money, but I think it can help people in the neighborhood."
    rationale: "새 문화센터 건립에 대한 의견과 조건에 대한 의견과 이유를 독립 문장으로 설명함."
    upgrade_tip: "자신의 생각을 뒷받침할 실제 사례를 한 가지 말하기."
  IM1:
    text: "I think building a cultural center is a good idea because there are not many affordable activities in my area. It could offer art classes, small performances, and rooms for community groups. I would like the city to keep the fees low so that students and older residents can use it. It should also be close to public transportation."
    rationale: "명확한 선호나 주장을 제시하고 이유 또는 사례를 여러 문장으로 연결함."
    upgrade_tip: "장점뿐 아니라 불편하거나 걱정되는 부분을 덧붙이기."
  IM2:
    text: "I would support a new cultural center if it provided affordable programs for different age groups. For example, children could join art classes while adults could attend evening workshops. It could also give local musicians a small performance space. However, I worry about the construction cost and parking problems. I think the city should survey residents first and make sure the building is accessible by bus."
    rationale: "의견을 구체적인 경험과 장단점에 연결함. 익숙한 내용의 문장 연쇄가 중심임."
    upgrade_tip: "입장이 성립하는 조건과 구체적인 선택 기준을 설명하기."
  IM3:
    text: "In general, I support the proposal to build a cultural center because our neighborhood lacks spaces where people of different ages can meet. A well-planned center could offer inexpensive music lessons, exhibitions, and community workshops. Nevertheless, I would want the city to explain how the center will be funded and maintained. If the fees become too high, the residents who need it most may not benefit. I also think the city should prioritize public transport access rather than creating a large parking lot."
    rationale: "자신의 입장을 조직적으로 밝히고 반대 측면이나 조건까지 고려함. 단일 답변만으로 상위 등급을 단정할 수 없음."
    upgrade_tip: "실제 발생할 수 있는 문제에 대한 대응책을 제안하기."
  IH:
    text: "I would support a new cultural center, but only if the city involved residents in planning it. My neighborhood has a library and several sports facilities, yet there are few affordable places for performances or creative classes. A cultural center could fill that gap, particularly for teenagers and older adults. At the same time, I understand why some neighbors are concerned about construction noise and public spending. Before approving the project, I would like the city to publish a realistic operating budget, hold public meetings, and reserve space for local groups rather than focusing only on large events. Those conditions would make the investment more useful in the long run."
    rationale: "개인적인 경험과 우려를 연결하며 더 긴 의견 설명을 시도함. 추상적인 논증까지 요구하지 않으며 일관성은 별도 검증 대상임."
    upgrade_tip: "낯선 후속 질문에서도 근거, 현실적 제약, 대안을 일관되게 제시하기."
  AL:
    text: "I am broadly in favor of building a cultural center, provided that the city treats it as a long-term community service rather than a prestigious construction project. At present, many residents have to travel across town to attend inexpensive art classes or small performances, so a local facility could make cultural activities more accessible. However, I share concerns about the initial cost, ongoing maintenance, and the possibility that a large new building could remain underused. I would therefore recommend starting with a public consultation and publishing a clear operating plan that explains who will use the facility, how programs will be funded, and what fees residents would pay. If the budget proves too restrictive, the city could renovate an existing building and expand it gradually instead. I would also prioritize public transportation access and spaces that local organizations can reserve. With those safeguards, the project could become a genuine community resource rather than an expensive symbol."
    rationale: "의견의 근거와 예상되는 현실적 문제, 조건부 대안 및 실행 가능성을 문단 수준으로 설명함. Advanced Low 특성을 보여주는 합성 예시임."
    upgrade_tip: null

