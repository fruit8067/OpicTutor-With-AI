    text: "One of my closest friendships began rather unexpectedly during my first semester at university. I was new to the campus and felt uncomfortable approaching people, so I was grateful when a student in my class invited me to join his project group. We initially talked only about assignments, but while preparing for a presentation, we discovered that we shared an interest in basketball. A few weeks later, I was struggling with an exam topic and he offered to review the material with me, even though he had his own work to finish. That small gesture made a strong impression on me. After the exam, I invited him to a weekend game, and our friendship gradually developed beyond university. Although our schedules are much busier now, we still try to meet regularly and support each other when problems come up. Looking back, it was not a dramatic event that made us friends, but the fact that we consistently made time to help one another."
    rationale: "상황의 배경, 예상 밖의 변화, 대안과 결과를 응집된 문단으로 서술하고 관련된 시간대를 다룸. Advanced Low 특징을 드러내는 합성 예시임."
    upgrade_tip: null

# Q029 질문: How has the way you communicate with family and friends changed since you were younger?
# 한국어: 어릴 때와 지금의 가족·친구 소통 방식이 어떻게 달라졌는지 비교하시오.
Q029:
  NL:
    text: "Before... phone. Now messages. Video."
    rationale: "과거와 현재를 단어로만 암시하여 과거와 현재의 소통 방식의 변화를 설명하지 못함."
    upgrade_tip: "Before와 now를 사용한 두 문장을 먼저 만들기."
  NM:
    text: "I call my friends. I use messages now. It is easy. I like it."
    rationale: "주로 암기한 표현을 반복하고 두 시기의 구별이 부족함."
    upgrade_tip: "과거·현재의 대표적인 차이를 한 가지 더 말하기."
  NH:
    text: "When I was kid I call friends. Now I send message. My parents use video call. It is fast and good."
    rationale: "전후 차이를 짧은 문장으로 제시하지만 시제와 맥락의 연결이 제한됨."
    upgrade_tip: "시제와 시간 표현을 구분하여 문장을 완성하기."
  IL:
    text: "When I was younger, I often called my friends on the phone. I also met them after school. Now I usually send messages. Sometimes I make video calls with my family. Messages are convenient because people can answer later. I still prefer calling for important news."
    rationale: "과거와 현재의 소통 방식을 과거와 현재의 독립 문장으로 구분하여 전달함."
    upgrade_tip: "변화의 원인을 because와 so로 연결하기."
  IM1:
    text: "When I was in middle school, I usually called friends to make plans. We often talked for a long time after dinner. These days, I send short messages throughout the day. I also use group chats when several friends are planning something. However, if I need to discuss a personal problem, I still prefer a phone call."
    rationale: "두 시기의 상황을 일련의 문장으로 비교하고 간단한 선호나 이유를 덧붙임."
    upgrade_tip: "하나의 실제 경험을 예로 들어 변화가 미친 영향을 보여주기."
  IM2:
    text: "The biggest difference is that I used to have longer phone conversations, but now most communication happens through messages. When I was younger, I would call a friend after school to ask about homework. Today, our class group chat is much faster for sharing information. On the other hand, messages sometimes cause misunderstandings because people cannot hear your tone. For that reason, I usually call when a topic is sensitive."
    rationale: "비교의 구체적 사례와 장단점을 연결해 설명하나 대부분 익숙한 범위의 문장 연쇄임."
    upgrade_tip: "장점과 단점을 대비해 설명하기."
  IM3:
    text: "The way I keep in touch with people has changed a lot since I was younger. In middle school, I often phoned friends in the evening or simply arranged to meet them the next day. Now most conversations happen in group chats, where we share photos, announcements, and short updates. This is convenient when everyone has different schedules, but I sometimes feel that we exchange more messages without having deeper conversations. Whenever something important happens, I try to call rather than rely on a few lines of text."
    rationale: "과거와 현재를 보다 조직적으로 비교하고 생활에 미친 영향을 설명함. Advanced의 지속성은 판단 불가."
    upgrade_tip: "변화의 계기와 이를 경험한 특정 사건을 상세히 전개하기."
  IH:
    text: "When I was younger, contacting a friend usually meant making a phone call or meeting after school. These days, messages and group chats have become the default, especially because my friends study or work in different places. I appreciate how easy it is to share information and make plans, but I have also experienced misunderstandings when a short message sounded colder than I intended. Last year, a friend thought I was upset with him because I replied very briefly during an exam week. We talked by phone and cleared things up immediately. Since then, I have tried to choose the method of communication based on the situation rather than simply using what is fastest."
    rationale: "변화가 발생한 맥락과 하나의 구체적 사건을 덧붙이며 긴 설명을 시도함. 다양한 과제에서의 안정성은 미확인임."
    upgrade_tip: "시간대의 이동과 예상치 못한 문제가 포함되어도 연결된 설명 유지하기."
  AL:
    text: "My communication habits have changed significantly since middle school. Back then, I would often call friends after dinner, and we sometimes talked for an hour without needing a particular reason. Now our schedules rarely match, so group chats and short messages are far more practical. They help us organize events quickly, but their convenience has a disadvantage: a message can be misinterpreted when the reader cannot hear the speaker’s tone. I experienced that last year when a brief reply I sent during exams made a friend think I was annoyed. Once I noticed the misunderstanding, I called him, explained why I had been distracted, and apologized for sounding abrupt. Since then, I have become more deliberate about how I communicate. I still use messages for routine information, but I prefer a call or an in-person conversation when a matter is emotional or complicated."
    rationale: "과거와 현재의 변화, 관련 사건의 문제 해결, 변화된 판단 또는 습관을 응집된 문단으로 설명함. Advanced Low 특징을 보여주는 합성 예시임."
    upgrade_tip: null

# Q030 질문: Do you prefer shopping online or in physical stores? Explain your opinion with examples.
# 한국어: 온라인 쇼핑과 오프라인 쇼핑 중 어떤 것을 선호하는지 이유와 예시를 들어 설명하시오.
Q030:
  NL:
    text: "Online. Easy. Cheap. Phone."
    rationale: "주제와 관련된 단어만 말하며 온라인과 오프라인 쇼핑 선호에 대한 주장을 완성하지 못함."
    upgrade_tip: "I prefer / I support / I think 등을 사용해 입장을 한 문장으로 말하기."
  NM:
    text: "I like online shopping. It is easy. I buy shoes. It is good."
    rationale: "익숙한 찬반 표현은 제시하지만 주장을 뒷받침할 내용이 부족함."
    upgrade_tip: "주장의 이유를 because 문장으로 하나 제시하기."
  NH:
    text: "I shop online because it cheap. I look pictures. I buy clothes. But sometimes size wrong."
    rationale: "기본적인 선호와 짧은 이유를 제시하나 표현 범위가 좁음."
    upgrade_tip: "반대되는 선택지와의 차이를 간단히 덧붙이기."
  IL:
    text: "I prefer online shopping. I can compare prices on my phone. I usually buy books and small items online. I do not need to travel to a store. Sometimes the delivery is slow. I buy shoes at a physical store because I want to try them on."
    rationale: "온라인과 오프라인 쇼핑 선호에 대한 의견과 이유를 독립 문장으로 설명함."
    upgrade_tip: "자신의 생각을 뒷받침할 실제 사례를 한 가지 말하기."
  IM1:
    text: "I prefer shopping online for most things because I can compare products at home. For example, when I need a new backpack, I check several websites and read reviews. The main problem is that photos can be misleading. That is why I still visit a store when I buy shoes or expensive clothes."
    rationale: "명확한 선호나 주장을 제시하고 이유 또는 사례를 여러 문장으로 연결함."
    upgrade_tip: "장점뿐 아니라 불편하거나 걱정되는 부분을 덧붙이기."
  IM2:
    text: "Online shopping is generally my first choice because it saves time and makes price comparisons easy. I often buy books or computer accessories after checking reviews from other customers. However, I do not trust photos completely, especially for clothing. I once ordered shoes that looked comfortable but did not fit at all, so I had to return them. Since then, I have preferred physical stores for items where size and comfort matter."
    rationale: "의견을 구체적인 경험과 장단점에 연결함. 익숙한 내용의 문장 연쇄가 중심임."
    upgrade_tip: "입장이 성립하는 조건과 구체적인 선택 기준을 설명하기."
  IM3:
    text: "I prefer online shopping for everyday purchases, mainly because it lets me compare many options without spending an afternoon visiting stores. I check product specifications and read several reviews before ordering. Still, I think physical stores are better for things that need to be tried on. For instance, after returning a pair of uncomfortable shoes I bought online, I started visiting a store to check the fit before making a decision. In my view, the best choice depends on what I am buying rather than on the shopping method itself."
    rationale: "자신의 입장을 조직적으로 밝히고 반대 측면이나 조건까지 고려함. 단일 답변만으로 상위 등급을 단정할 수 없음."
    upgrade_tip: "실제 발생할 수 있는 문제에 대한 대응책을 제안하기."
  IH:
    text: "Overall, I prefer shopping online because I can compare prices, check detailed information, and order things without leaving home. It is especially useful when I need a specific electronic accessory that local stores may not carry. However, my preference has limits. I once ordered a jacket that looked perfect in the photographs but fit badly when it arrived. The return process took longer than expected, and I wished I had tried it on first. Since then, I have become more selective: I buy routine items online, but I visit physical stores for clothing and products that are expensive or difficult to return. That balance works better for me than choosing one method all the time."
    rationale: "개인적인 경험과 우려를 연결하며 더 긴 의견 설명을 시도함. 추상적인 논증까지 요구하지 않으며 일관성은 별도 검증 대상임."
    upgrade_tip: "낯선 후속 질문에서도 근거, 현실적 제약, 대안을 일관되게 제시하기."
  AL:
    text: "I generally prefer online shopping because it gives me access to a wider range of products and makes it easy to compare prices, specifications, and customer feedback. When I needed a replacement accessory for my laptop, for example, I found several compatible options online that were not available in nearby stores. However, I would not say that shopping online is always better. Last winter, I ordered a jacket after reading positive reviews, only to discover that the fit was completely wrong. Returning it required additional packaging and several days of waiting. As a result, I changed the way I make purchases: I order standardized products online, while I try on clothing and examine expensive items in person whenever possible. I also check the return policy before placing an order, rather than treating it as an afterthought. For me, convenience matters, but being able to make an informed decision matters even more."
    rationale: "의견의 근거와 예상되는 현실적 문제, 조건부 대안 및 실행 가능성을 문단 수준으로 설명함. Advanced Low 특성을 보여주는 합성 예시임."
    upgrade_tip: null

# Q031 질문: Describe a meal you tried to cook yourself. What went well or wrong, and how did it turn out?
