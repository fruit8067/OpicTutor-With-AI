  IL:
    text: "Take exit two from the station. Walk straight for five minutes. Turn right at the bank. The museum is next to a small park. If the road is closed, walk around the block. You can also take the small bus from the station. It stops near the museum. There are signs near the crossing."
    rationale: "역에서 박물관까지의 길의 필수 정보를 자신의 문장으로 말하지만 문장 사이 연결과 구체적 상황 확장이 적음."
