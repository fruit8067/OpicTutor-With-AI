# OPIc 등급 대조 세트 Q018~Q037 (20개 신규 질문 × 9개 등급 = 180개 답변)
# source_tier C: ACTFL Proficiency Guidelines 2024, Speaking pp. 12~22를 참고한 창작·합성 예시
# 원본과 동일한 필드: NL/NM/NH/IL/IM1/IM2/IM3/IH/AL 하위 text / rationale / upgrade_tip
# ACTFL의 말하기 FACT(Functions, Accuracy, Context/Content, Text Type)와
# Novice/Intermediate/Advanced 기능의 차이를 교육 목적에 맞게 재구성함.
# 주의: IM1·IM2·IM3은 국내 OPIc IM 구간의 세분 표기이며,
# ACTFL 2024 문서는 Intermediate Mid를 그 세 단계로 각각 정의하지 않음.
# 단편 텍스트만으로 발음·억양·실제 즉흥 응답·전체 문항 간 지속성을 평가할 수 없으므로
# 예시 등급은 ACTFL 또는 OPIc의 공식 채점 결과가 아님.
# Q010~Q012의 실제 내용은 확인되지 않으므로 이들과의 주제 중복 여부는 검증되지 않음.

# Q018 질문: Describe a mobile app you use frequently. Explain its main features and why it is useful to you.
# 한국어: 자주 사용하는 모바일 앱의 기능, 사용 방식과 도움이 되는 이유를 설명하시오.
Q018:
  NL:
    text: "App... maps. Phone. Bus. Good."
    rationale: "주제의 핵심 단어만 제시해 모바일 앱 활용을 암시함. 독립적인 설명은 거의 없음."
    upgrade_tip: "친숙한 대상의 이름과 특징을 I use / It is 등의 한 문장으로 말하기."
  NM:
    text: "I use a map app. I like it. It is good. I use it every day."
    rationale: "외운 듯한 짧은 표현으로 모바일 앱 활용의 일부만 전달함. 설명의 구체성이 낮음."
    upgrade_tip: "언제·어디서·무엇을 하는지 서로 다른 짧은 문장으로 추가하기."
  NH:
    text: "I use map app on phone. It show bus. I search places. I go school. Very useful."
    rationale: "익숙한 단문을 조합하여 모바일 앱 활용을 말하려 하지만 문장의 완결성과 확장이 제한됨."
    upgrade_tip: "단어 나열을 줄이고 주어와 동사가 있는 문장으로 묘사하기."
  IL:
    text: "I use a map app on my phone. It shows buses and subway routes. I open it before I leave home. I check the arrival time. Sometimes I save places. It helps me get to unfamiliar locations."
    rationale: "친숙한 모바일 앱 활용에 관한 정보를 스스로 만든 독립 문장으로 설명함. 문장 간 조직은 아직 단순함."
    upgrade_tip: "첫 번째 특징에서 다음 특징으로 넘어가는 연결어와 이유를 사용하기."
  IM1:
    text: "I use a map app almost every day. Before I leave for campus, I check how long the bus will take. The app shows several routes, so I choose the fastest one. I also save the locations of cafés and stores that I want to visit. It is especially useful when I travel."
    rationale: "위치·특징·이유 등 정보를 여러 문장으로 연결하여 모바일 앱 활용을 설명함. 구체적 장면은 제한적임."
    upgrade_tip: "실제로 사용하거나 경험한 장면을 한 가지 구체적으로 덧붙이기."
  IM2:
    text: "One app I rely on is a map service. It gives me real-time bus information, walking directions, and estimated travel times. For example, if my usual bus is delayed, I compare it with the subway route. I also use the saved-place feature when friends recommend restaurants. It saves time because I do not have to search for the same place again."
    rationale: "특징과 활용 예시, 장단점 등을 연결해 모바일 앱 활용에 개인적 의미를 부여함. 주로 문장 연쇄 중심임."
    upgrade_tip: "장점과 단점 또는 다른 선택지와의 차이를 한 사례로 보여주기."
  IM3:
    text: "I probably open my map app more often than any other app. On weekday mornings, it helps me decide whether to catch a bus or walk to the station. The live arrival information is convenient, especially when it is raining and I do not want to stand outside for long. I also organize interesting places into lists, so planning an outing with friends is easier. The directions are usually clear, although I still double-check the exits at large stations."
    rationale: "익숙한 모바일 앱 활용을 보다 자신 있게 묘사하고 세부 상황을 덧붙임. 이 문항만으로 Advanced의 지속성을 판단할 수 없음."
    upgrade_tip: "이전 경험과 지금의 모습, 예상 밖의 상황을 하나의 이야기로 확장하기."
  IH:
    text: "I began using my map app regularly after moving to a new area. At first, I depended on it for almost every trip because I did not know the bus routes. Now I mainly use it to compare travel times and check delays. Once, the app sent me toward an exit that was closed for construction. I had to stop, ask someone for directions, and take a different route. That experience reminded me that digital tools are helpful but not perfect. Even so, I would find it difficult to manage my daily commute without the app."
    rationale: "현재의 설명에 과거 경험 또는 복잡해진 상황을 더하여 긴 발화를 시도함. 다른 과제에서의 안정성은 별도 검증이 필요함."
    upgrade_tip: "다른 친숙하지 않은 주제에서도 같은 문단 구성과 시간대 서술을 유지하기."
  AL:
    text: "A navigation app has become an essential part of my routine, but the reason I value it has changed. When I first moved near campus, I used it simply to avoid getting lost. These days, I use its live transit information to make decisions: if a bus is delayed, I compare the train and walking options before leaving home. The saved-place lists are also useful when I organize activities with friends, because I can share several locations rather than sending separate addresses. There was one occasion when the suggested station entrance was closed for repairs. Instead of following the instructions blindly, I checked another exit and confirmed the route with a station employee. I still rely on the app, but I have learned to treat its estimates as guidance rather than guarantees."
    rationale: "시간대의 변화, 구체적인 묘사, 사건의 맥락 및 결과를 연결된 문단으로 설명하는 Advanced Low 특징을 보여 줌. 실제 공인 등급은 아님."
    upgrade_tip: null

# Q019 질문: Tell me about a new hobby or skill you learned. How did you start, and what was challenging?
# 한국어: 새로운 취미 또는 기술을 배우게 된 계기와 어려웠던 점을 설명하시오.
Q019:
  NL:
    text: "Guitar. Friend. Hard. Music."
    rationale: "사건에 관련된 단어만 나열하여 새로운 취미를 배우는 과정을 단편적으로 암시함."
    upgrade_tip: "I went / I lost / I tried처럼 사건을 한 문장으로 완성하기."
  NM:
    text: "I play guitar. I like music. My friend plays guitar. It is fun."
    rationale: "짧은 정형 표현을 이어 새로운 취미를 배우는 과정을 언급하지만 사건 순서와 배경을 충분히 말하지 못함."
    upgrade_tip: "언제·어디서·누구와 있었는지를 익숙한 과거 표현으로 추가하기."
  NH:
    text: "I learn guitar last year. My friend teach me. My fingers hurt. I practice at home. Now I play song."
    rationale: "짧은 문장으로 사건을 전달하려 하나 시제나 인과관계 표현이 제한적임."
    upgrade_tip: "주요 동사의 과거형과 사건의 순서를 명확히 말하기."
  IL:
    text: "I started learning the guitar last year. My friend showed me a few chords. I watched videos at home. My fingers hurt at first. I practiced for twenty minutes each evening. Now I can play a simple song."
    rationale: "과거에 있었던 새로운 취미를 배우는 과정을 독립 문장으로 전달함. 배경·행동·결과의 연결은 단순함."
    upgrade_tip: "처음·중간·끝을 연결하고 왜 그런 행동을 했는지 설명하기."
  IM1:
    text: "I started playing the guitar because my roommate often played music in our room. He taught me three basic chords, and I practiced them every evening. Changing chords was difficult at first, so I used a slow practice video. After a month, I could play part of my favorite song. That made me want to continue."
    rationale: "익숙한 사건의 시작·진행·결과를 일련의 문장으로 표현하며 기본적인 이유를 제시함."
    upgrade_tip: "문제가 발생한 정확한 순간과 자신의 반응을 묘사하기."
  IM2:
    text: "I took up the guitar after hearing my roommate play an acoustic song. He lent me an old guitar and taught me the basics. At first, I could not change chords quickly, and my fingertips were sore. Instead of trying to learn a whole song, I practiced short sections for fifteen minutes a day. A few weeks later, I managed to play along with a recording, which felt like a big achievement."
    rationale: "사건의 원인과 행동, 감정을 추가해 새로운 취미를 배우는 과정을 좀 더 구체적으로 설명함. 문장 연쇄가 주축임."
    upgrade_tip: "선택한 해결 방법과 선택하지 않은 대안을 구분해 말하기."
  IM3:
    text: "Learning the guitar has been one of the most rewarding things I have tried recently. I became interested when a friend played at a small gathering and offered to teach me. The first challenge was coordinating my hands: I could remember the chords, but the rhythm fell apart whenever I changed them. I recorded myself once a week and noticed that even small improvements were easier to hear than to feel. I still make mistakes, but I can now play two songs from beginning to end."
    rationale: "시간 순서와 세부 상황을 자연스럽게 연결하고 개인적인 평가를 더함. Advanced의 안정적 수행 여부는 미확인임."
    upgrade_tip: "문제가 더 복잡해졌을 때의 대처 과정을 길게 전개하기."
  IH:
    text: "I started learning the guitar about a year ago because I wanted an activity that did not involve a computer. A friend helped me choose a used instrument and showed me how to practice basic chords. For the first month, progress was frustratingly slow, and I almost stopped when I could not keep up with a simple song. My friend suggested slowing the recording down and practicing just the difficult transition. That worked surprisingly well. These days I play for a few minutes after studying, and it helps me relax. I would like to join a casual music group eventually, although I know I still need plenty of practice."
    rationale: "서술의 배경과 돌발 상황 및 대응을 문단 형태로 설명함. 이런 수행을 다양한 상황에서 지속하는지는 판단할 수 없음."
    upgrade_tip: "낯선 상황에서도 사건 서술, 시제, 대안 설명을 안정적으로 유지하기."
  AL:
    text: "About a year ago, I decided to learn the guitar as a way to unwind after long days at university. I had always enjoyed listening to acoustic music, but I had assumed playing it would come naturally. It did not. When my friend first taught me a few chords, I struggled to change between them without losing the rhythm, and my fingertips were sore for days. I considered giving up until he helped me break one song into smaller sections and practice each transition slowly. I also started recording short clips every weekend so I could hear my progress. Over time, the changes became smoother, and I finally managed to play the entire song for a few friends. I still make mistakes, but now I understand that steady practice matters more than trying to sound impressive immediately."
    rationale: "상황의 배경, 예상 밖의 변화, 대안과 결과를 응집된 문단으로 서술하고 관련된 시간대를 다룸. Advanced Low 특징을 드러내는 합성 예시임."
    upgrade_tip: null

# Q020 질문: You bought a jacket, but it is the wrong size. Call the store, explain the problem, and ask about an exchange or refund.
# 한국어: 옷을 구매했는데 사이즈가 맞지 않는다. 매장에 전화해 교환·환불 조건을 확인하고 해결책을 요청하시오.
Q020:
  NL:
    text: "Jacket... too small. Exchange? Please."
    rationale: "필수 단어와 짧은 요청만 제시하여 옷 사이즈 문제와 교환·환불 요청의 목적을 충분히 전달하지 못함."
    upgrade_tip: "Hello, I need help with ... 와 같은 간단한 용건 문장을 연습하기."
  NM:
    text: "Hello. I buy jacket. Too small. I want big size. Can I change?"
    rationale: "암기한 요청 표현을 통해 옷 사이즈 문제와 교환·환불 요청의 기본 의도를 알리지만 구체적 정보가 부족함."
    upgrade_tip: "예약·구매·위치 등 핵심 정보를 한두 문장으로 정확히 전달하기."
  NH:
    text: "Hello. My jacket is small. I buy yesterday. I have receipt. Do you have large? I want change it."
    rationale: "짧은 문장과 정형 질문으로 상황과 요구를 부분적으로 전달함."
    upgrade_tip: "완전한 질문 문장으로 원하는 조치를 요청하기."
  IL:
    text: "Hello, I bought a jacket yesterday. It is too small for me. I have the receipt and the tag. Can I exchange it for a larger size? Is the large size available? When can I visit the store?"
    rationale: "필요한 정보와 기본 질문을 독립적인 문장으로 전달해 옷 사이즈 문제와 교환·환불 요청에 대응함."
    upgrade_tip: "문제의 원인과 원하는 결과를 순서대로 설명하기."
  IM1:
    text: "Hello, I bought a medium jacket at your store yesterday, but it is too tight around the shoulders. I have not worn it outside, and I still have the receipt. Could you check whether a large is in stock? If it is, I would like to exchange it this weekend. Please tell me if I need to bring anything else."
    rationale: "상황을 간단히 설명하고 1~2개의 구체적 요청을 연결된 문장으로 전달함."
    upgrade_tip: "상대에게 확인할 조건(시간·비용·가능 여부)을 구체적으로 질문하기."
  IM2:
    text: "Hi, I purchased a jacket at your downtown store on Saturday, but after trying it on at home, I realized the sleeves were too short. I still have the tags attached. Could you tell me whether an exchange is possible, and whether you have the next size up? If that size is unavailable, I would also like to know your refund policy and the deadline for returning it."
    rationale: "원인·조건·희망사항을 제시하며 질문과 대안을 추가함. 주로 예측 가능한 상황에서의 문장 연쇄임."
    upgrade_tip: "첫 해결책이 불가능한 경우를 가정해 두 번째 대안을 제시하기."
  IM3:
    text: "Good afternoon. I am calling about a jacket I bought at your store three days ago. Although I tried it on briefly, I noticed at home that the shoulders are uncomfortably tight. It has not been worn outdoors, and I still have both the receipt and the original tags. Would you mind checking whether the next size is available at your branch? If not, could another branch reserve one for me, or would I need to request a refund? I can come in tomorrow afternoon."
    rationale: "실용적인 질문과 대안을 자연스럽게 연결하고 추가 조건까지 언급함. 한 문항만으로 Advanced 수행 지속성은 미확인임."
    upgrade_tip: "추가 제약, 상대의 응답, 다음 단계를 자연스럽게 연결하기."
  IH:
    text: "Hello, I am calling about an exchange. I purchased a medium jacket on Monday and realized later that it is too small to wear comfortably over a sweater. The jacket is unused, and I have the receipt and all the tags. Could you check whether the large size is available? I understand that your store may not have one, so I would also like to ask whether another branch could hold it for me. If the item is completely sold out, would a refund to my original payment method be possible? I can visit after work tomorrow, and I would appreciate knowing which documents to bring."
    rationale: "예기치 않은 제약을 고려해 대안을 제시하고 상대방의 조치를 요청하는 긴 발화를 수행함. 일관성은 별도 확인이 필요함."
    upgrade_tip: "예상치 못한 거절이나 새 제약에도 구체적 해결책을 지속적으로 설명하기."
  AL:
    text: "Good afternoon. I am hoping you can help me resolve a sizing problem with a jacket I purchased from your store earlier this week. I bought a medium after trying it on quickly, but when I tried it again over a sweater at home, the shoulders felt too tight. It has not been worn outside, and I have kept the receipt and original tags. My preference would be to exchange it for a large. Would you be able to check stock at your branch or arrange a transfer from another location? If neither option is available, could you explain whether the purchase qualifies for a refund and how the money would be returned? I am leaving town on Friday, so it would be helpful to know whether I could complete the exchange by Thursday. If the process takes longer, I could arrange for someone to collect the replacement on my behalf."
    rationale: "문제를 명료하게 설명하고 제약·우선순위·여러 가능한 대안·후속 조치를 유기적으로 연결함. Advanced Low 특징을 보이도록 만든 합성 대화 발화임."
    upgrade_tip: null

# Q021 질문: You made an appointment for a haircut, but your schedule has changed. Call the salon and reschedule it.
# 한국어: 미용실 예약을 변경해야 한다. 전화로 사유를 설명하고 가능한 날짜와 변경 조건을 확인하시오.
Q021:
  NL:
    text: "Haircut... Friday. Change. Monday?"
    rationale: "필수 단어와 짧은 요청만 제시하여 미용실 예약 변경의 목적을 충분히 전달하지 못함."
    upgrade_tip: "Hello, I need help with ... 와 같은 간단한 용건 문장을 연습하기."
  NM:
    text: "Hello. I have haircut Friday. I cannot go. Monday okay?"
    rationale: "암기한 요청 표현을 통해 미용실 예약 변경의 기본 의도를 알리지만 구체적 정보가 부족함."
    upgrade_tip: "예약·구매·위치 등 핵심 정보를 한두 문장으로 정확히 전달하기."
  NH:
    text: "Hello. I booked Friday three. I have class. Can I move appointment? Monday afternoon? Thank you."
    rationale: "짧은 문장과 정형 질문으로 상황과 요구를 부분적으로 전달함."
    upgrade_tip: "완전한 질문 문장으로 원하는 조치를 요청하기."
  IL:
    text: "Hello, I have a haircut appointment on Friday at three. My class schedule has changed. Can I move the appointment to Monday? Do you have any time after two? My name is Jina Lee. Thank you."
    rationale: "필요한 정보와 기본 질문을 독립적인 문장으로 전달해 미용실 예약 변경에 대응함."
    upgrade_tip: "문제의 원인과 원하는 결과를 순서대로 설명하기."
  IM1:
    text: "Hello, I booked a haircut for Friday at three, but I just found out that I have an extra class at that time. I am sorry for the change. Could you check whether Monday afternoon is available? I would prefer the same stylist, if possible. Please let me know whether there is a cancellation fee."
    rationale: "상황을 간단히 설명하고 1~2개의 구체적 요청을 연결된 문장으로 전달함."
    upgrade_tip: "상대에게 확인할 조건(시간·비용·가능 여부)을 구체적으로 질문하기."
  IM2:
    text: "Hi, I am calling to change a haircut appointment I made for this Friday at three. My professor added a required session, so I will not be able to get there on time. Would you have an opening on Monday or Tuesday after two? I would really like to keep the same stylist. Also, could you tell me whether there is a fee for rescheduling with this much notice?"
