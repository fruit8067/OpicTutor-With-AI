    text: "The most memorable movie I have seen recently was a science-fiction drama about an astronaut who leaves Earth on a mission. At first, I expected the film to focus mainly on technology and dangerous space travel. Instead, the emotional center was his relationship with his daughter, who was growing up while he was away. One sequence, in which he receives years of video messages at once, made the cost of the mission feel much more personal. I had watched plenty of action films before, but this one stayed with me because the scientific ideas and the family story supported each other. I would recommend it even to someone who does not normally like science fiction."
    rationale: "현재의 설명에 과거 경험 또는 복잡해진 상황을 더하여 긴 발화를 시도함. 다른 과제에서의 안정성은 별도 검증이 필요함."
