# OPIc 등급 대조 세트 09 — Q188~Q237
# source_tier C: 교육용 합성 답변; ACTFL Proficiency Guidelines 2024 Speaking 참고
# 주제 참고: 사용자 제공 OPIc 기출 복기 및 AL 학습 계획 문서 2종
# 원문이 확인되지 않는 경우 답변과 일치하도록 새로 만든 OPIc 스타일 질문임 (실제 기출 원문 아님).
# 총 50문항 × 9개 등급 = 450개 합성 답변
# 각 등급: text / rationale / upgrade_tip ; AL upgrade_tip: null
# 실제 OPIc 등급은 단일 답변 원고가 아니라 즉흥 말하기의 지속성·정확성·명료성 등으로 판단됨.

# Q188 질문: Tell me about a memorable time you volunteered at a community event. What were you supposed to do, what unexpected situation came up, and how did you handle it?
Q188:
  NL:
    text: "Volunteer... many people. Supplies."
    rationale: "지역 봉사활동에서 갑자기 참가자가 늘어난 경험: 사건의 핵심 낱말만 표현해 과거 경험을 문장으로 서술하지 못함"
    upgrade_tip: "일이 일어났다는 사실을 과거형 문장 하나로 말하기"
  NM:
    text: "I help at a book event. I like helping. Many people come. We need chairs. Good."
    rationale: "지역 봉사활동에서 갑자기 참가자가 늘어난 경험: 기억한 표현으로 경험을 언급하지만 사건 순서와 자신의 행동을 거의 설명하지 못함"
    upgrade_tip: "언제·어디서 일어났는지를 짧은 문장으로 추가하기"
  NH:
    text: "I volunteer last weekend. Too many people come. We have not chairs. I bring more chairs. Everybody happy."
    rationale: "지역 봉사활동에서 갑자기 참가자가 늘어난 경험: 짧고 일부 불완전한 문장으로 문제를 말하지만 과거 시제와 서술 연결이 약함"
    upgrade_tip: "사건의 시작과 문제를 과거형으로 구별해 말하기"
  IL:
    text: "I volunteered at a neighborhood book event last spring. We expected thirty people. Many more people arrived. We needed chairs. I brought extra chairs with another volunteer. Everyone could look at the books. I was tired but happy."
    rationale: "지역 봉사활동에서 갑자기 참가자가 늘어난 경험: 사건과 결과를 독립된 문장으로 전달하지만 문제의 원인과 대처 과정이 단편적임 (관찰 포인트: 참가자가 늘어난 원인과 현장에서 좌석·동선을 조정한 행동)"
    upgrade_tip: "문제를 해결하기 위해 자신이 한 일을 두 문장으로 설명하기"
  IM1:
    text: "Last spring, I helped run a neighborhood book-sharing event. Our team prepared tables and name tags for about thirty visitors. Nearly twice as many people arrived after a local school shared the event online. I asked another volunteer to bring extra chairs and divided the visitors into smaller groups. Everyone had a chance to browse books, and the organizer thanked us for adjusting quickly. I was happy in the end."
    rationale: "지역 봉사활동에서 갑자기 참가자가 늘어난 경험: 사건의 기본 흐름을 문장 여러 개로 전달하고 결과를 말하지만 구체성이 제한적임 (관찰 포인트: 참가자가 늘어난 원인과 현장에서 좌석·동선을 조정한 행동)"
    upgrade_tip: "문제가 생긴 순간의 상황과 감정을 보태기"
  IM2:
    text: "Last spring, I helped run a neighborhood book-sharing event. Our team prepared tables and name tags for about thirty visitors. Everything seemed fine at first, but nearly twice as many people arrived after a local school shared the event online. I wasn't sure what to do, so I asked another volunteer to bring extra chairs and divided the visitors into smaller groups. Luckily, everyone had a chance to browse books, and the organizer thanked us for adjusting quickly. I felt overwhelmed at first but proud that nobody had to leave."
    rationale: "지역 봉사활동에서 갑자기 참가자가 늘어난 경험: 배경과 문제, 대처, 결과를 연결하고 개인적 반응을 덧붙이나 사건 묘사가 다소 압축적임 (관찰 포인트: 참가자가 늘어난 원인과 현장에서 좌석·동선을 조정한 행동)"
    upgrade_tip: "해결 과정에서 선택한 행동과 이유를 구체적으로 말하기"
  IM3:
    text: "Last spring, I helped run a neighborhood book-sharing event. Our team prepared tables and name tags for about thirty visitors. However, nearly twice as many people arrived after a local school shared the event online. At first, I didn't know how we would handle it. Then I asked another volunteer to bring extra chairs and divided the visitors into smaller groups. As a result, everyone had a chance to browse books, and the organizer thanked us for adjusting quickly. I felt overwhelmed at first but proud that nobody had to leave. I learned to prepare a flexible plan rather than rely on one attendance estimate."
    rationale: "지역 봉사활동에서 갑자기 참가자가 늘어난 경험: 시간 순서와 세부 정보가 비교적 자연스럽게 이어지지만 낯선 돌발 상황에서도 같은 수준을 유지하는지는 불명확함 (관찰 포인트: 참가자가 늘어난 원인과 현장에서 좌석·동선을 조정한 행동)"
    upgrade_tip: "예상 밖의 변화에 대처한 선택과 그 결과를 길게 설명하기"
  IH:
    text: "Last spring, I helped run a neighborhood book-sharing event. Our team prepared tables and name tags for about thirty visitors. The difficult part was that nearly twice as many people arrived after a local school shared the event online. I had to make a quick decision rather than ignore the problem. I asked another volunteer to bring extra chairs and divided the visitors into smaller groups. Fortunately, everyone had a chance to browse books, and the organizer thanked us for adjusting quickly. I felt overwhelmed at first but proud that nobody had to leave. Looking back, I learned to prepare a flexible plan rather than rely on one attendance estimate."
    rationale: "지역 봉사활동에서 갑자기 참가자가 늘어난 경험: 과거 경험을 문단에 가깝게 서술하고 돌발 문제 해결을 보여주나 Advanced 과제의 지속성은 한 답변으로 검증되지 않음 (관찰 포인트: 참가자가 늘어난 원인과 현장에서 좌석·동선을 조정한 행동)"
    upgrade_tip: "다른 즉흥 질문에서도 시제와 문제 해결 서술을 안정적으로 유지하기"
  AL:
    text: "Last spring, I helped run a neighborhood book-sharing event. Our team prepared tables and name tags for about thirty visitors. I had expected everything to go smoothly, but nearly twice as many people arrived after a local school shared the event online. For a moment I was unsure what to do, especially because the situation affected other people as well. I decided to act instead of waiting: I asked another volunteer to bring extra chairs and divided the visitors into smaller groups. In the end, everyone had a chance to browse books, and the organizer thanked us for adjusting quickly. I felt overwhelmed at first but proud that nobody had to leave. Afterward, I learned to prepare a flexible plan rather than rely on one attendance estimate. For the next event, I will keep extra supplies ready and assign someone to manage the line."
    rationale: "지역 봉사활동에서 갑자기 참가자가 늘어난 경험: 복잡한 사건의 배경·대처·결과·현재의 의미를 연결하여 Advanced Low 특성을 보여주는 합성 예시임 (관찰 포인트: 참가자가 늘어난 원인과 현장에서 좌석·동선을 조정한 행동) 단일 텍스트만으로 실제 시험 등급을 확정할 수 없음."
    upgrade_tip: null

# Q189 질문: Have you ever returned to a neighborhood you knew when you were younger? Describe what happened during your visit, what had changed, and how you felt.
