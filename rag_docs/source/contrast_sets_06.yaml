# 질문 출처: 아래 영어 질문은 기출 복기의 주제와 기존 등급별 답변에 맞춰 새로 작성한 OPIc 스타일 연습문항으로, 확인된 실제 출제 원문이 아님.
# 등급 대조 세트 (source_tier C: ACTFL 기반 학습용 합성 예시, 공식 채점 답변 아님)
# 범위: Q038~Q087 / 50개 질문 / 9등급(NL, NM, NH, IL, IM1, IM2, IM3, IH, AL)
# 출처 주제: 사용자 제공 오픽 기출 정리와 AL 학습 계획 / 오픽 문항별 기출과 AL 학습 계획
# 평가 준거: ACTFL Proficiency Guidelines 2024 - Speaking (FACT)
# 복기 자료의 주제를 변형한 독립적인 교육용 답변. 실제 출제 문구/실제 OPIc 채점 답변이 아님.
# 형식: Q번호 > NL~AL > text / rationale / upgrade_tip

# Q038 질문: Tell me about a time you changed the furniture or layout in your home. What did you change, why did you change it, and how did it turn out?
Q038:
  NL:
    text: Furniture... room. New desk.
    rationale: 집 안 가구 배치 변경 경험 사례에서 낱말과 끊긴 구절만 제시하므로 과제를 문장으로 수행하지 못하는 예시임.
    upgrade_tip: I changed my desk.처럼 변화 한 가지를 문장으로 말하기.
  NM:
    text: I change desk. My room is good. I like new desk.
    rationale: 집 안 가구 배치 변경 경험에 관한 익숙한 표현을 반복하지만 요청된 정보를 구체적으로 확장하지 못하는 예시임.
    upgrade_tip: 언제 무엇을 바꾸었는지 짧은 문장을 덧붙이기.
  NH:
    text: Last month I buy new desk. Old desk very small. New desk big and white. I study there.
    rationale: 집 안 가구 배치 변경 경험에 대해 짧은 문장으로 시도하지만 불완전한 문장이나 제한된 구조가 드러나는 예시임.
    upgrade_tip: 바꾸기 전과 후를 was/is로 구분해 설명하기.
  IL:
    text: I changed my desk last month. The old one was too small. My new desk is bigger. I moved my lamp. I can study better. My room looks nice now.
    rationale: 집 안 가구 배치 변경 경험의 기본 정보를 독립적인 문장으로 전달하지만 문장 간 확장과 연결이 제한된 예시임.
    upgrade_tip: 바꾼 이유를 because로 연결하기.
  IM1:
    text: Last month, I rearranged my room because I needed more space to study. I replaced my small desk with a larger one and moved my bookshelf near the door. My father helped me carry the furniture. Now I can spread out my books, and the room feels brighter.
    rationale: 집 안 가구 배치 변경 경험의 핵심 요구를 문장들을 이어 설명하되 구체적인 근거나 상호작용의 폭이 좁은 예시임.
    upgrade_tip: 가구를 옮긴 순서와 결과를 덧붙이기.
  IM2:
    text: I decided to reorganize my room before the new semester. The desk was too close to my bed, so I often felt sleepy when I studied. My father helped me move it next to the window, and we put a shelf where the desk used to be. It took an afternoon, but now my work area feels separate from where I sleep.
    rationale: 집 안 가구 배치 변경 경험에 대해 상황과 이유 또는 구체적 예시를 보태며 발화하지만 내용 전개의 안정성은 발전 중인 예시임.
    upgrade_tip: 처음의 불편함과 바꾼 뒤의 차이를 구체적으로 말하기.
  IM3:
    text: I recently changed the layout of my room to make studying easier. I used to work at a narrow desk beside my bed, and papers would end up everywhere. I measured the wall first, bought a secondhand desk, and placed it beside the window. Then I moved the bookshelf closer so I could reach my notes. The change was simple, but having a dedicated work area has made my evenings less distracting.
    rationale: 집 안 가구 배치 변경 경험에서 세부 사항과 문장 연결을 비교적 안정적으로 구사하나 Advanced 수준의 지속적 수행을 입증하지는 않는 예시임.
    upgrade_tip: 예상과 달랐던 일과 대응을 사건으로 설명하기.
  IH:
    text: The biggest improvement I made to my room was reorganizing my study area last semester. I had been preparing for several exams, and the small desk was covered with books and charging cables. I bought a used desk online, but when it arrived, it was too wide for the space I had measured. Rather than returning it immediately, I drew a new layout, moved the bookshelf, and asked my brother to help me lift the furniture. We finally made everything fit. Now I have more room for my laptop and notes, and I am much less distracted when I study.
    rationale: 집 안 가구 배치 변경 경험를 배경·세부사항·상황에 맞춰 연결하며 Advanced형 과제를 일부 수행함. 다른 즉흥 질문에서도 이를 지속할 수 있는지는 확인되지 않음.
    upgrade_tip: 다른 수리·변경 경험을 물어도 시간대와 문제 해결을 이어 말하기.
  AL:
    text: Last semester, I redesigned a corner of my bedroom because my previous setup was making it difficult to concentrate. I had a narrow desk squeezed between the bed and a bookshelf, and every time I needed a textbook, I had to clear a pile of things. I ordered a larger secondhand desk after measuring the wall, but I overlooked the space needed to open the closet door. Once we assembled it, the door kept hitting the edge. I considered reselling the desk, then realized that shifting the bookshelf to the opposite wall would solve the problem without blocking the window. My brother helped me rearrange the room, and we checked that the closet and drawers could open fully. Since then, I have kept my work materials in one place and my bed area separate. If I move next year, I will measure access space as carefully as the furniture itself.
    rationale: 집 안 가구 배치 변경 경험의 요구를 여러 시간대와 관련 정보를 조화롭게 조직하고, 필요할 때 예상 밖의 문제까지 처리하는 문단 수준의 합성 예시임.
    upgrade_tip: null
# Q039 질문: How does your family share household chores these days? Compare your responsibilities now with the chores you did when you were younger. What has changed, and why?
Q039:
  NL:
    text: Dishes... mom. I clean.
    rationale: 과거와 현재의 집안일 분담 비교 사례에서 낱말과 끊긴 구절만 제시하므로 과제를 문장으로 수행하지 못하는 예시임.
    upgrade_tip: I wash dishes.처럼 자신의 역할을 한 문장으로 말하기.
  NM:
    text: I wash dishes. Mom cook. I clean room. Good.
    rationale: 과거와 현재의 집안일 분담 비교에 관한 익숙한 표현을 반복하지만 요청된 정보를 구체적으로 확장하지 못하는 예시임.
    upgrade_tip: 가족 구성원 한 명의 역할도 더하기.
  NH:
    text: Now I wash dishes at home. My mother cooks food. When I young, I not do chores.
    rationale: 과거와 현재의 집안일 분담 비교에 대해 짧은 문장으로 시도하지만 불완전한 문장이나 제한된 구조가 드러나는 예시임.
    upgrade_tip: 과거에는 무엇을 했는지 짧은 문장으로 대비하기.
  IL:
    text: At home, my mother usually cooks and I wash the dishes. My father takes out the trash. When I was little, I did not do much housework. Now I clean my room every weekend.
    rationale: 과거와 현재의 집안일 분담 비교의 기본 정보를 독립적인 문장으로 전달하지만 문장 간 확장과 연결이 제한된 예시임.
    upgrade_tip: 과거와 현재의 차이에 대해 이유를 제시하기.
  IM1:
    text: My family shares several household chores. I wash dishes after dinner, while my father handles recycling and my mother usually cooks. When I was in elementary school, I only made my bed. Now I do more because everyone is busy. We try to finish the chores before watching television.
    rationale: 과거와 현재의 집안일 분담 비교의 핵심 요구를 문장들을 이어 설명하되 구체적인 근거나 상호작용의 폭이 좁은 예시임.
    upgrade_tip: 가족별 역할을 한 번에 설명하고 구체적 루틴을 보태기.
  IM2:
    text: These days, everyone in my family has a regular job around the house. I usually wash the dishes and vacuum the living room, while my parents handle cooking and laundry. When I was younger, I hardly did any chores except cleaning my own desk. My responsibilities increased when I entered university, partly because my parents started working longer hours. I think it is a fairer arrangement now.
    rationale: 과거와 현재의 집안일 분담 비교에 대해 상황과 이유 또는 구체적 예시를 보태며 발화하지만 내용 전개의 안정성은 발전 중인 예시임.
    upgrade_tip: 역할이 바뀐 계기와 예시를 연결하기.
  IM3:
    text: Our approach to housework has changed quite a lot. As a child, I only cleaned my room when my parents reminded me, and my mother handled most of the cooking and laundry. Now we divide the work according to our schedules. I cook simple meals on weekends, my father takes care of recycling, and we take turns cleaning the bathroom. We use a shared calendar so nobody forgets. I do not enjoy every task, but I appreciate how much work running a household takes.
    rationale: 과거와 현재의 집안일 분담 비교에서 세부 사항과 문장 연결을 비교적 안정적으로 구사하나 Advanced 수준의 지속적 수행을 입증하지는 않는 예시임.
    upgrade_tip: 분담 과정의 갈등과 해결을 구체적으로 서술하기.
  IH:
    text: When I was growing up, household chores were not divided very evenly. My mother did most of the work, while I was expected to keep my room tidy and occasionally take out the trash. Things changed after my parents became busier, so we started discussing who had time for each task. I now prepare breakfast several mornings a week, and my father does the grocery shopping. At first, I kept forgetting to clean the kitchen, which caused arguments. We made a simple schedule, and that has reduced confusion. I would say the biggest difference is that we now see housework as a shared responsibility rather than one person's job.
    rationale: 과거와 현재의 집안일 분담 비교를 배경·세부사항·상황에 맞춰 연결하며 Advanced형 과제를 일부 수행함. 다른 즉흥 질문에서도 이를 지속할 수 있는지는 확인되지 않음.
    upgrade_tip: 예상치 못한 일정 변경 상황에서도 조정 방안을 일관되게 설명하기.
  AL:
    text: 'The way my family manages housework has gradually shifted from informal expectations to a more balanced system. When I was younger, my mother handled nearly everything, and I thought cleaning my room counted as a significant contribution. After I entered university, my parents'' work schedules changed, and it became clear that this arrangement was exhausting for her. We discussed which tasks had to be done daily and which could wait until the weekend. I took responsibility for breakfast and vacuuming, while my father began shopping and separating recycling. The first attempt was not perfect: I missed a cleaning day during exams, and everyone assumed someone else would do it. Instead of blaming one another, we set up a shared checklist and agreed to exchange tasks in advance when someone was busy. We still adjust it occasionally, but the system has made the workload more visible
      and much fairer.'
    rationale: 과거와 현재의 집안일 분담 비교의 요구를 여러 시간대와 관련 정보를 조화롭게 조직하고, 필요할 때 예상 밖의 문제까지 처리하는 문단 수준의 합성 예시임.
    upgrade_tip: null
# Q040 질문: Tell me about a time you got hurt while hiking. Where were you, what happened on the trail, and what did you and the people with you do afterward?
Q040:
  NL:
    text: Mountain... knee. Hurt.
    rationale: 등산 중 사고의 배경·대처·결과 사례에서 낱말과 끊긴 구절만 제시하므로 과제를 문장으로 수행하지 못하는 예시임.
    upgrade_tip: I hurt my ankle.이라는 핵심 문장으로 사건 말하기.
  NM:
    text: I hike mountain. My leg hurt. Very bad.
    rationale: 등산 중 사고의 배경·대처·결과에 관한 익숙한 표현을 반복하지만 요청된 정보를 구체적으로 확장하지 못하는 예시임.
    upgrade_tip: 언제 누구와 등산했는지 추가하기.
  NH:
    text: Last year I go hiking with friend. I fall and hurt knee. My friend help me.
    rationale: 등산 중 사고의 배경·대처·결과에 대해 짧은 문장으로 시도하지만 불완전한 문장이나 제한된 구조가 드러나는 예시임.
    upgrade_tip: 넘어진 일과 그다음 행동을 짧게 순서대로 말하기.
  IL:
    text: I went hiking with my friend last fall. I slipped on a rock. My knee hurt. We stopped walking. My friend gave me water. We went home early.
    rationale: 등산 중 사고의 배경·대처·결과의 기본 정보를 독립적인 문장으로 전달하지만 문장 간 확장과 연결이 제한된 예시임.
    upgrade_tip: 왜 다쳤는지와 이후 어떻게 이동했는지 연결하기.
  IM1:
    text: Last fall, I went hiking with two friends. On the way down, I slipped on a wet stone and hurt my ankle. We sat near the trail for a while, and one friend helped me walk slowly. We decided not to finish the hike. I rested for a few days afterward.
    rationale: 등산 중 사고의 배경·대처·결과의 핵심 요구를 문장들을 이어 설명하되 구체적인 근거나 상호작용의 폭이 좁은 예시임.
    upgrade_tip: 사고 당시 주변 상황과 자신의 행동을 추가하기.
  IM2:
    text: I once hurt my ankle while hiking in the mountains near my city. It had rained the night before, so the path was slippery. While walking downhill, I stepped on a loose rock and lost my balance. My friend helped me move to a safe spot, and we checked whether I could put weight on my foot. Since it still hurt, we turned around and took a shorter route down.
    rationale: 등산 중 사고의 배경·대처·결과에 대해 상황과 이유 또는 구체적 예시를 보태며 발화하지만 내용 전개의 안정성은 발전 중인 예시임.
    upgrade_tip: 사고의 원인·대응·결과를 과거형으로 연결하기.
  IM3:
    text: One memorable hiking trip ended earlier than expected because I twisted my ankle. My friends and I had reached the top, and we were excited to get down before sunset. On a narrow downhill section, I stepped on an unstable stone and slipped. My friends stopped immediately, gave me time to rest, and helped me use a walking stick. We took the easier trail back instead of the steep one. The injury was minor, but now I pay much closer attention to footwear and the weather before a hike.
    rationale: 등산 중 사고의 배경·대처·결과에서 세부 사항과 문장 연결을 비교적 안정적으로 구사하나 Advanced 수준의 지속적 수행을 입증하지는 않는 예시임.
    upgrade_tip: 부상 이후 바뀐 준비 습관까지 설명하기.
  IH:
    text: A few years ago, I twisted my ankle during a hiking trip with friends. We had started early, but rain from the previous evening had made some downhill sections slippery. I lost my footing on a loose rock and felt a sharp pain. At first, I thought I could walk normally, but the swelling made that difficult. My friends helped me off the narrow path, and one of them checked the trail map for a nearby exit. We slowed down, used a walking pole for support, and reached a road where we could get a taxi. I visited a clinic that evening and avoided hiking for several weeks. The incident changed how I prepare for outdoor activities.
    rationale: 등산 중 사고의 배경·대처·결과를 배경·세부사항·상황에 맞춰 연결하며 Advanced형 과제를 일부 수행함. 다른 즉흥 질문에서도 이를 지속할 수 있는지는 확인되지 않음.
    upgrade_tip: 부상의 심각도가 달랐거나 친구가 부상당한 경우에도 대안 선택을 설명하기.
  AL:
    text: One autumn, I joined two friends for a hike that we had planned for weeks. The climb itself went smoothly, but the descent became difficult because the trail was still wet from overnight rain. I slipped on a loose stone and twisted my ankle badly enough that I could not walk at my usual pace. We initially considered continuing down the shortest route, but it was steep and uneven, so I suggested looking for an easier exit. One friend checked the park map while the other helped me move away from the crowded path. We found a longer but gentler trail, took frequent breaks, and called a taxi from the visitor center. A doctor later confirmed that I needed rest rather than surgery. Ever since then, I have checked trail conditions, carried basic supplies, and told someone our planned route. I still enjoy hiking, but I no longer treat preparation as optional.
    rationale: 등산 중 사고의 배경·대처·결과의 요구를 여러 시간대와 관련 정보를 조화롭게 조직하고, 필요할 때 예상 밖의 문제까지 처리하는 문단 수준의 합성 예시임.
    upgrade_tip: null
# Q041 질문: Describe a beach you enjoy visiting. Where is it, what do you normally do there, and can you tell me about a visit that you especially remember?
Q041:
  NL:
    text: Beach... sand. Sea. Friends.
    rationale: 해변의 특징·활동·돌발 경험 사례에서 낱말과 끊긴 구절만 제시하므로 과제를 문장으로 수행하지 못하는 예시임.
    upgrade_tip: I go to the beach.처럼 한 활동을 문장으로 완성하기.
  NM:
    text: I like beach. I swim. I take picture. Beach good.
    rationale: 해변의 특징·활동·돌발 경험에 관한 익숙한 표현을 반복하지만 요청된 정보를 구체적으로 확장하지 못하는 예시임.
    upgrade_tip: 언제 누구와 방문하는지 한 문장 추가하기.
  NH:
    text: I go beach in summer. I swim with friend. I eat snacks. It is fun.
    rationale: 해변의 특징·활동·돌발 경험에 대해 짧은 문장으로 시도하지만 불완전한 문장이나 제한된 구조가 드러나는 예시임.
    upgrade_tip: 해변에서 하는 활동을 두세 문장으로 배열하기.
  IL:
    text: I like the beach near my hometown. I go there in summer. I walk on the sand and take pictures. Last year, I went there with my friends. We ate seafood and watched the sunset.
    rationale: 해변의 특징·활동·돌발 경험의 기본 정보를 독립적인 문장으로 전달하지만 문장 간 확장과 연결이 제한된 예시임.
    upgrade_tip: 좋아하는 이유와 기억나는 장면을 연결하기.
  IM1:
    text: My favorite beach is about an hour from home. I usually visit in the late afternoon because it is less crowded. I walk by the water, take photos, and buy snacks from a nearby shop. Last summer, my friends and I stayed until sunset. The sky turned orange, and we took a group picture.
    rationale: 해변의 특징·활동·돌발 경험의 핵심 요구를 문장들을 이어 설명하되 구체적인 근거나 상호작용의 폭이 좁은 예시임.
    upgrade_tip: 지난 방문에서 일어난 작은 사건을 추가하기.
  IM2:
