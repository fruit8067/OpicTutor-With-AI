    text: When I was younger, taking public transportation required more guesswork. My family kept a printed subway map, and if we missed a bus, we often had no idea how long the next one would take. Now I check live arrival information on my phone, and transfers are much easier to plan. Last month, for example, I noticed that my usual bus was delayed, so I changed to the subway and still reached campus on time. The system has also become more accessible, with better signs and announcements in many stations. Of course, crowding is still a serious inconvenience, especially at peak times. I think the most significant change is not simply speed but passengers' ability to respond to problems.
