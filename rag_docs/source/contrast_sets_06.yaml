# Q051 질문: Compare singers and composers. What do they have in common, how are their roles different, and how do they contribute to a song?
Q051:
  NL:
    text: Singer... composer. Music.
    rationale: 가수의 표현과 작곡가의 창작에 관해 낱말만 내놓아 질문 기능을 수행하지 못함.
    upgrade_tip: 비교 대상 두 개를 완성된 문장으로 말하기.
  NM:
    text: I like singers. I like composers.
    rationale: 가수의 표현과 작곡가의 창작에 대해 익숙한 짧은 표현으로 반응하지만 새 정보를 충분히 만들지 못함.
    upgrade_tip: before와 now를 이용해 두 시점을 제시하기.
  NH:
    text: Singer sing songs. Composer make music. Both important.
    rationale: 가수의 표현과 작곡가의 창작에 대해 단편적인 문장으로 말하려 하지만 구조와 전개가 제한적임.
    upgrade_tip: 한 가지 공통점과 차이점을 각각 말하기.
  IL:
    text: Singers and composers both make music. A singer performs a song with a voice. A composer writes melodies. Both can express feelings. I usually notice the singer first.
    rationale: 가수의 표현과 작곡가의 창작의 주요 정보를 개별 문장으로 전달하지만 원인·대응·세부 설명이 많지 않음.
    upgrade_tip: 두 항목을 같은 기준으로 비교하기.
  IM1:
    text: Singers and composers work in music, but their jobs are different. Singers perform songs, and composers create the music. Both try to communicate feelings to listeners. I enjoy singing, but I also like learning about songwriting. I think both roles are important.
    rationale: 가수의 표현과 작곡가의 창작에 관한 핵심 요구를 문장들로 연결하나 이유나 후속 상황이 비교적 단순함.
    upgrade_tip: 실제 예시를 덧붙이고 이유를 설명하기.
  IM2:
    text: I think singers and composers are similar because both bring music to life. A singer uses a voice and performance, while a composer creates melodies and arrangements. When I listen to a song, I often notice the singer first. However, I recently watched a video about songwriting, and it helped me understand how much work happens before a recording.
    rationale: 가수의 표현과 작곡가의 창작를 이유 또는 구체적 예시와 연결하지만 표현·전개의 유연성이 더 필요함.
    upgrade_tip: 원인과 자신의 선호를 구체적으로 연결하기.
  IM3:
    text: 'Singers and composers have a common goal: they want music to connect with listeners. Their main difference is the way they achieve that goal. A singer changes a song through timing, tone, and emotion, while a composer develops its musical structure. I once heard two singers perform the same song, and each version felt completely different. Since then, I have started paying more attention to both the written music and the performance.'
    rationale: 가수의 표현과 작곡가의 창작에 필요한 세부 내용을 상당히 안정적으로 설명하나, 다른 즉흥 과제에서도 이 수준을 지속할지는 판단할 수 없음.
    upgrade_tip: 비교의 장점뿐 아니라 한계도 다루기.
  IH:
    text: Although singers and composers are both creative musicians, I think their contributions are distinct. Composers develop the melodies, harmonies, and arrangements, whereas singers interpret those ideas and communicate them directly to an audience. I used to focus almost entirely on the voice, but watching interviews with songwriters changed my perspective. One recording can sound very different when another singer changes the phrasing. For that reason, I would not say one role is more important; the best music often depends on the relationship between them.
    rationale: 가수의 표현과 작곡가의 창작를 자세히 서술하거나 조건에 따라 조정하는 능력을 일부 보여주지만, Advanced 수준의 지속성은 한 답변만으로 확인할 수 없음.
    upgrade_tip: 다른 비교 질문에서도 공통점·차이점·사례를 빠뜨리지 않기.
  AL:
    text: I see singers and composers as partners who contribute different kinds of creativity to the same work. A composer develops melodies, harmonies, and the overall musical direction, while a singer makes choices about tone, phrasing, and emotional delivery. They share the goal of communicating something meaningful, but their tools and responsibilities are different. I became more aware of this after watching a documentary in which a songwriter played an early demo and several singers interpreted it. The basic melody stayed the same, yet each performance brought out a different feeling. That experience taught me not to judge a song solely by the person whose voice I hear. These days, I try to notice both the musical structure and the performance, and I would love to attend a concert where the composer discusses how a piece developed.
    rationale: 가수의 표현과 작곡가의 창작에 대해 문단 수준으로 정보를 조직하고 필요한 비교·서술·후속 대응을 연결하도록 구성한 학습용 예시임.
