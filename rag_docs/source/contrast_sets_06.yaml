  AL:
    text: Public transportation has changed considerably since I was in elementary school. Back then, my family relied on printed route maps and schedules, and we often arrived at bus stops without knowing whether we had just missed a service. Today, transit cards, real-time arrival displays, and navigation apps make the network much easier to use. A few months ago, I was on my way to an important appointment when an app warned me that my usual bus route had been delayed by roadwork. I compared two alternatives, switched to the subway, and sent the person I was meeting an updated arrival time. That kind of decision would have been much harder years ago. Still, technology has not eliminated overcrowding or delays, and people without smartphones may not benefit equally from these improvements. I hope future changes will focus as much on reliable service and accessibility as on digital convenience.
