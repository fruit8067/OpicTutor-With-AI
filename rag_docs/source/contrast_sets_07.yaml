  "IL":
    "text": "I think students should be allowed to use AI tools for support, but they need clear rules about what counts as their own work. AI can help learners find gaps in an explanation and practice unfamiliar ideas. For instance, a student could ask for a simpler example of a difficult concept before solving a problem independently. We should think about this problem."
    "rationale": "학교 과제에서 생성형 AI를 사용할 때 지켜야 할 기준: 의견과 기본 이유를 독립된 문장으로 설명하나 구체적 근거가 적음"
    "upgrade_tip": "실생활 예시를 한 문장으로 덧붙이기"
  "IM1":
    "text": "In my opinion, students should be allowed to use AI tools for support, but they need clear rules about what counts as their own work. One reason is that AI can help learners find gaps in an explanation and practice unfamiliar ideas. For instance, a student could ask for a simpler example of a difficult concept before solving a problem independently. Another point is that unrestricted copying makes it hard for teachers to judge what a student actually understands. I think we should take this seriously."
    "rationale": "학교 과제에서 생성형 AI를 사용할 때 지켜야 할 기준: 입장과 첫 번째 근거를 문장으로 연결하지만 다른 관점 설명이 제한적임"
    "upgrade_tip": "서로 다른 근거 두 가지를 구분하여 말하기"
  "IM2":
    "text": "I believe students should be allowed to use AI tools for support, but they need clear rules about what counts as their own work. First, AI can help learners find gaps in an explanation and practice unfamiliar ideas. For instance, a student could ask for a simpler example of a difficult concept before solving a problem independently. Also, unrestricted copying makes it hard for teachers to judge what a student actually understands. I once saw a group spend more time correcting an AI-generated answer than it would have taken to write the explanation themselves. Some people disagree, but I think we need a better approach."
    "rationale": "학교 과제에서 생성형 AI를 사용할 때 지켜야 할 기준: 사례·근거를 설명하며 생각을 전달하지만 대안의 구체성이 부족함"
    "upgrade_tip": "실제 가능한 해결책을 한 가지 제안하기"
  "IM3":
    "text": "My view is that students should be allowed to use AI tools for support, but they need clear rules about what counts as their own work. One reason is that AI can help learners find gaps in an explanation and practice unfamiliar ideas. For instance, a student could ask for a simpler example of a difficult concept before solving a problem independently. Another factor is that unrestricted copying makes it hard for teachers to judge what a student actually understands. I once saw a group spend more time correcting an AI-generated answer than it would have taken to write the explanation themselves. Of course, some people worry that any AI use will encourage cheating. That is why I think schools could require students to explain how they used AI and show their own reasoning."
    "rationale": "학교 과제에서 생성형 AI를 사용할 때 지켜야 할 기준: 의견·근거·사례를 연결하고 반대 관점을 일부 인정하지만 전개의 폭이 제한적임"
    "upgrade_tip": "반대 의견과 실행 가능한 해결책을 하나의 흐름으로 묶기"
  "IH":
    "text": "I would say that students should be allowed to use AI tools for support, but they need clear rules about what counts as their own work. I have two reasons for this. First, AI can help learners find gaps in an explanation and practice unfamiliar ideas. For instance, a student could ask for a simpler example of a difficult concept before solving a problem independently. Second, unrestricted copying makes it hard for teachers to judge what a student actually understands. I once saw a group spend more time correcting an AI-generated answer than it would have taken to write the explanation themselves. I understand that some people worry that any AI use will encourage cheating, but ignoring the issue would not help. Instead, schools could require students to explain how they used AI and show their own reasoning. Overall, the goal should be responsible learning rather than a complete ban or unlimited use."
    "rationale": "학교 과제에서 생성형 AI를 사용할 때 지켜야 할 기준: 여러 이유와 대안을 설명하지만 추상적 논쟁의 지속성이나 모든 Advanced 과제 수행은 확인되지 않음"
    "upgrade_tip": "다른 공적 이슈 질문에서도 구체적 사례와 한계를 유지하기"
  "AL":
    "text": "I think students should be allowed to use AI tools for support, but they need clear rules about what counts as their own work, although it is not a problem with a single easy answer. To begin with, AI can help learners find gaps in an explanation and practice unfamiliar ideas. For instance, a student could ask for a simpler example of a difficult concept before solving a problem independently. Another factor is that unrestricted copying makes it hard for teachers to judge what a student actually understands. I once saw a group spend more time correcting an AI-generated answer than it would have taken to write the explanation themselves. On the other hand, some people worry that any AI use will encourage cheating, so I would avoid claiming that one rule will solve everything. A practical way forward is this: schools could require students to explain how they used AI and show their own reasoning. That approach would address the immediate problem while leaving room for different\
      \ circumstances. Ultimately, the goal should be responsible learning rather than a complete ban or unlimited use. Clear examples of permitted and prohibited uses would help both teachers and students."
    "rationale": "학교 과제에서 생성형 AI를 사용할 때 지켜야 할 기준: 구체적인 사회적 문제에 대해 근거·사례·실행 대안을 연결하는 Advanced형 합성 예시임 단일 답변만으로 실제 OPIc 등급을 판정할 수 없음."
    "upgrade_tip": null
