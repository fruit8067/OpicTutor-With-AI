  "NH":
    "text": "AI help homework. But students copy answer sometimes. Teacher cannot know. We need rules. I think rules good."
    "rationale": "학교 과제에서 생성형 AI를 사용할 때 지켜야 할 기준: 짧은 문장으로 입장을 표현하지만 이유와 예시가 단편적임"
